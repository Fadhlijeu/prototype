name: GlassOS Autonomous Cloud Generator

on:
  repository_dispatch:
    types: [glassos_generate_task]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Component prompt to generate"
        required: false
        default: "Aurora Floating Glass Input"
      provider:
        description: "Provider (gemini, tokenrouter, mock)"
        required: false
        default: "gemini"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Autonomous Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOKENROUTER_API_KEY: ${{ secrets.TOKENROUTER_API_KEY }}
          ROUTER_API_KEY: ${{ secrets.ROUTER_API_KEY }}
        run: |
          PROMPT="${{ github.event.client_payload.prompt || github.event.inputs.prompt || 'Aurora Floating Glass Component' }}"
          echo "Generating component for prompt: $PROMPT"
          python -m generator.runner generate --prompt "$PROMPT" --auto-approve

      - name: Rebuild Showcase & Web Apps Registry
        run: |
          python scripts/rebuild_all.py
          python scripts/verify_links.py

      - name: Commit and Push to Main
        run: |
          git config --global user.name "GlassOS Autonomous Bot"
          git config --global user.email "bot@glassos.local"
          git add ui/components/glass/ scripts/rebuild_all.py
          if git diff --staged --quiet; then
            echo "No new components to commit."
          else
            git commit -m "feat(generator): auto-deploy new glass component [skip ci]"
            git push origin main
          fi

name: Autonomous Cloud Generator

on:
  repository_dispatch:
    types: [generate_task, glassos_generate_task, approve_task, reject_task]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Component prompt to generate"
        required: false
        default: "Aurora Floating Glass Component"
      provider:
        description: "Provider (gemini, tokenrouter, mock)"
        required: false
        default: "gemini"
      action:
        description: "Action (generate, approve, reject)"
        required: false
        default: "generate"
      item_id:
        description: "Item ID (if action is approve or reject)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Autonomous Generator or Curation Action
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOKENROUTER_API_KEY: ${{ secrets.TOKENROUTER_API_KEY }}
          ROUTER_API_KEY: ${{ secrets.ROUTER_API_KEY }}
        run: |
          EVENT_TYPE="${{ github.event_name == 'repository_dispatch' && github.event.action || github.event.inputs.action || 'generate_task' }}"
          ITEM_ID="${{ github.event.client_payload.item_id || github.event.inputs.item_id }}"

          if [ "$EVENT_TYPE" = "approve_task" ] || [ "$EVENT_TYPE" = "approve" ]; then
            echo "Approving pending component: $ITEM_ID"
            python -m generator.runner curate --approve "$ITEM_ID"
          elif [ "$EVENT_TYPE" = "reject_task" ] || [ "$EVENT_TYPE" = "reject" ]; then
            echo "Rejecting pending component: $ITEM_ID"
            python -m generator.runner curate --reject "$ITEM_ID"
          else
            PROMPT="${{ github.event.client_payload.prompt || github.event.inputs.prompt || 'Autonomous Glass UI Exploration' }}"
            echo "Generating component for prompt: $PROMPT"
            python -m generator.runner generate --prompt "$PROMPT"
          fi

      - name: Rebuild Showcase & Web Apps Registry
        run: |
          python scripts/rebuild_all.py
          python scripts/verify_links.py

      - name: Commit and Push to Main
        run: |
          git config --global user.name "Prototype Autonomous Bot"
          git config --global user.email "bot@prototype.local"
          git add -A generator/queue/ projects/generator-lab/ ui/components/glass/ scripts/rebuild_all.py component.md web-apps.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat(generator): update autonomous queue and components"
            for i in 1 2 3 4 5; do
              echo "Git push attempt $i..."
              git pull --rebase origin main && git push origin main && break || sleep 3
            done
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

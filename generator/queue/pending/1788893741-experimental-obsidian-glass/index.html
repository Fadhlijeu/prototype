<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experimental Obsidian Glass — Dark Glass</title>
    <link rel="stylesheet" href="../css.css">
    <link rel="stylesheet" href="index.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="component-canvas">
        
            <button type="button" class="glass-widget-box" id="sample-widget-btn" aria-label="Experimental Obsidian Glass">

                <span class="glass-pill-text">Experimental Obsidian Glass</span>

    </div>

    <script>
        if (window.lucide) window.lucide.createIcons();
    </script>
    <script src="index.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Liquid Frosted Breadcrumb — Dark Glass</title>
    <link rel="stylesheet" href="../css.css">
    <link rel="stylesheet" href="index.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="component-canvas">
        
            <nav class="glass-widget-box" aria-label="Glass Liquid Frosted Breadcrumb">

                <span class="glass-pill-text">Glass Liquid Frosted Breadcrumb</span>

    <script>
        if (window.lucide) window.lucide.createIcons();
    </script>

</html>

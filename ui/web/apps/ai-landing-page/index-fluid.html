<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kurage — Cyber-Organic AI Workspace (Glass Edition)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-deep: #05070a;
      --glass-bg: rgba(10, 13, 19, 0.66);
      --glass-border: rgba(255, 255, 255, 0.11);
      --glass-border-hover: rgba(255, 255, 255, 0.22);
      --cyan-glow: #4fd1c5;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-deep);
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Viewport wrapper for the 00:07-00:09 cinematic camera zoom-pan */
    #viewport-stage {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      transform-origin: 0% 0%;
      transition: transform 1.15s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    /* Glassmorphism Surface Tokens */
    .kurage-glass-card {
      background: rgba(10, 13, 18, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.11);
      box-shadow: 
        0 24px 60px rgba(0, 0, 0, 0.72),
        0 0 0 1px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.09);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .kurage-glass-card:focus-within {
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 
        0 28px 70px rgba(0, 0, 0, 0.8),
        0 0 25px rgba(79, 209, 197, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    .kurage-glass-pill {
      background: rgba(11, 15, 22, 0.58);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .kurage-glass-pill:hover {
      background: rgba(24, 30, 42, 0.72);
      border-color: rgba(255, 255, 255, 0.22);
      transform: translateY(-1px);
    }

    .kurage-glass-pill:active {
      transform: translateY(0px) scale(0.98);
    }

    /* Hero Headline Left-to-Right Motion Blur Transition (00:01 & 00:11) */
    .hero-title-wrapper {
      position: relative;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .hero-phrase {
      position: absolute;
      white-space: nowrap;
      font-size: clamp(1.75rem, 3.6vw, 2.75rem);
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 1.15;
      pointer-events: none;
      display: inline-flex;
    }

    .hero-char {
      display: inline-block;
      transition: 
        opacity 0.48s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.48s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.48s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, filter, transform;
    }

    /* Gradient tint on the trailing word of each phrase */
    .hero-char.accent-tint {
      color: #c4b5fd;
      text-shadow: 0 0 28px rgba(167, 139, 250, 0.25);
    }

    .hero-char.accent-tint-deep {
      color: #a78bfa;
      text-shadow: 0 0 28px rgba(139, 92, 246, 0.3);
    }

    /* Custom Scrollbar for Textarea & Modals */
    textarea::-webkit-scrollbar {
      width: 4px;
    }
    textarea::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    /* Subtle pulse on greeting indicator dot */
    @keyframes cyanPulse {
      0%, 100% {
        box-shadow: 0 0 8px #4fd1c5, 0 0 16px rgba(79, 209, 197, 0.4);
        opacity: 1;
      }
      50% {
        box-shadow: 0 0 4px #4fd1c5, 0 0 8px rgba(79, 209, 197, 0.2);
        opacity: 0.75;
      }
    }

    .greeting-dot {
      width: 7px;
      height: 7px;
      border-radius: 9999px;
      background-color: #5eead4;
      animation: cyanPulse 3s infinite ease-in-out;
    }
  </style>
</head>
<body>

  <!-- Stage Wrapper (Supports 1:1 normal view + 00:07-00:09 Cinematic Zoom Tour) -->
  <div id="viewport-stage">

    <!-- 1. BACKGROUND PROCEDURAL ASCII + GRID CANVAS -->
    <canvas id="kurage-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-0"></canvas>

    <!-- 2. LEFT NAVIGATION SIDEBAR -->
    <aside class="fixed top-0 left-0 h-full w-[52px] border-r border-white/[0.07] bg-[#05070a]/70 backdrop-blur-md z-30 flex flex-col justify-between items-center py-3.5 select-none">
      
      <!-- Top Sidebar Group -->
      <div class="flex flex-col items-center gap-3">
        <!-- Pixel Jellyfish Brand Logo (Matches 00:07 close-up) -->
        <button id="logo-btn" title="Trigger Cinematic Zoom (00:07)" class="w-9 h-9 flex items-center justify-center rounded-lg text-white/90 hover:text-white transition-transform hover:scale-105 focus:outline-none">
          <svg width="22" height="22" viewBox="0 0 11 11" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <!-- Pixel art dome -->
            <rect x="3" y="1" width="5" height="1" />
            <rect x="2" y="2" width="7" height="1" />
            <rect x="1" y="3" width="9" height="1" />
            <rect x="1" y="4" width="9" height="1" />
            <rect x="2" y="5" width="7" height="1" />
            <!-- Pixel art tentacles -->
            <rect x="2" y="6" width="1" height="2" opacity="0.85" />
            <rect x="4" y="6" width="1" height="3" opacity="0.95" />
            <rect x="6" y="6" width="1" height="4" opacity="0.95" />
            <rect x="8" y="6" width="1" height="2" opacity="0.85" />
            <rect x="3" y="8" width="1" height="2" opacity="0.65" />
            <rect x="5" y="9" width="1" height="1" opacity="0.65" />
            <rect x="7" y="8" width="1" height="2" opacity="0.65" />
          </svg>
        </button>

        <!-- Active Button: New Prompt / Compose -->
        <button id="new-chat-btn" title="New Prompt" class="w-[34px] h-[34px] rounded-[9px] bg-white/[0.07] border border-white/[0.15] shadow-[inset_0_1px_0_rgba(255,255,255,0.12)] flex items-center justify-center text-white/90 hover:bg-white/[0.11] transition-all">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
        </button>

        <!-- History Icon -->
        <button onclick="toggleHistoryModal()" title="History (Ctrl+K)" class="w-[34px] h-[34px] rounded-[9px] flex items-center justify-center text-white/45 hover:text-white/85 hover:bg-white/[0.04] transition-all">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
            <path d="M12 7v5l4 2"/>
          </svg>
        </button>

        <!-- Explore / Compass Icon -->
        <button onclick="fillPrompt('/explore ideas ')" title="Explore" class="w-[34px] h-[34px] rounded-[9px] flex items-center justify-center text-white/45 hover:text-white/85 hover:bg-white/[0.04] transition-all">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
          </svg>
        </button>

        <!-- Bookmarks Icon -->
        <button onclick="showToast('Saved prompts & bookmarks (0)')" title="Bookmarks" class="w-[34px] h-[34px] rounded-[9px] flex items-center justify-center text-white/45 hover:text-white/85 hover:bg-white/[0.04] transition-all">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>
          </svg>
        </button>

        <!-- Activity / Waveform Pulse Icon -->
        <button onclick="playCinematicTour()" title="Activity & Showcase Zoom" class="w-[34px] h-[34px] rounded-[9px] flex items-center justify-center text-white/45 hover:text-white/85 hover:bg-white/[0.04] transition-all">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
        </button>
      </div>

      <!-- Bottom Sidebar Group -->
      <div class="flex flex-col items-center gap-2.5">
        <!-- Pause / Play ASCII Simulation Button (||) -->
        <button id="pause-sim-btn" title="Pause/Resume ASCII Simulation" class="w-[32px] h-[32px] rounded-[8px] flex items-center justify-center text-white/45 hover:text-white/85 hover:bg-white/[0.04] transition-all">
          <svg id="pause-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="4" width="4" height="16" rx="1"/>
            <rect x="14" y="4" width="4" height="16" rx="1"/>
          </svg>
        </button>

        <!-- Status / Check Circle Icon -->
        <button onclick="showToast('System Status: Local ASCII Engine Active (60 FPS)')" title="Engine Status" class="w-[32px] h-[32px] rounded-[8px] flex items-center justify-center text-white/45 hover:text-white/85 hover:bg-white/[0.04] transition-all">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </button>

        <!-- Settings Gear Icon -->
        <button onclick="playCinematicTour()" title="Replay 00:07 Camera Zoom Tour" class="w-[32px] h-[32px] rounded-[8px] flex items-center justify-center text-white/45 hover:text-white/85 hover:bg-white/[0.04] transition-all">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>

        <!-- User Avatar Circle -->
        <button onclick="showToast('Signed in as Marcelo')" class="mt-1 w-6 h-6 rounded-full overflow-hidden border border-white/25 hover:border-white/60 transition-all focus:outline-none">
          <svg viewBox="0 0 32 32" class="w-full h-full bg-[#1a2232]">
            <circle cx="16" cy="12" r="6" fill="#94a3b8"/>
            <path d="M6 28c0-5.5 4.5-10 10-10s10 4.5 10 10" fill="#64748b"/>
          </svg>
        </button>
      </div>
    </aside>

    <!-- 3. TOP-RIGHT FLOATING CONTROLS (History Ctrl+K & Fluid Experiment) -->
    <header class="fixed top-3.5 right-4 z-30 flex items-center gap-2">
      <!-- Fluid Experiment Switcher Pill -->
      <a href="index-fluid.html" title="Buka Eksperimen Non-ASCII Fluid Aurora" class="kurage-glass-pill flex items-center gap-2 px-3 py-1.5 rounded-[10px] text-white/90 hover:text-white text-[12px] font-medium border border-cyan-400/30 bg-cyan-500/10 hover:bg-cyan-500/20 transition-all">
        <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse shadow-[0_0_8px_#38bdf8]"></span>
        <span class="font-mono-code font-semibold">Fluid Edition</span>
        <span class="text-white/40 text-[11px] hidden sm:inline">(Non-ASCII)</span>
      </a>
      <!-- History Button (1:1 Match) -->
      <button onclick="toggleHistoryModal()" class="kurage-glass-pill flex items-center gap-2 px-3 py-1.5 rounded-[10px] text-white/80 hover:text-white text-[12px] font-medium">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="text-white/60">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
          <path d="M12 7v5l4 2"/>
        </svg>
        <span>History</span>
        <kbd class="ml-0.5 px-1.5 py-0.5 text-[10.5px] font-mono-code bg-white/[0.06] border border-white/[0.1] rounded-[5px] text-white/65 tracking-tight">Ctrl K</kbd>
      </button>
    </header>

    <!-- 4. CENTER STAGE (Greeting + Cycling Hero + Glass Input Card + Slash Pills) -->
    <main class="relative z-20 pl-[52px] w-full h-full flex flex-col items-center justify-center px-4">
      
      <div class="w-full max-w-[604px] flex flex-col items-center -mt-4">
        
        <!-- Greeting Indicator -->
        <div class="flex items-center gap-2.5 mb-2">
          <span class="greeting-dot"></span>
          <span class="font-mono-code text-[12.5px] text-white/75 tracking-tight">Good evening, Marcelo</span>
        </div>

        <!-- Dynamic Cycling Hero Headline with Left-to-Right Motion Blur -->
        <div id="hero-title-container" class="hero-title-wrapper mb-6">
          <!-- Populated dynamically by JS character-wave engine -->
        </div>

        <!-- Main Glass Prompt Input Card -->
        <div class="kurage-glass-card w-full rounded-[16px] p-4 flex flex-col justify-between min-h-[118px] relative">
          
          <!-- Prompt Textarea -->
          <textarea
            id="prompt-input"
            rows="2"
            placeholder="Ask kurage anything..."
            class="w-full bg-transparent text-white placeholder-white/40 text-[15px] leading-relaxed font-normal focus:outline-none resize-none select-text"
          ></textarea>

          <!-- Prompt Bottom Toolbar -->
          <div class="flex items-center justify-between pt-2.5 mt-1">
            
            <!-- Left Toolbar Controls -->
            <div class="flex items-center gap-1.5">
              <!-- Attachment (+) -->
              <button onclick="showToast('Attach file or context')" title="Add Attachment" class="w-7 h-7 rounded-lg flex items-center justify-center text-white/55 hover:text-white hover:bg-white/[0.07] transition-colors">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
              </button>

              <!-- Model Selector Pill (✨ Auto ⌄) -->
              <div class="relative">
                <button id="model-pill-btn" onclick="toggleModelDropdown()" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-white/[0.04] hover:bg-white/[0.08] border border-white/[0.11] text-white/80 hover:text-white text-[12px] font-medium transition-all">
                  <!-- Sparkle Icon -->
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="text-teal-300/90">
                    <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
                    <path d="M20 3v4"/><path d="M22 5h-4"/>
                  </svg>
                  <span id="selected-model-label">Auto</span>
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white/50">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </button>

                <!-- Dropdown Menu -->
                <div id="model-dropdown" class="hidden absolute left-0 bottom-9 w-44 rounded-xl kurage-glass-card p-1.5 z-40 text-xs">
                  <button onclick="selectModel('Auto')" class="w-full text-left px-2.5 py-1.5 rounded-lg hover:bg-white/[0.08] flex items-center justify-between text-white/90">
                    <span>Auto</span>
                    <span class="text-[10px] font-mono-code text-teal-300">Default</span>
                  </button>
                  <button onclick="selectModel('Kurage Deep')" class="w-full text-left px-2.5 py-1.5 rounded-lg hover:bg-white/[0.08] flex items-center justify-between text-white/75">
                    <span>Kurage Deep</span>
                    <span class="text-[10px] font-mono-code text-purple-300">R1</span>
                  </button>
                  <button onclick="selectModel('Kurage Fast')" class="w-full text-left px-2.5 py-1.5 rounded-lg hover:bg-white/[0.08] flex items-center justify-between text-white/75">
                    <span>Kurage Fast</span>
                    <span class="text-[10px] font-mono-code text-white/40">Flash</span>
                  </button>
                </div>
              </div>

              <!-- Globe Icon (Web Grounding Toggle) -->
              <button id="web-toggle-btn" onclick="toggleWebSearch()" title="Web Search" class="w-7 h-7 rounded-lg flex items-center justify-center text-white/50 hover:text-white hover:bg-white/[0.07] transition-colors">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="2" y1="12" x2="22" y2="12"></line>
                  <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                </svg>
              </button>

              <!-- Microphone Icon (Voice Input) -->
              <button onclick="showToast('Voice input ready — speak now')" title="Voice Input" class="w-7 h-7 rounded-lg flex items-center justify-center text-white/50 hover:text-white hover:bg-white/[0.07] transition-colors">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                  <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                  <line x1="12" y1="19" x2="12" y2="23"></line>
                  <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
              </button>
            </div>

            <!-- Right Toolbar Controls -->
            <div class="flex items-center gap-3">
              <!-- Keyboard Shortcut Hints -->
              <div class="hidden sm:flex items-center gap-2.5 font-mono-code text-[11px] text-white/35 tracking-tight">
                <span>↵ send</span>
                <span>⇧↵ new line</span>
              </div>

              <!-- Submit Arrow Button (↗) -->
              <button id="send-btn" onclick="submitPrompt()" title="Send Prompt" class="w-7 h-7 rounded-[8px] bg-white/[0.04] hover:bg-white/[0.12] border border-white/[0.12] flex items-center justify-center text-white/75 hover:text-white transition-all">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="7" y1="17" x2="17" y2="7"></line>
                  <polyline points="7 7 17 7 17 17"></polyline>
                </svg>
              </button>
            </div>

          </div>
        </div>

        <!-- Quick Action Slash Command Pills -->
        <div class="flex flex-wrap items-center justify-center gap-2.5 mt-3.5">
          <button onclick="fillPrompt('/explore ideas ')" class="kurage-glass-pill px-3.5 py-1.5 rounded-full font-mono-code text-[11.5px] text-white/70 hover:text-white">
            /explore ideas
          </button>
          <button onclick="fillPrompt('/refine my writing ')" class="kurage-glass-pill px-3.5 py-1.5 rounded-full font-mono-code text-[11.5px] text-white/70 hover:text-white">
            /refine my writing
          </button>
          <button onclick="fillPrompt('/plan a project ')" class="kurage-glass-pill px-3.5 py-1.5 rounded-full font-mono-code text-[11.5px] text-white/70 hover:text-white">
            /plan a project
          </button>
          <button onclick="fillPrompt('/research a topic ')" class="kurage-glass-pill px-3.5 py-1.5 rounded-full font-mono-code text-[11.5px] text-white/70 hover:text-white">
            /research a topic
          </button>
        </div>

        <!-- Simulated Local Response Preview Card (Appears when user submits a prompt) -->
        <div id="response-preview" class="hidden w-full mt-4 kurage-glass-card rounded-[14px] p-4 text-left transition-all">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-teal-400 animate-pulse"></span>
              <span class="font-mono-code text-[11px] text-teal-300/90 uppercase tracking-wider">Kurage Local Preview</span>
            </div>
            <button onclick="closeResponsePreview()" class="text-white/40 hover:text-white/80 text-xs font-mono-code">✕ esc</button>
          </div>
          <p id="response-text" class="text-[13.5px] text-white/85 leading-relaxed font-normal"></p>
        </div>

      </div>
    </main>

    <!-- 5. BOTTOM FOOTER NOTICE -->
    <footer class="fixed bottom-3.5 left-[52px] right-0 flex justify-center pointer-events-none z-20 px-4">
      <p class="font-mono-code text-[11px] text-white/40 tracking-tight text-center">
        Preview - prompts stay in this tab and are never sent to an AI service
      </p>
    </footer>

  </div>

  <!-- 6. HISTORY MODAL (CTRL + K) -->
  <div id="history-modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-start justify-center pt-24 px-4">
    <div class="kurage-glass-card w-full max-w-lg rounded-2xl p-4 border border-white/15 shadow-2xl">
      <div class="flex items-center justify-between pb-3 mb-3 border-b border-white/10">
        <div class="flex items-center gap-2">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="text-teal-300">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input id="history-search" type="text" placeholder="Search recent threads & commands..." class="bg-transparent text-sm text-white placeholder-white/40 focus:outline-none w-64" />
        </div>
        <button onclick="toggleHistoryModal()" class="px-2 py-0.5 text-[11px] font-mono-code bg-white/5 border border-white/10 rounded text-white/60 hover:text-white">ESC</button>
      </div>
      <div class="space-y-1 text-xs font-mono-code">
        <div class="text-[10px] text-white/35 uppercase px-2 py-1">Recent Sessions</div>
        <button onclick="selectHistoryItem('summarize today\'s meetings')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-white/[0.07] flex items-center justify-between text-white/80">
          <span>summarize today's meetings</span>
          <span class="text-white/35">2m ago</span>
        </button>
        <button onclick="selectHistoryItem('catch up on Slack threads')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-white/[0.07] flex items-center justify-between text-white/80">
          <span>catch up on Slack threads</span>
          <span class="text-white/35">1h ago</span>
        </button>
        <button onclick="selectHistoryItem('plan tomorrow\'s priorities')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-white/[0.07] flex items-center justify-between text-white/80">
          <span>plan tomorrow's priorities</span>
          <span class="text-white/35">Yesterday</span>
        </button>
        <button onclick="selectHistoryItem('draft the weekly update')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-white/[0.07] flex items-center justify-between text-white/80">
          <span>draft the weekly update</span>
          <span class="text-white/35">3d ago</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Subtle Notification Toast -->
  <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-opacity duration-300">
    <div class="kurage-glass-pill px-4 py-1.5 rounded-full font-mono-code text-xs text-teal-200 border border-teal-400/25">
      <span id="toast-msg"></span>
    </div>
  </div>

  <script>
    /*************************************************************************
     * 1. HERO HEADLINE CHARACTER-WAVE MOTION BLUR ENGINE (Matches 00:01 & 00:11)
     *************************************************************************/
    const HERO_PHRASES = [
      { text: "summarize today's meetings", accentStart: 18 },
      { text: "catch up on Slack threads", accentStart: 18 },
      { text: "plan tomorrow's priorities", accentStart: 16 },
      { text: "draft the weekly update", accentStart: 17 },
      { text: "what are we working on?", accentStart: 12 }
    ];

    const heroContainer = document.getElementById('hero-title-container');
    let currentPhraseIndex = 0;
    let currentPhraseEl = null;
    let heroInterval = null;

    function createPhraseElement(phraseObj, initialHidden = false) {
      const wrapper = document.createElement('div');
      wrapper.className = 'hero-phrase';

      const chars = phraseObj.text.split('');
      chars.forEach((ch, idx) => {
        const span = document.createElement('span');
        span.className = 'hero-char';
        if (idx >= phraseObj.accentStart) {
          span.classList.add(idx >= phraseObj.accentStart + 3 ? 'accent-tint-deep' : 'accent-tint');
        }
        span.textContent = ch === ' ' ? '\u00A0' : ch;

        if (initialHidden) {
          span.style.opacity = '0';
          span.style.filter = 'blur(10px)';
          span.style.transform = 'translateX(-6px) scale(0.96)';
        } else {
          span.style.opacity = '1';
          span.style.filter = 'blur(0px)';
          span.style.transform = 'translateX(0px) scale(1)';
        }
        wrapper.appendChild(span);
      });

      return wrapper;
    }

    function transitionToNextPhrase() {
      const nextIndex = (currentPhraseIndex + 1) % HERO_PHRASES.length;
      const outgoingEl = currentPhraseEl;
      const incomingEl = createPhraseElement(HERO_PHRASES[nextIndex], true);
      heroContainer.appendChild(incomingEl);

      const outChars = outgoingEl ? Array.from(outgoingEl.children) : [];
      const inChars = Array.from(incomingEl.children);
      const maxLen = Math.max(outChars.length, inChars.length);

      // Stagger left-to-right blur fade (creates the exact 00:01 & 00:11 overlap)
      for (let i = 0; i < maxLen; i++) {
        const delay = i * 22; // 22ms per character wave

        if (outChars[i]) {
          setTimeout(() => {
            outChars[i].style.opacity = '0';
            outChars[i].style.filter = 'blur(10px)';
            outChars[i].style.transform = 'translateX(6px) scale(0.96)';
          }, delay);
        }

        if (inChars[i]) {
          setTimeout(() => {
            inChars[i].style.opacity = '1';
            inChars[i].style.filter = 'blur(0px)';
            inChars[i].style.transform = 'translateX(0px) scale(1)';
          }, delay + 55);
        }
      }

      setTimeout(() => {
        if (outgoingEl && outgoingEl.parentNode) {
          outgoingEl.parentNode.removeChild(outgoingEl);
        }
      }, maxLen * 22 + 550);

      currentPhraseEl = incomingEl;
      currentPhraseIndex = nextIndex;
    }

    // Initialize first phrase
    currentPhraseEl = createPhraseElement(HERO_PHRASES[0], false);
    heroContainer.appendChild(currentPhraseEl);
    heroInterval = setInterval(transitionToNextPhrase, 3000);

    
    /*************************************************************************
     * 2. PROCEDURAL BIOLUMINESCENT JELLYFISH (SMOOTH NON-ASCII GLASS ENGINE)
     * Ultra-clean, monochromatic, high-end Mariana trench aesthetics.
     *************************************************************************/
    const canvas = document.getElementById('kurage-canvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    let width = 0;
    let height = 0;
    let dpr = 1;
    let isSimulationPaused = false;
    let simTime = 0;

    let mouseX = -1000;
    let mouseY = -1000;
    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    function resizeCanvas() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 4 Jellyfish specimens matching original positions & orientations
    const JELLYFISH_FLEET = [
      {
        // 1. Top-Left Lavender / Indigo
        anchorX: 0.20, anchorY: 0.27,
        angle: 0.34,
        bellRadiusX: 86, bellRadiusY: 62,
        tentacleLength: 220, tentacleCount: 7,
        phase: 0.4, speed: 1.45, driftRadius: 12,
        colorCore: 'rgba(139, 115, 246, 0.14)',
        colorRim:  'rgba(167, 139, 250, 0.65)',
        colorTentacle: 'rgba(196, 181, 253, 0.38)'
      },
      {
        // 2. Top-Center Mint Cyan / Ice Blue
        anchorX: 0.47, anchorY: 0.16,
        angle: -0.42,
        bellRadiusX: 106, bellRadiusY: 74,
        tentacleLength: 280, tentacleCount: 8,
        phase: 2.1, speed: 1.35, driftRadius: 15,
        colorCore: 'rgba(94, 234, 212, 0.16)',
        colorRim:  'rgba(79, 209, 197, 0.72)',
        colorTentacle: 'rgba(94, 234, 212, 0.42)'
      },
      {
        // 3. Bottom-Center Radiant Cyan
        anchorX: 0.56, anchorY: 0.67,
        angle: -0.26,
        bellRadiusX: 112, bellRadiusY: 78,
        tentacleLength: 320, tentacleCount: 9,
        phase: 4.0, speed: 1.4, driftRadius: 14,
        colorCore: 'rgba(79, 209, 197, 0.18)',
        colorRim:  'rgba(94, 234, 212, 0.82)',
        colorTentacle: 'rgba(79, 209, 197, 0.48)'
      },
      {
        // 4. Far-Right Steel Cyan
        anchorX: 0.85, anchorY: 0.42,
        angle: -0.36,
        bellRadiusX: 94, bellRadiusY: 66,
        tentacleLength: 260, tentacleCount: 7,
        phase: 1.2, speed: 1.28, driftRadius: 13,
        colorCore: 'rgba(56, 189, 248, 0.12)',
        colorRim:  'rgba(56, 189, 248, 0.55)',
        colorTentacle: 'rgba(56, 189, 248, 0.35)'
      }
    ];

    function drawJellyfish(jf, t) {
      const pulsePhase = t * jf.speed + jf.phase;
      const pulse = Math.sin(pulsePhase);

      // Swimming drift
      const cx = jf.anchorX * width + Math.sin(t * 0.42 + jf.phase) * jf.driftRadius;
      const cy = jf.anchorY * height + Math.cos(t * 0.52 + jf.phase) * jf.driftRadius;

      // Elastic breathing expansion
      const rx = jf.bellRadiusX * (1 + 0.075 * pulse);
      const ry = jf.bellRadiusY * (1 - 0.06 * pulse);

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(jf.angle);

      // 1. UNDULATING TENTACLES (Flowing silk Bézier curves)
      const count = jf.tentacleCount;
      for (let k = 0; k < count; k++) {
        const normK = (k / (count - 1)) * 2 - 1; // -1 to +1
        const isOralArm = (k % 2 === 1);
        const startX = normK * (rx * 0.72);
        const startY = ry * 0.18;

        const STEPS = 14;
        const stepLen = jf.tentacleLength / STEPS;

        ctx.beginPath();
        ctx.moveTo(startX, startY);

        let prevX = startX;
        let prevY = startY;

        for (let s = 1; s <= STEPS; s++) {
          const u = s / STEPS;
          const naturalFlare = normK * (rx * 0.32) * Math.pow(u, 1.15);
          const waveFreq = isOralArm ? 7.2 : 8.8;
          const waveAmp = (isOralArm ? 18 : 22) * Math.pow(u, 0.85);
          
          const wave =
            Math.sin(u * waveFreq - t * 2.3 + jf.phase + k * 1.1) * waveAmp +
            Math.cos(u * 4.2 - t * 1.5 + k * 2.1) * (waveAmp * 0.32);

          const px = startX + naturalFlare + wave;
          const py = startY + s * stepLen;

          const midX = (prevX + px) * 0.5;
          const midY = (prevY + py) * 0.5;
          ctx.quadraticCurveTo(prevX, prevY, midX, midY);

          prevX = px;
          prevY = py;
        }

        ctx.lineTo(prevX, prevY);

        // Gradient stroke from bell base to fading tip
        ctx.strokeStyle = jf.colorTentacle;
        ctx.lineWidth = isOralArm ? 1.8 : 1.1;
        ctx.lineCap = 'round';
        ctx.stroke();
      }

      // 2. TRANSLUCENT GLASS DOME (MUSHROOM BELL)
      ctx.beginPath();
      ctx.moveTo(-rx, 0);
      // Asymmetric upper mushroom dome
      ctx.bezierCurveTo(-rx * 1.05, -ry * 1.35, rx * 1.05, -ry * 1.35, rx, 0);
      // Scalloped bottom rim
      ctx.bezierCurveTo(rx * 0.65, ry * 0.26, -rx * 0.65, ry * 0.26, -rx, 0);
      ctx.closePath();

      // Soft volumetric radial glow fill
      const bellGrad = ctx.createRadialGradient(0, -ry * 0.2, 0, 0, 0, rx);
      bellGrad.addColorStop(0, jf.colorCore);
      bellGrad.addColorStop(0.65, 'rgba(10, 16, 26, 0.25)');
      bellGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = bellGrad;
      ctx.fill();

      // Glowing glass rim highlight
      ctx.strokeStyle = jf.colorRim;
      ctx.lineWidth = 1.35;
      ctx.shadowBlur = 10;
      ctx.shadowColor = jf.colorRim;
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Internal delicate radial nerve ribs
      ctx.strokeStyle = jf.colorCore;
      ctx.lineWidth = 0.85;
      for (let r = -2; r <= 2; r++) {
        const ribBaseX = r * (rx * 0.32);
        ctx.beginPath();
        ctx.moveTo(0, -ry * 0.95);
        ctx.quadraticCurveTo(ribBaseX * 1.15, -ry * 0.15, ribBaseX, ry * 0.2);
        ctx.stroke();
      }

      ctx.restore();
    }

    function renderLoop(timestamp) {
      if (!isSimulationPaused) {
        simTime += 0.016;
      }

      // 1. Pure deep void (#05070A)
      ctx.fillStyle = '#05070a';
      ctx.fillRect(0, 0, width, height);

      // 2. Crisp 1px geometric grid (3.6% opacity, exactly like original Kurage)
      const CELL_SIZE = 13;
      const cols = Math.ceil(width / CELL_SIZE);
      const rows = Math.ceil(height / CELL_SIZE);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.032)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let c = 0; c <= cols; c++) {
        const x = c * CELL_SIZE + 0.5;
        ctx.moveTo(x, 0); ctx.lineTo(x, height);
      }
      for (let r = 0; r <= rows; r++) {
        const y = r * CELL_SIZE + 0.5;
        ctx.moveTo(0, y); ctx.lineTo(width, y);
      }
      ctx.stroke();

      // 3. Render all 4 smooth bioluminescent jellyfish
      for (let j = 0; j < JELLYFISH_FLEET.length; j++) {
        drawJellyfish(JELLYFISH_FLEET[j], simTime);
      }

      requestAnimationFrame(renderLoop);
    }

    /*************************************************************************
     * 3. UI INTERACTIONS, KEYBOARD SHORTCUTS & 00:07 CINEMATIC CAMERA TOUR
     *************************************************************************/
    const promptInput = document.getElementById('prompt-input');
    const responsePreview = document.getElementById('response-preview');
    const responseText = document.getElementById('response-text');
    const historyModal = document.getElementById('history-modal');
    const modelDropdown = document.getElementById('model-dropdown');
    const viewportStage = document.getElementById('viewport-stage');

    // Fill prompt from quick-action slash pills
    function fillPrompt(text) {
      promptInput.value = text;
      promptInput.focus();
    }

    // Submit prompt handler (stays locally in tab as promised by footer)
    function submitPrompt() {
      const val = promptInput.value.trim();
      if (!val) {
        showToast('Type a prompt or choose a /command first');
        promptInput.focus();
        return;
      }

      responsePreview.classList.remove('hidden');
      responseText.textContent = `Processing "${val}" locally inside this tab... Ready to synthesize your workspace notes, Slack threads, and action items without sending data externally.`;
      promptInput.value = '';
    }

    function closeResponsePreview() {
      responsePreview.classList.add('hidden');
    }

    // Enter to send, Shift+Enter for new line
    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitPrompt();
      }
    });

    // Global Keyboard Shortcuts (Ctrl+K for History, Escape to close)
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        toggleHistoryModal();
      } else if (e.key === 'Escape') {
        historyModal.classList.add('hidden');
        modelDropdown.classList.add('hidden');
        closeResponsePreview();
      }
    });

    function toggleHistoryModal() {
      historyModal.classList.toggle('hidden');
      if (!historyModal.classList.contains('hidden')) {
        document.getElementById('history-search').focus();
      }
    }

    function selectHistoryItem(text) {
      historyModal.classList.add('hidden');
      promptInput.value = text;
      promptInput.focus();
    }

    function toggleModelDropdown() {
      modelDropdown.classList.toggle('hidden');
    }

    function selectModel(name) {
      document.getElementById('selected-model-label').textContent = name;
      modelDropdown.classList.add('hidden');
      showToast(`Model switched to ${name}`);
    }

    let webSearchEnabled = false;
    function toggleWebSearch() {
      webSearchEnabled = !webSearchEnabled;
      const btn = document.getElementById('web-toggle-btn');
      if (webSearchEnabled) {
        btn.classList.remove('text-white/50');
        btn.classList.add('text-teal-300', 'bg-teal-400/10');
        showToast('Web grounding enabled');
      } else {
        btn.classList.add('text-white/50');
        btn.classList.remove('text-teal-300', 'bg-teal-400/10');
        showToast('Web grounding disabled');
      }
    }

    // Pause / Play ASCII Engine button (bottom-left sidebar `||`)
    document.getElementById('pause-sim-btn').addEventListener('click', () => {
      isSimulationPaused = !isSimulationPaused;
      const pauseIcon = document.getElementById('pause-icon');
      if (isSimulationPaused) {
        pauseIcon.innerHTML = `<polygon points="6 4 20 12 6 20 6 4"/>`;
        showToast('ASCII simulation paused');
      } else {
        pauseIcon.innerHTML = `<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>`;
        showToast('ASCII simulation resumed');
      }
    });

    // New Chat button resets input
    document.getElementById('new-chat-btn').addEventListener('click', () => {
      promptInput.value = '';
      closeResponsePreview();
      promptInput.focus();
      showToast('New prompt session');
    });

    /**
     * Replays the exact 00:07 -> 00:10 cinematic zoom-in & pan sequence from the video
     * Triggered by clicking the top-left pixel jellyfish logo or sidebar pulse/gear icon
     */
    let isTourPlaying = false;
    function playCinematicTour() {
      if (isTourPlaying) return;
      isTourPlaying = true;
      showToast('Playing 00:07 close-up camera showcase...');

      // Step 1 (00:07): Zoom in to top-left sidebar & lavender ASCII jellyfish
      viewportStage.style.transform = 'scale(2.25) translate(0%, 0%)';

      // Step 2 (00:08 - 00:09): Pan smoothly across to the center headline & glass prompt box
      setTimeout(() => {
        viewportStage.style.transform = 'scale(1.65) translate(-18%, -15%)';
      }, 1500);

      // Step 3 (00:10): Zoom back out to 1:1 full view
      setTimeout(() => {
        viewportStage.style.transform = 'scale(1) translate(0%, 0%)';
        setTimeout(() => {
          isTourPlaying = false;
        }, 1150);
      }, 3200);
    }

    document.getElementById('logo-btn').addEventListener('click', playCinematicTour);

    // Toast notification helper (no alert() calls)
    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      toastMsg.textContent = msg;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2200);
    }

    // Start animation loop on window load
    window.onload = function () {
      requestAnimationFrame(renderLoop);
    };
  </script>
</body>

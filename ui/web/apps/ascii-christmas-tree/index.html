<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090e">
<meta name="description" content="A procedural 3D Christmas tree rendered entirely with animated ASCII characters.">
<title>ASCII Christmas Tree</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#07090e}
body{display:grid;place-items:center}
canvas{display:block;max-width:100vw;max-height:100vh}
</style>
</head>
<body>
<canvas id="scene" role="img" aria-label="A rotating, ornamented Christmas tree made entirely of animated ASCII characters"></canvas>
<script>

(function(){
"use strict";

const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d", { alpha:false });

const TAU = Math.PI * 2;
const GROUND = -1.18, Y0 = -.96, Y1 = 1.34, GROUND_R = 1.55;
const T_GROW = [.2, 4.6], T_GARLAND = [4.8, 7.0], T_ORN = [6.6, 8.6];
const T_LIGHTS = [7.8, 10.4], T_GIFTS = [9.2, 10.9], T_STAR = 11.4;
const PITCH = .19, CAM_D = 6, SCALE_Y = 20.5, ROT_SPEED = .45;
const CW = 9, CH = 14;
const WHITE = [.96,.98,1], GOLD = [1,.80,.24], BAUBLE_GOLD = [1,.84,.36];
const RED = [.95,.14,.16], SILVER = [.82,.88,.96], GREEN_BOX = [.15,.72,.32];
const WARM = [1,.82,.42], BARK = [.44,.28,.15];
const KIND = {NEEDLE:0,SNOW:1,TRUNK:2,TINSEL:3,BAUBLE:4,LIGHT:5,BOX:6,RIBBON:7,FLOOR:8};
const RAMPS = [".,:;+x*#%@",".+x*oO#@","|!lI#H","~=+x*#@",".:=oO0@","+*oO@@","-=+#%&@","=+HX#@",".,:;"];
const RAMP_LENGTH = RAMPS.map(s=>s.length);
const LIGHT_DIR = normalize([-.48,.68,.55]);

let cols = 88, rows = 74, aspect = CW/CH, logicalW = cols*CW, logicalH = rows*CH, dpr = 1;
let elapsed = 0, lastFrame = 0, lastRendered = 0;
let P = null, flakes = [], glyphs, depths, cellKinds, colors;
let visibleLights = [];

const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;
function normalize(v){
  const n=Math.hypot(v[0],v[1],v[2])||1;
  return [v[0]/n,v[1]/n,v[2]/n];
}
function makeRandom(seed){
  let a=seed>>>0;
  return function(){
    a=(a+0x6D2B79F5)|0;
    let t=a;
    t=Math.imul(t^(t>>>15),t|1);
    t^=t+Math.imul(t^(t>>>7),t|61);
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
const random = makeRandom(7);
const rand = (a,b)=>a+random()*(b-a);
let gaussianCache = null;
function normal(){
  if(gaussianCache!==null){const v=gaussianCache;gaussianCache=null;return v;}
  let u=0,v=0;
  while(u===0)u=random();
  while(v===0)v=random();
  const m=Math.sqrt(-2*Math.log(u));
  gaussianCache=m*Math.sin(TAU*v);
  return m*Math.cos(TAU*v);
}
const clampNormal=()=>clamp(normal(),-2,2);
function envelope(y){
  const u=clamp((y-Y0)/(Y1-Y0),0,1);
  const tier=1+.045*Math.sin(u*22*Math.PI)*(1-u*.5);
  return (.78*Math.pow(1-u,.88)+.015)*tier;
}
function growTime(y){
  return lerp(T_GROW[0],T_GROW[1],clamp((y-GROUND)/(Y1-GROUND),0,1));
}
function newPointStore(){
  return {
    x:[],y:[],z:[],nx:[],ny:[],nz:[],r:[],g:[],b:[],kind:[],
    t0:[],base:[],cx:[],cy:[],cz:[],phase:[],pop:[]
  };
}
const raw = newPointStore();
function addPoint(x,y,z,nx,ny,nz,color,kind,t0,base=1,cx=x,cy=y,cz=z,phase=0,pop=false){
  raw.x.push(x);raw.y.push(y);raw.z.push(z);
  raw.nx.push(nx);raw.ny.push(ny);raw.nz.push(nz);
  raw.r.push(color[0]);raw.g.push(color[1]);raw.b.push(color[2]);
  raw.kind.push(kind);raw.t0.push(t0);raw.base.push(base);
  raw.cx.push(cx);raw.cy.push(cy);raw.cz.push(cz);
  raw.phase.push(phase);raw.pop.push(pop?1:0);
}
function unitSphere(n){
  const out=[], golden=Math.PI*(1+Math.sqrt(5));
  for(let i=0;i<n;i++){
    const y=1-2*(i+.5)/n, radius=Math.sqrt(1-y*y), a=golden*(i+.5);
    out.push([Math.cos(a)*radius,y,Math.sin(a)*radius]);
  }
  return out;
}
function addOrientedPoint(x,y,z,n,color,kind,t0,base=1,center=null,phase=0,pop=false){
  const c=center||[x,y,z];
  addPoint(x,y,z,n[0],n[1],n[2],color,kind,t0,base,c[0],c[1],c[2],phase,pop);
}
function rotateY(x,y,z,c,s){return [x*c+z*s,y,-x*s+z*c];}

function buildScene(){
  const tips=[];
  // A restrained, blue-grey snow disc underneath the tree.
  for(let i=0;i<2200;i++){
    const radius=GROUND_R*Math.sqrt(random()),a=random()*TAU;
    const x=Math.cos(a)*radius,z=Math.sin(a)*radius,y=GROUND+.008*normal();
    const base=.45*(1-.75*Math.pow(radius/GROUND_R,2));
    addOrientedPoint(x,y,z,[0,1,0],[.55,.64,.78],KIND.FLOOR,0,base);
  }

  // Twenty-eight whorls of dense, drooping fir branches.
  const layers=28;
  for(let layer=0;layer<layers;layer++){
    const y=lerp(Y0+.02,Y1-.04,layer/(layers-1));
    const u=(y-Y0)/(Y1-Y0);
    const radius=(.78*Math.pow(1-u,.88)+.015)+.04;
    const branchCount=Math.floor(7+14*(1-u));
    for(let branch=0;branch<branchCount;branch++){
      const angle=TAU*(branch+.45*random())/branchCount+layer*.77;
      const length=radius*rand(.88,1.08);
      const count=Math.floor(35+210*length);
      const dx=Math.cos(angle),dz=Math.sin(angle),sx=-Math.sin(angle),sz=Math.cos(angle);
      const samples=new Float32Array(count);
      let mean=0;
      for(let j=0;j<count;j++){
        const v=Math.pow(random(),.62);samples[j]=v;mean+=v;
      }
      mean/=count;
      for(let j=0;j<count;j++){
        const v=samples[j],spread=(.010+.065*v*(1-.35*v))*clampNormal();
        const branchLength=v*length;
        const x=dx*branchLength+sx*spread,z=dz*branchLength+sz*spread;
        const droop=.05*branchLength-.19*branchLength*branchLength;
        const py=y+droop+.009*clampNormal();
        const n=normalize([
          dx+.22*normal(),
          .45-.30*mean+.22*normal(),
          dz+.22*normal()
        ]);
        const snow=v>.52 && random()<.085*Math.pow(v,1.5) && n[1]>.05;
        const green=[
          .06+.14*Math.pow(v,.9)+.06*random(),
          .34+.38*Math.pow(v,.9)+.14*random(),
          .12+.14*Math.pow(v,.9)+.05*random()
        ];
        const ao=(.22+.82*Math.pow(v,1.15))*rand(.80,1.12);
        addOrientedPoint(x,py,z,n,snow?WHITE:green,snow?KIND.SNOW:KIND.NEEDLE,
          growTime(y)+.42*v,snow?1.05:ao);
      }
      const tipLength=.93*length;
      tips.push([dx*tipLength,y+.05*tipLength-.19*tipLength*tipLength,dz*tipLength]);
    }
  }

  // Dark, irregular inner foliage gives the branches a solid silhouette.
  for(let i=0;i<7500;i++){
    const y=rand(Y0,Y1-.08),a=random()*TAU;
    const n=normalize([Math.cos(a),.25,Math.sin(a)]);
    const radius=.55*envelope(y)*(.6+.4*random());
    addOrientedPoint(Math.cos(a)*radius,y,Math.sin(a)*radius,n,[.05,.24,.08],
      KIND.NEEDLE,growTime(y),.20);
  }

  // Textured trunk.
  for(let i=0;i<1800;i++){
    const y=rand(GROUND,Y0+.12),a=random()*TAU;
    const n=[Math.cos(a),0,Math.sin(a)];
    const bark=.72+.28*Math.sin(6*a+30*y)*random();
    addOrientedPoint(n[0]*.085,y,n[2]*.085,n,BARK.map(v=>v*bark),KIND.TRUNK,growTime(y),.85);
  }

  // Four strands of fine gold garland follow the same scalloped spiral.
  const garlandSteps=2600;
  for(let strand=0;strand<4;strand++){
    for(let i=0;i<garlandSteps;i++){
      const u=i/(garlandSteps-1),angle=TAU*3.6*u+.9;
      const y=Y0+.14+(Y1-Y0-.42)*u;
      const swag=-.065*Math.abs(Math.sin(angle*2.5));
      const radius=(envelope(y)+.055)*(1-.11*Math.abs(Math.sin(angle*2.5)));
      const n=normalize([
        Math.cos(angle)+.45*normal(),
        .3+.45*normal(),
        Math.sin(angle)+.45*normal()
      ]);
      const x=Math.cos(angle)*radius+.028*normal();
      const py=y+swag+.028*normal();
      const z=Math.sin(angle)*radius+.028*normal();
      addOrientedPoint(x,py,z,n,GOLD,KIND.TINSEL,
        lerp(T_GARLAND[0],T_GARLAND[1],u),1,null,random()*TAU);
    }
  }

  // Glossy red, gold and occasional silver ornaments.
  const baubleSphere=unitSphere(60);
  for(let k=0;k<38;k++){
    const u=(k+.2+.6*random())/38;
    const y=Y0+.07+u*(Y1-Y0-.26);
    const angle=k*2.39996+random()*.35;
    const radius=envelope(y)+.02;
    const center=[Math.cos(angle)*radius,y-.03,Math.sin(angle)*radius];
    const size=.054+.022*(1-u);
    const color=k%2===0?RED:(k%7===0?SILVER:BAUBLE_GOLD);
    const t0=rand(T_ORN[0],T_ORN[1]);
    for(const v of baubleSphere){
      addOrientedPoint(center[0]+v[0]*size,center[1]+v[1]*size,center[2]+v[2]*size,
        v,color,KIND.BAUBLE,t0,1,center,0,true);
    }
  }

  // Warm fairy lights, distributed over unique branch tips.
  for(let i=tips.length-1;i>0;i--){
    const j=Math.floor(random()*(i+1));[tips[i],tips[j]]=[tips[j],tips[i]];
  }
  const picked=tips.slice(0,Math.min(185,tips.length));
  const bulb=unitSphere(16);
  for(const center of picked){
    const t0=rand(T_LIGHTS[0],T_LIGHTS[1]);
    const color=random()<.8?WARM:[1,.96,.88];
    visibleLights.push(t0);
    for(const v of bulb){
      addOrientedPoint(center[0]+v[0]*.028,center[1]+v[1]*.028,center[2]+v[2]*.028,
        v,color,KIND.LIGHT,t0,1,center,random()*TAU);
    }
  }

  // Six wrapped gifts, with six sampled faces and two elliptical bow loops.
  const gifts=[
    [.3,.96,.28,.23,.26,.4,RED,GOLD],
    [1.5,1.02,.25,.28,.25,.9,GREEN_BOX,GOLD],
    [2.6,1.04,.32,.18,.24,1,GOLD,RED],
    [3.7,.95,.23,.25,.23,.2,RED,GOLD],
    [4.7,.98,.28,.21,.26,.1,GREEN_BOX,RED],
    [5.6,1.05,.22,.25,.22,.5,GOLD,GREEN_BOX]
  ];
  const bowSphere=unitSphere(80);
  for(let giftIndex=0;giftIndex<gifts.length;giftIndex++){
    const [angle,distance,w,h,d,rotation,body,ribbonColor]=gifts[giftIndex];
    const areas=[w*d,w*d,h*d,h*d,w*h,w*h];
    const totalArea=areas.reduce((a,b)=>a+b,0);
    const sampleCount=Math.floor(5000*totalArea);
    const center=[Math.cos(angle)*distance,GROUND,Math.sin(angle)*distance];
    const cr=Math.cos(rotation),sr=Math.sin(rotation);
    const start=lerp(T_GIFTS[0],T_GIFTS[1],giftIndex/5);
    for(let j=0;j<sampleCount;j++){
      let pick=random()*totalArea,face=areas.length-1;
      for(let f=0;f<areas.length;f++){pick-=areas[f];if(pick<=0){face=f;break;}}
      const fa=random()-.5,fb=random()-.5;
      let x=fa*w,y,z=fb*d,n;
      if(face===0){y=h;n=[0,1,0];}
      else if(face===1){y=0;n=[0,-1,0];}
      else if(face===2){x=w/2;y=(fb+.5)*h;z=fa*d;n=[1,0,0];}
      else if(face===3){x=-w/2;y=(fb+.5)*h;z=fa*d;n=[-1,0,0];}
      else if(face===4){z=d/2;y=(fb+.5)*h;x=fa*w;n=[0,0,1];}
      else{z=-d/2;y=(fb+.5)*h;x=fa*w;n=[0,0,-1];}
      const onX=Math.abs(x)<.022,onZ=Math.abs(z)<.022;
      const isRibbon=face<2?(onX||onZ):(face<4?onZ:onX);
      const rotated=rotateY(x,y,z,cr,sr),normal=rotateY(n[0],n[1],n[2],cr,sr);
      const p=[rotated[0]+center[0],rotated[1]+center[1],rotated[2]+center[2]];
      addOrientedPoint(p[0],p[1],p[2],normal,isRibbon?ribbonColor:body,
        isRibbon?KIND.RIBBON:KIND.BOX,start,.95,center,0,true);
    }
    for(const side of [-1,1]){
      for(const v of bowSphere){
        const x=side*.04+v[0]*.05,y=h+.025+v[1]*.03,z=v[2]*.025;
        const rotated=rotateY(x,y,z,cr,sr);
        const n=[v[0],v[1],v[2]];
        addOrientedPoint(rotated[0]+center[0],y+center[1],rotated[2]+center[2],
          n,ribbonColor,KIND.RIBBON,start,.95,center,0,true);
      }
    }
  }

  // Pack point attributes into compact typed arrays for frame rendering.
  P={};
  for(const key of ["x","y","z","nx","ny","nz","r","g","b","t0","base","cx","cy","cz","phase"]){
    P[key]=Float32Array.from(raw[key]);
  }
  P.kind=Uint8Array.from(raw.kind);
  P.pop=Uint8Array.from(raw.pop);

  const snowRandom=makeRandom(3);
  for(let i=0;i<420;i++){
    flakes.push({
      x:-2.2+snowRandom()*4.4,z:-2.2+snowRandom()*4.4,
      off:snowRandom()*3.5,spd:.22+snowRandom()*.43,
      phase:snowRandom()*TAU,brightness:.30+snowRandom()*.55
    });
  }
}

function resize(){
  const mobile=window.innerWidth<700;
  cols=mobile?48:88;
  rows=mobile?64:74;
  aspect=mobile?.72:CW/CH;
  logicalW=cols*CW;logicalH=rows*CH;
  dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(logicalW*dpr);
  canvas.height=Math.round(logicalH*dpr);
  const fit=Math.min(window.innerWidth/logicalW,window.innerHeight/logicalH);
  canvas.style.width=(logicalW*fit)+"px";
  canvas.style.height=(logicalH*fit)+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.font='14px "Courier New",Consolas,monospace';
  ctx.textBaseline="alphabetic";
  glyphs=new Uint8Array(cols*rows);
  depths=new Float32Array(cols*rows);
  cellKinds=new Uint8Array(cols*rows);
  colors=new Uint8ClampedArray(cols*rows*3);
}

function project(x,y,z,rot,cr,sr){
  const rx=x*cr+z*sr,rz=-x*sr+z*cr;
  const cp=Math.cos(PITCH),sp=Math.sin(PITCH);
  const y2=y*cp-rz*sp,z2=y*sp+rz*cp;
  const distance=CAM_D-z2,f=CAM_D/distance;
  return [
    cols/2+rx*f*SCALE_Y/aspect,
    rows*.47-y2*f*SCALE_Y,
    distance
  ];
}
function setCell(index,glyph,r,g,b,depth,kind=255){
  if(index<0||index>=glyphs.length||(depth!==Infinity&&depth>=depths[index]))return;
  depths[index]=depth;glyphs[index]=glyph.charCodeAt(0);
  const offset=index*3;
  colors[offset]=Math.round(clamp(r,0,1)*255);
  colors[offset+1]=Math.round(clamp(g,0,1)*255);
  colors[offset+2]=Math.round(clamp(b,0,1)*255);
  cellKinds[index]=kind;
}
function setStarCell(index,glyph,r,g,b){
  if(index<0||index>=glyphs.length)return;
  glyphs[index]=glyph.charCodeAt(0);
  const offset=index*3;
  colors[offset]=Math.round(clamp(r,0,1)*255);
  colors[offset+1]=Math.round(clamp(g,0,1)*255);
  colors[offset+2]=Math.round(clamp(b,0,1)*255);
}

function drawStar(t,rot){
  const point=project(0,Y1+.09,0,rot,Math.cos(rot),Math.sin(rot));
  const cx=Math.round(point[0]),cy=Math.round(point[1]);
  const on=clamp((t-T_STAR)/.6,0,1);
  const flash=Math.pow(clamp(1-(t-T_STAR),0,1),2);
  const size=(2+2.2*on)*(1+.05*Math.sin(t*3));
  const tint=GOLD.map(v=>v+(1-v)*flash);
  const power=.95*(1+1.6*flash);

  const rayChars=["-","|","\\","/"];
  const rayMap=[0,2,1,3];
  for(let k=0;k<8;k++){
    const angle=k*TAU/8+.10*Math.sin(t*.7);
    if(Math.sin(angle)<-.3)continue;
    const reach=size*(3+.8*Math.sin(t*3+k*1.3))*(k%2===0?1:.65);
    const glyph=rayChars[rayMap[Math.round(((angle*180/Math.PI)%180)/45)%4]];
    for(let step=size*1.1;step<reach;step+=.5){
      const y=Math.round(cy-Math.sin(angle)*step);
      const x=Math.round(cx+Math.cos(angle)*step/aspect);
      if(x>=0&&x<cols&&y>=0&&y<rows){
        const index=y*cols+x;
        if(glyphs[index]===0){
          const brightness=power*.6*(1-step/reach);
          setStarCell(index,glyph,tint[0]*brightness,tint[1]*brightness,tint[2]*brightness);
        }
      }
    }
  }

  const polygon=[];
  for(let k=0;k<10;k++){
    const radius=k%2===0?size:.40*size,angle=Math.PI/2+k*Math.PI/5;
    polygon.push([Math.cos(angle)*radius,Math.sin(angle)*radius]);
  }
  const minX=Math.max(0,Math.floor(cx-size/aspect-3)),maxX=Math.min(cols-1,Math.ceil(cx+size/aspect+3));
  const minY=Math.max(0,Math.floor(cy-size-2)),maxY=Math.min(rows-1,Math.ceil(cy+size+2));
  for(let y=minY;y<=maxY;y++)for(let x=minX;x<=maxX;x++){
    const px=(x-cx)*aspect,py=cy-y;
    let inside=false;
    for(let i=0,j=polygon.length-1;i<polygon.length;j=i++){
      const a=polygon[i],b=polygon[j];
      if(((a[1]>py)!==(b[1]>py)) && px<(b[0]-a[0])*(py-a[1])/(b[1]-a[1]+1e-9)+a[0])inside=!inside;
    }
    if(inside){
      const distance=Math.hypot(px,py)/(size+1e-6),brightness=power*(1.10-.30*distance);
      const glyph=distance<.45?"@":"#";
      setStarCell(y*cols+x,glyph,tint[0]*brightness,tint[1]*brightness,tint[2]*brightness);
    }
  }
}

function render(t){
  glyphs.fill(0);depths.fill(Infinity);cellKinds.fill(255);
  const rot=ROT_SPEED*t,cr=Math.cos(rot),sr=Math.sin(rot);
  const cp=Math.cos(PITCH),sp=Math.sin(PITCH);
  const total=P.x.length;

  // Project and shade every active point; nearest point wins in each character cell.
  for(let i=0;i<total;i++){
    const start=P.t0[i];if(start>t)continue;
    const age=t-start;
    let x=P.x[i],y=P.y[i],z=P.z[i];
    if(P.pop[i]){
      const u=clamp(age/.45,0,1),scale=1+2.70158*Math.pow(u-1,3)+1.70158*Math.pow(u-1,2);
      x=P.cx[i]+(x-P.cx[i])*scale;
      y=P.cy[i]+(y-P.cy[i])*scale;
      z=P.cz[i]+(z-P.cz[i])*scale;
    }
    const rx=x*cr+z*sr,rz=-x*sr+z*cr;
    const y2=y*cp-rz*sp,z2=y*sp+rz*cp;
    const distance=CAM_D-z2,projection=CAM_D/distance;
    const sx=Math.round(cols/2+rx*projection*SCALE_Y/aspect);
    const sy=Math.round(rows*.47-y2*projection*SCALE_Y);
    if(sx<0||sx>=cols||sy<0||sy>=rows)continue;
    const cell=sy*cols+sx;if(distance>=depths[cell])continue;

    const nx=P.nx[i]*cr+P.nz[i]*sr;
    const ny=P.ny[i];
    const nz=-P.nx[i]*sr+P.nz[i]*cr;
    const diffuse=clamp(nx*LIGHT_DIR[0]+ny*LIGHT_DIR[1]+nz*LIGHT_DIR[2],0,1);
    const kind=P.kind[i];
    let brightness=P.base[i]*(.18+.82*diffuse);
    const specular=kind===KIND.BAUBLE?.95*Math.pow(diffuse,20):0;
    brightness+=specular;
    const flicker=.85+.15*Math.sin(t*4+P.phase[i]);
    const spark=Math.max(0,Math.sin(t*7+P.phase[i]*5));
    if(kind===KIND.LIGHT)brightness=flicker;
    if(kind===KIND.TINSEL)brightness=.35+.35*diffuse+.50*spark;
    const glow=clamp(1-age/.38,0,1);
    brightness=clamp(brightness+.85*glow,0,1.25);
    const factor=kind===KIND.LIGHT?1.15:.16+.95*brightness;
    const mix=.65*glow+.65*specular;
    let red=P.r[i]*factor,green=P.g[i]*factor,blue=P.b[i]*factor;
    red=clamp(red+(1-red)*mix,0,1);
    green=clamp(green+(1-green)*mix,0,1);
    blue=clamp(blue+(1-blue)*mix,0,1);
    const ramp=RAMPS[kind],level=Math.min(Math.floor(clamp(brightness,0,.999)*RAMP_LENGTH[kind]),RAMP_LENGTH[kind]-1);
    glyphs[cell]=ramp.charCodeAt(level);
    depths[cell]=distance;
    cellKinds[cell]=kind;
    const offset=cell*3;
    colors[offset]=Math.round(red*255);
    colors[offset+1]=Math.round(green*255);
    colors[offset+2]=Math.round(blue*255);
  }

  // Warm light bloom in the four neighbouring empty cells.
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const index=y*cols+x;
    if(cellKinds[index]!==KIND.LIGHT)continue;
    const source=index*3;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy;
      if(nx<0||nx>=cols||ny<0||ny>=rows)continue;
      const ni=ny*cols+nx;if(glyphs[ni]!==0)continue;
      glyphs[ni]=".".charCodeAt(0);
      const offset=ni*3;
      colors[offset]=Math.round(colors[source]*.42);
      colors[offset+1]=Math.round(colors[source+1]*.42);
      colors[offset+2]=Math.round(colors[source+2]*.42);
    }
  }

  // Falling snow remains behind the tree and ornaments.
  for(const flake of flakes){
    const y=1.95-((t*flake.spd+flake.off)%3.35);
    const point=project(flake.x+.14*Math.sin(t*.8+flake.phase),y,flake.z,rot,cr,sr);
    const x=Math.round(point[0]),py=Math.round(point[1]);
    if(x<0||x>=cols||py<0||py>=rows)continue;
    const index=py*cols+x;if(glyphs[index]!==0)continue;
    const brightness=flake.brightness;
    setCell(index,point[2]<CAM_D-.3?"*":".",.75*brightness,.82*brightness,.96*brightness,Infinity);
  }

  if(t>T_STAR)drawStar(t,rot);

  // A quiet night background; the tree is the only foreground element.
  const gradient=ctx.createLinearGradient(0,0,0,logicalH);
  gradient.addColorStop(0,"#07090e");
  gradient.addColorStop(1,"#0c0f17");
  ctx.fillStyle=gradient;
  ctx.fillRect(0,0,logicalW,logicalH);
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const index=y*cols+x,code=glyphs[index];
    if(!code)continue;
    const offset=index*3;
    ctx.fillStyle="rgb("+colors[offset]+","+colors[offset+1]+","+colors[offset+2]+")";
    ctx.fillText(String.fromCharCode(code),x*CW+.4,y*CH+11.2);
  }
}

function tick(now){
  if(!lastFrame)lastFrame=now;
  const dt=Math.min((now-lastFrame)/1000,.05);
  lastFrame=now;
  elapsed+=dt;
  if(now-lastRendered>=1000/30){
    render(elapsed);
    lastRendered=now;
  }
  requestAnimationFrame(tick);
}

window.addEventListener("resize",()=>{
  resize();
  render(elapsed);
});

buildScene();
resize();
render(0);
requestAnimationFrame(tick);
})();

</script>
</body>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biometric Glass Radial Gauge — Glass Dark Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="glass-radial-card">
        <div class="radial-header">
            <div class="radial-badge">
                <span class="dot-live"></span>
                <span>BIOMETRIC VAULT</span>
            </div>
            <span class="radial-protocol">TLS 1.3 SECURE</span>
        </div>

        <div class="radial-display-wrap">
            <svg class="radial-svg" viewBox="0 0 200 200">
                <defs>
                    <linearGradient id="radialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#38BDF8"/>
                        <stop offset="60%" stop-color="#818CF8"/>
                        <stop offset="100%" stop-color="#C084FC"/>
                    </linearGradient>
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>

                <!-- Track Background -->
                <circle class="circle-bg" cx="100" cy="100" r="76" />
                <!-- Dynamic Progress Ring -->
                <circle class="circle-progress" id="circleProgress" cx="100" cy="100" r="76" filter="url(#glow)" />
            </svg>

            <!-- Center Metric Hub -->
            <div class="radial-center-hub">
                <span class="metric-number" id="radialPct">84</span>
                <span class="metric-unit">%</span>
                <div class="metric-sub">SYNCHRONIZED</div>
            </div>
        </div>

        <!-- Metric Details Row -->
        <div class="radial-stats-row">
            <div class="stat-col">
                <div class="stat-lbl">SPEED</div>
                <div class="stat-val" id="statSpeed">480 MB/s</div>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-col">
                <div class="stat-lbl">REMAINING</div>
                <div class="stat-val" id="statTime">1.4s</div>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-col">
                <div class="stat-lbl">INTEGRITY</div>
                <div class="stat-val emerald">100%</div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
    <script>
        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biometric Glass Radial Gauge — Glass Dark Standalone</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css.css">
    <style>

:root {
    --bg-page: #08080C;
    --glass-card: rgba(255, 255, 255, 0.06);
    --glass-border-top: rgba(255, 255, 255, 0.24);
    --glass-border-side: rgba(255, 255, 255, 0.10);
    --glass-border-bottom: rgba(255, 255, 255, 0.04);
    --text-primary: #FFFFFF;
    --text-secondary: rgba(255, 255, 255, 0.65);
    --text-muted: rgba(255, 255, 255, 0.38);
    --accent-cyan: #38BDF8;
    --ease-spring: cubic-bezier(0.34, 1.25, 0.64, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background-color: var(--bg-page);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.glass-radial-card {
    width: 100%;
    max-width: 380px;
    background: var(--glass-card);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border-radius: 24px;
    border: 1px solid transparent;
    border-top-color: var(--glass-border-top);
    border-left-color: var(--glass-border-side);
    border-right-color: var(--glass-border-side);
    border-bottom-color: var(--glass-border-bottom);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
}

.radial-header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.radial-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #38BDF8;
    background: rgba(56, 189, 248, 0.12);
    border: 1px solid rgba(56, 189, 248, 0.3);
    padding: 4px 10px;
    border-radius: 999px;
}

.dot-live {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #38BDF8;
    box-shadow: 0 0 8px #38BDF8;
}

.radial-protocol {
    font-size: 10.5px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-muted);
}

.radial-display-wrap {
    position: relative;
    width: 190px;
    height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.radial-svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
}

.circle-bg {
    fill: none;
    stroke: rgba(255, 255, 255, 0.06);
    stroke-width: 10;
}

.circle-progress {
    fill: none;
    stroke: url(#radialGrad);
    stroke-width: 11;
    stroke-linecap: round;
    stroke-dasharray: 477.5;
    stroke-dashoffset: 76.4; /* 84% */
    transition: stroke-dashoffset 0.5s var(--ease-spring);
}

.radial-center-hub {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.metric-number {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: #FFFFFF;
    line-height: 1;
    font-family: 'JetBrains Mono', monospace;
}

.metric-unit {
    font-size: 14px;
    font-weight: 700;
    color: var(--accent-cyan);
    margin-top: -30px;
    margin-left: 56px;
}

.metric-sub {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-top: 6px;
}

.radial-stats-row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 14px;
    padding: 10px 16px;
}

.stat-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
}

.stat-lbl {
    font-size: 9px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.06em;
}

.stat-val {
    font-size: 12px;
    font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
    color: #FFFFFF;
}

.stat-val.emerald {
    color: #10B981;
}

.stat-divider {
    width: 1px;
    height: 22px;
    background: rgba(255, 255, 255, 0.08);
}

.radial-stepper-bar {
    width: 100%;
    display: flex;
    gap: 8px;
}

.btn-step {
    flex: 1;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
}

.btn-step:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #FFFFFF;
}

.btn-step-action {
    flex: 1.5;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(168, 85, 247, 0.2));
    border: 1px solid rgba(56, 189, 248, 0.4);
    color: #FFFFFF;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-step-action:hover {
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.35), rgba(168, 85, 247, 0.35));
    box-shadow: 0 0 14px rgba(56, 189, 248, 0.4);
}

    </style>
</head>
<body>

    <div class="glass-radial-card">
        <div class="radial-header">
            <div class="radial-badge">
                <span class="dot-live"></span>
                <span>BIOMETRIC VAULT</span>
            </div>
            <span class="radial-protocol">TLS 1.3 SECURE</span>
        </div>

        <div class="radial-display-wrap">
            <svg class="radial-svg" viewBox="0 0 200 200">
                <defs>
                    <linearGradient id="radialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#38BDF8"/>
                        <stop offset="60%" stop-color="#818CF8"/>
                        <stop offset="100%" stop-color="#C084FC"/>
                    </linearGradient>
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>

                <!-- Track Background -->
                <circle class="circle-bg" cx="100" cy="100" r="76" />
                <!-- Dynamic Progress Ring -->
                <circle class="circle-progress" id="circleProgress" cx="100" cy="100" r="76" filter="url(#glow)" />
            </svg>

            <!-- Center Metric Hub -->
            <div class="radial-center-hub">
                <span class="metric-number" id="radialPct">84</span>
                <span class="metric-unit">%</span>
                <div class="metric-sub">SYNCHRONIZED</div>
            </div>
        </div>

        <!-- Metric Details Row -->
        <div class="radial-stats-row">
            <div class="stat-col">
                <div class="stat-lbl">SPEED</div>
                <div class="stat-val" id="statSpeed">480 MB/s</div>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-col">
                <div class="stat-lbl">REMAINING</div>
                <div class="stat-val" id="statTime">1.4s</div>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-col">
                <div class="stat-lbl">INTEGRITY</div>
                <div class="stat-val emerald">100%</div>
            </div>
        </div>

        <!-- Stepper Controller -->
        <div class="radial-stepper-bar">
            <button type="button" class="btn-step" id="btnMinus">-10%</button>
            <button type="button" class="btn-step-action" id="btnAutoSweep">Auto Pulse</button>
            <button type="button" class="btn-step" id="btnPlus">+10%</button>
        </div>
    </div>

    <script>

const circle = document.getElementById('circleProgress');
const pctText = document.getElementById('radialPct');
const speedText = document.getElementById('statSpeed');
const timeText = document.getElementById('statTime');

const circumference = 2 * Math.PI * 76; // ~477.52
let currentVal = 84;
let autoInterval = null;

function setProgress(val) {
    currentVal = Math.max(0, Math.min(100, val));
    const offset = circumference - (currentVal / 100) * circumference;
    circle.style.strokeDashoffset = offset;
    pctText.textContent = currentVal;
    
    // update telemetry
    speedText.textContent = `${Math.floor(250 + currentVal * 2.8)} MB/s`;
    timeText.textContent = currentVal === 100 ? 'Done' : `${((100 - currentVal) * 0.08).toFixed(1)}s`;
}

document.getElementById('btnMinus').addEventListener('click', () => {
    clearInterval(autoInterval);
    setProgress(currentVal - 10);
});

document.getElementById('btnPlus').addEventListener('click', () => {
    clearInterval(autoInterval);
    setProgress(currentVal + 10);
});

document.getElementById('btnAutoSweep').addEventListener('click', () => {
    if (autoInterval) {
        clearInterval(autoInterval);
        autoInterval = null;
        document.getElementById('btnAutoSweep').textContent = 'Auto Pulse';
    } else {
        document.getElementById('btnAutoSweep').textContent = 'Stop Pulse';
        autoInterval = setInterval(() => {
            let next = currentVal + 6;
            if (next > 100) next = 10;
            setProgress(next);
        }, 400);
    }
});

setProgress(84);

        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>

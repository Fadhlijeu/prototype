<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Glass Audio Voice Memo Capsule — Glass Dark Standalone</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css.css">
    <style>

:root {
    --bg-page: #08080C;
    --glass-card: rgba(255, 255, 255, 0.06);
    --glass-border-top: rgba(255, 255, 255, 0.24);
    --glass-border-side: rgba(255, 255, 255, 0.10);
    --glass-border-bottom: rgba(255, 255, 255, 0.04);
    --text-primary: #FFFFFF;
    --text-secondary: rgba(255, 255, 255, 0.65);
    --text-muted: rgba(255, 255, 255, 0.38);
    --accent-cyan: #38BDF8;
    --ease-spring: cubic-bezier(0.34, 1.25, 0.64, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background-color: var(--bg-page);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.glass-voice-card {
    width: 100%;
    max-width: 400px;
    background: var(--glass-card);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border-radius: 24px;
    border: 1px solid transparent;
    border-top-color: var(--glass-border-top);
    border-left-color: var(--glass-border-side);
    border-right-color: var(--glass-border-side);
    border-bottom-color: var(--glass-border-bottom);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.voice-top-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.voice-status-group {
    display: flex;
    align-items: center;
    gap: 8px;
}

.recording-beacon {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #EF4444;
    box-shadow: 0 0 10px #EF4444;
}

.recording-beacon.active {
    animation: beaconBlink 1.5s infinite;
}

@keyframes beaconBlink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.3); }
}

.voice-status-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #EF4444;
    font-family: 'JetBrains Mono', monospace;
}

.voice-format-tag {
    font-size: 10.5px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
}

.voice-canvas-wrap {
    position: relative;
    width: 100%;
    height: 70px;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    overflow: hidden;
}

#voiceCanvas {
    width: 100%;
    height: 100%;
    display: block;
}

.voice-timing-row {
    display: flex;
    align-items: center;
    gap: 12px;
}

.timer-digits, .timer-total {
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-muted);
}

.timer-digits {
    color: var(--accent-cyan);
    font-weight: 700;
}

.scrubber-track {
    flex: 1;
    height: 4px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 999px;
    overflow: hidden;
}

.scrubber-progress {
    height: 100%;
    background: linear-gradient(90deg, #38BDF8, #818CF8);
}

.transcript-preview-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.06);
    font-size: 11.5px;
    color: var(--text-secondary);
    font-style: italic;
}

.transcript-preview-pill svg {
    width: 14px;
    height: 14px;
    color: var(--accent-cyan);
    flex-shrink: 0;
}

.voice-controls-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding-top: 4px;
}

.btn-audio-action {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-audio-action:hover {
    background: rgba(255, 255, 255, 0.12);
    color: #FFFFFF;
}

.btn-audio-action svg { width: 16px; height: 16px; }

.btn-audio-record {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
    border: 2px solid rgba(255, 255, 255, 0.4);
    box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.2s;
}

.btn-audio-record:hover {
    transform: scale(1.08);
}

.btn-audio-record svg { width: 22px; height: 22px; }

    </style>
</head>
<body>

    <div class="glass-voice-card">
        <div class="voice-top-header">
            <div class="voice-status-group">
                <span class="recording-beacon active" id="beacon"></span>
                <span class="voice-status-label" id="statusLabel">LIVE AUDIO STREAM</span>
            </div>
            <span class="voice-format-tag">FLAC • 48 kHz</span>
        </div>

        <!-- Live Sine Wave Canvas -->
        <div class="voice-canvas-wrap">
            <canvas id="voiceCanvas" width="340" height="70"></canvas>
            <div class="voice-scan-line"></div>
        </div>

        <!-- Timeline Counter & Scrubber -->
        <div class="voice-timing-row">
            <span class="timer-digits" id="timerCount">00:18</span>
            <div class="scrubber-track">
                <div class="scrubber-progress" style="width: 32%;"></div>
            </div>
            <span class="timer-total">02:30</span>
        </div>

        <!-- Transcript Pill -->
        <div class="transcript-preview-pill">
            <i data-lucide="sparkles"></i>
            <span class="transcript-text">"Synchronize Singapore edge nodes to consensus..."</span>
        </div>

        <!-- Audio Controls Deck -->
        <div class="voice-controls-bar">
            <button type="button" class="btn-audio-action" id="btnPauseVoice" title="Pause">
                <i data-lucide="pause"></i>
            </button>
            <button type="button" class="btn-audio-record active" id="btnRecordToggle" title="Record">
                <i data-lucide="mic" id="micIcon"></i>
            </button>
            <button type="button" class="btn-audio-action" id="btnStopVoice" title="Stop">
                <i data-lucide="square"></i>
            </button>
        </div>
    </div>

    <script>

const vCanvas = document.getElementById('voiceCanvas');
const vCtx = vCanvas.getContext('2d');
let isRecording = true;
let animVoice;

function drawSineWave() {
    vCtx.clearRect(0, 0, vCanvas.width, vCanvas.height);
    const w = vCanvas.width;
    const h = vCanvas.height;

    vCtx.beginPath();
    vCtx.strokeStyle = isRecording ? '#38BDF8' : 'rgba(255, 255, 255, 0.2)';
    vCtx.lineWidth = 2;

    const time = Date.now() * 0.005;
    for (let x = 0; x < w; x++) {
        const freq = isRecording ? 0.04 : 0.01;
        const amp = isRecording ? Math.sin(x * 0.02 + time) * 16 : 2;
        const y = h / 2 + Math.sin(x * freq + time) * amp;
        if (x === 0) vCtx.moveTo(x, y);
        else vCtx.lineTo(x, y);
    }
    vCtx.stroke();

    animVoice = requestAnimationFrame(drawSineWave);
}
drawSineWave();

const btnRec = document.getElementById('btnRecordToggle');
const beacon = document.getElementById('beacon');
const statusLabel = document.getElementById('statusLabel');

btnRec.addEventListener('click', () => {
    isRecording = !isRecording;
    beacon.classList.toggle('active', isRecording);
    statusLabel.textContent = isRecording ? 'LIVE AUDIO STREAM' : 'PAUSED';
    statusLabel.style.color = isRecording ? '#EF4444' : '#94A3B8';
});

        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>

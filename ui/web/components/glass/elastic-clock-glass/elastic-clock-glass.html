<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elastic Lockscreen Glass Clock</title>
    <meta name="description" content="1:1 Lockscreen Glass Clock dengan stadium outline digits, live system time, audio synth, dan fisika peregangan kendor pegas jelly (pull-to-stretch rebound).">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            min-height: 100vh;
            background-color: transparent;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #FFFFFF;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Clock Full-Stage Container */
        .clock-container {
            width: 100%;
            height: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            transition: background 0.35s ease;
        }

        /* Background 1: Obsidian Black (1:1 Reference Photo Match) */
        .clock-container[data-clock-bg="black"] {
            background-color: #08080C;
            background-image: radial-gradient(circle at 50% 30%, #151824 0%, #0D0F17 50%, #08080C 85%);
        }

        /* Background 2: Blob Wallpaper (Planetary Refraction through Glass) */
        .clock-container[data-clock-bg="blob"] {
            background-color: #0D0D0D;
            background-image: url('../blob_9-16.svg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
        }

        /* Interactive Drag & Pull Area */
        .clock-interactive-area {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            touch-action: none;
            padding: 24px 16px;
        }

        .clock-interactive-area.dragging {
            cursor: grabbing;
        }

        /* Elastic Clock Mesh Wrapper */
        .elastic-clock-mesh {
            width: 100%;
            max-width: 440px;
            height: 92%;
            max-height: 720px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: 50% 12%;
            will-change: transform;
            pointer-events: none;
        }

        /* SVG Clock Graphic */
        .clock-svg {
            width: 100%;
            height: 100%;
            max-height: 100%;
            display: block;
            overflow: visible;
        }

        /* Digit Groups with Catenary Elastic Transformation */
        .digit-col,
        .colon-group {
            will-change: transform;
        }

        .glass-digit,
        .colon-dot {
            filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.65));
        }
    </style>
</head>
<body>
    <div class="clock-container" id="clockContainer" data-clock-bg="black">
        <!-- Draggable Pull-to-Stretch Interaction Area -->
        <div class="clock-interactive-area" id="clockInteractiveArea" role="region" aria-label="Elastic Glass Clock">
            <div class="elastic-clock-mesh" id="elasticClockMesh">
                <svg class="clock-svg" id="clockSvg" viewBox="0 0 430 620" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Translucent Frosted Glass Fill Gradient -->
                        <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
                            <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.14" />
                            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.26" />
                        </linearGradient>

                        <!-- White Specular Rim Stroke Gradient -->
                        <linearGradient id="rimStroke" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
                            <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.65" />
                            <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.45" />
                            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.85" />
                        </linearGradient>

                        <!-- Glass Drop Shadow Filter -->
                        <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.75" />
                        </filter>
                    </defs>

                    <!-- Digits Group with Catenary Sag Physics -->
                    <g id="digitsGroup" class="digits-group" filter="url(#glassShadow)">
                        <!-- Digit 1 (Tens of Hour) -->
                        <g id="digitCol0" class="digit-col" transform="translate(16, 20)">
                            <path id="pathD0" class="glass-digit" fill="url(#glassFill)" stroke="url(#rimStroke)" stroke-width="1.8" fill-rule="evenodd" d="" />
                        </g>

                        <!-- Digit 2 (Units of Hour) -->
                        <g id="digitCol1" class="digit-col" transform="translate(110, 20)">
                            <path id="pathD1" class="glass-digit" fill="url(#glassFill)" stroke="url(#rimStroke)" stroke-width="1.8" fill-rule="evenodd" d="" />
                        </g>

                        <!-- Colon ':' Group -->
                        <g id="colonCol" class="colon-group" transform="translate(202, 20)">
                            <circle id="colonDotTop" class="colon-dot" cx="13" cy="205" r="13" fill="url(#glassFill)" stroke="url(#rimStroke)" stroke-width="1.8" />
                            <circle id="colonDotBottom" class="colon-dot" cx="13" cy="375" r="13" fill="url(#glassFill)" stroke="url(#rimStroke)" stroke-width="1.8" />
                        </g>

                        <!-- Digit 3 (Tens of Minute) -->
                        <g id="digitCol2" class="digit-col" transform="translate(240, 20)">
                            <path id="pathD2" class="glass-digit" fill="url(#glassFill)" stroke="url(#rimStroke)" stroke-width="1.8" fill-rule="evenodd" d="" />
                        </g>

                        <!-- Digit 4 (Units of Minute) -->
                        <g id="digitCol3" class="digit-col" transform="translate(334, 20)">
                            <path id="pathD3" class="glass-digit" fill="url(#glassFill)" stroke="url(#rimStroke)" stroke-width="1.8" fill-rule="evenodd" d="" />
                        </g>
                    </g>
                </svg>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const W = 78;
            const H = 580;
            const T = 17;
            const R = W / 2.0; // 39.0
            const r = R - T;   // 22.0

            // Geometrically accurate stadium capsule glyphs (1:1 with reference photo)
            const DIGIT_PATHS = {
                '0': "M 0,39 A 39 39 0 0 1 78,39 V 541 A 39 39 0 0 1 0,541 Z M 18,39 A 21 21 0 0 1 60,39 V 541 A 21 21 0 0 1 18,541 Z",
                '1': "M 30,9 A 9 9 0 0 1 48,9 V 571 A 9 9 0 0 1 30,571 V 70 L 14,88 A 9 9 0 0 1 1,75 L 30,9 Z",
                '2': "M 78,580 H 0 V 562 H 9 L 45,150 A 21 21 0 0 0 18,39 A 9 9 0 0 1 0,39 A 39 39 0 0 1 78,39 V 150 L 27,562 H 69 A 9 9 0 0 1 78,571 Z",
                '3': "M 0,39 A 39 39 0 0 1 78,39 C 78,180 58,265 44,285 C 58,305 78,390 78,541 A 39 39 0 0 1 0,541 A 9 9 0 0 1 18,541 A 21 21 0 0 0 60,541 C 60,395 50,315 28,295 A 9 9 0 0 1 28,275 C 50,255 60,175 60,39 A 21 21 0 0 0 18,39 A 9 9 0 0 1 0,39 Z",
                '4': "M 60,0 H 78 V 571 A 9 9 0 0 1 60,571 V 410 H 9 A 9 9 0 0 1 0,401 L 60,0 Z M 60,392 V 120 L 22,392 Z",
                '5': "M 0,0 H 69 A 9 9 0 0 1 69,18 H 18 V 240 C 30,225 50,220 39,220 C 72,220 78,270 78,541 A 39 39 0 0 1 0,541 A 9 9 0 0 1 18,541 A 21 21 0 0 0 60,541 C 60,295 39,238 18,238 H 0 Z",
                '6': "M 78,170 A 9 9 0 0 0 60,170 V 39 A 21 21 0 0 0 18,39 V 541 A 39 39 0 0 0 78,541 V 320 C 78,280 39,275 39,275 C 28,275 18,295 18,320 H 0 V 39 A 39 39 0 0 1 78,39 Z M 18,340 A 21 16 0 0 1 60,340 V 541 A 21 21 0 0 1 18,541 Z",
                '7': "M 0,0 H 78 V 18 L 27,571 A 9 9 0 0 1 9,567 L 59,18 H 0 Z",
                '8': "M 0,39 A 39 39 0 0 1 78,39 C 78,175 66,268 44,285 C 66,302 78,395 78,541 A 39 39 0 0 1 0,541 C 0,395 12,302 34,285 C 12,268 0,175 0,39 Z M 18,39 A 21 21 0 0 1 60,39 C 60,160 52,242 39,268 C 26,242 18,160 18,39 Z M 39,302 C 52,328 60,410 60,541 A 21 21 0 0 1 18,541 C 18,410 26,328 39,302 Z",
                '9': "M 0,410 A 9 9 0 0 0 18,410 V 39 A 39 39 0 0 1 78,39 V 541 A 39 39 0 0 1 0,541 H 18 V 260 C 18,285 39,290 39,290 C 72,290 60,260 60,260 V 39 A 21 21 0 0 0 18,39 Z M 18,39 A 21 21 0 0 1 60,39 V 240 A 21 16 0 0 1 18,240 Z"
            };

            // Web Audio Synthesizer
            let audioCtx = null;
            let tensionOsc = null;
            let tensionGain = null;

            function initAudio() {
                if (!audioCtx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (AudioContextClass) {
                        audioCtx = new AudioContextClass();
                    }
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            function startTensionAudio() {
                try {
                    initAudio();
                    if (!audioCtx) return;

                    tensionOsc = audioCtx.createOscillator();
                    tensionGain = audioCtx.createGain();

                    tensionOsc.type = 'triangle';
                    tensionOsc.frequency.setValueAtTime(75, audioCtx.currentTime);
                    tensionGain.gain.setValueAtTime(0.005, audioCtx.currentTime);

                    tensionOsc.connect(tensionGain);
                    tensionGain.connect(audioCtx.destination);
                    tensionOsc.start();
                } catch (e) {}
            }

            function updateTensionAudio(ratio) {
                if (!tensionOsc || !tensionGain || !audioCtx) return;
                try {
                    const freq = 75 + ratio * 240;
                    const vol = Math.min(0.08, ratio * 0.08);
                    tensionOsc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    tensionGain.gain.setValueAtTime(vol, audioCtx.currentTime);
                } catch (e) {}
            }

            function stopTensionAudio() {
                if (tensionOsc) {
                    try {
                        tensionGain.gain.setValueAtTime(0, audioCtx.currentTime);
                        tensionOsc.stop(audioCtx.currentTime + 0.04);
                    } catch (e) {}
                    tensionOsc = null;
                    tensionGain = null;
                }
            }

            function playBoingSound() {
                try {
                    initAudio();
                    if (!audioCtx) return;

                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const now = audioCtx.currentTime;

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(280, now);
                    osc.frequency.exponentialRampToValueAtTime(170, now + 0.08);
                    osc.frequency.exponentialRampToValueAtTime(110, now + 0.35);

                    gain.gain.setValueAtTime(0.20, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.42);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(now);
                    osc.stop(now + 0.45);
                } catch (e) {}
            }

            // Live Clock Engine
            let lastRenderedTime = '';

            function renderDigits(timeStr) {
                if (timeStr === lastRenderedTime) return;
                lastRenderedTime = timeStr;

                const d0 = timeStr[0] || '0';
                const d1 = timeStr[1] || '7';
                const d2 = timeStr[2] || '0';
                const d3 = timeStr[3] || '6';

                const p0 = document.getElementById('pathD0');
                const p1 = document.getElementById('pathD1');
                const p2 = document.getElementById('pathD2');
                const p3 = document.getElementById('pathD3');

                if (p0) p0.setAttribute('d', DIGIT_PATHS[d0] || DIGIT_PATHS['0']);
                if (p1) p1.setAttribute('d', DIGIT_PATHS[d1] || DIGIT_PATHS['7']);
                if (p2) p2.setAttribute('d', DIGIT_PATHS[d2] || DIGIT_PATHS['0']);
                if (p3) p3.setAttribute('d', DIGIT_PATHS[d3] || DIGIT_PATHS['6']);
            }

            function updateLiveClock() {
                const now = new Date();
                const hh = String(now.getHours()).padStart(2, '0');
                const mm = String(now.getMinutes()).padStart(2, '0');
                renderDigits(hh + mm);
            }

            // DOM References
            const clockMesh = document.getElementById('elasticClockMesh');
            const dragArea = document.getElementById('clockInteractiveArea');

            const col0 = document.getElementById('digitCol0');
            const col1 = document.getElementById('digitCol1');
            const colonCol = document.getElementById('colonCol');
            const col2 = document.getElementById('digitCol2');
            const col3 = document.getElementById('digitCol3');

            // Gesture & Pull-to-Stretch Physics
            let isDragging = false;
            let startY = 0;
            let currentPullY = 0;
            let currentTension = 0;
            let animFrameId = null;
            let watchdogTimer = null;

            function applyDeformation(pullY, scaleY, scaleX, catenaryRatio) {
                if (clockMesh) {
                    clockMesh.style.transform = `translate3d(0, ${pullY * 0.4}px, 0) scale(${scaleX}, ${scaleY})`;
                }

                // Catenary jelly droop on individual digit columns (preserving X coordinate attributes)
                const droopCenter = pullY * 0.35 * catenaryRatio;
                const droopMid = pullY * 0.24 * catenaryRatio;
                const droopEdge = pullY * 0.08 * catenaryRatio;

                if (col0) col0.setAttribute('transform', `translate(16, ${20 + droopEdge})`);
                if (col1) col1.setAttribute('transform', `translate(110, ${20 + droopMid})`);
                if (colonCol) colonCol.setAttribute('transform', `translate(202, ${20 + droopCenter})`);
                if (col2) col2.setAttribute('transform', `translate(240, ${20 + droopMid})`);
                if (col3) col3.setAttribute('transform', `translate(334, ${20 + droopEdge})`);
            }

            function resetToRest() {
                if (animFrameId) {
                    cancelAnimationFrame(animFrameId);
                    animFrameId = null;
                }
                if (watchdogTimer) {
                    clearTimeout(watchdogTimer);
                    watchdogTimer = null;
                }

                currentPullY = 0;
                currentTension = 0;
                isDragging = false;

                if (clockMesh) {
                    clockMesh.style.transform = '';
                }
                if (col0) col0.setAttribute('transform', 'translate(16, 20)');
                if (col1) col1.setAttribute('transform', 'translate(110, 20)');
                if (colonCol) colonCol.setAttribute('transform', 'translate(202, 20)');
                if (col2) col2.setAttribute('transform', 'translate(240, 20)');
                if (col3) col3.setAttribute('transform', 'translate(334, 20)');

                if (dragArea) {
                    dragArea.classList.remove('dragging');
                }
            }

            function onPointerDown(e) {
                if (animFrameId) {
                    cancelAnimationFrame(animFrameId);
                    animFrameId = null;
                }
                if (watchdogTimer) {
                    clearTimeout(watchdogTimer);
                    watchdogTimer = null;
                }

                isDragging = true;
                startY = e.clientY;

                if (dragArea) {
                    dragArea.classList.add('dragging');
                    if (dragArea.setPointerCapture) {
                        try { dragArea.setPointerCapture(e.pointerId); } catch (err) {}
                    }
                }

                startTensionAudio();
            }

            function onPointerMove(e) {
                if (!isDragging) return;

                const deltaY = Math.max(-25, e.clientY - startY);

                if (deltaY > 0) {
                    // Logarithmic progressive resistance curve: feels tight and rubbery
                    const tension = 1 - Math.exp(-deltaY / 280);
                    currentTension = tension;
                    currentPullY = tension * 165; // Max 165px downward sag

                    const scaleY = 1 + tension * 0.36;
                    const scaleX = 1 / Math.sqrt(scaleY);

                    applyDeformation(currentPullY, scaleY, scaleX, 1.0);
                    updateTensionAudio(tension);
                } else {
                    // Subtle upward spring compression if dragged upwards
                    const comp = deltaY * 0.2;
                    const scaleY = Math.max(0.92, 1 + comp / 400);
                    const scaleX = 1 / Math.sqrt(scaleY);
                    applyDeformation(comp, scaleY, scaleX, 0.2);
                    updateTensionAudio(0);
                }
            }

            function onPointerUp(e) {
                if (!isDragging) return;
                isDragging = false;

                if (dragArea) {
                    dragArea.classList.remove('dragging');
                    if (dragArea.releasePointerCapture && e && e.pointerId) {
                        try { dragArea.releasePointerCapture(e.pointerId); } catch (err) {}
                    }
                }

                stopTensionAudio();

                // If pulled sufficiently, play tactile sound and haptics
                if (Math.abs(currentPullY) > 15) {
                    playBoingSound();
                    if (navigator.vibrate) {
                        try { navigator.vibrate([18, 28, 38]); } catch (e) {}
                    }
                }

                // Guaranteed analytical damped harmonic oscillation snap-back
                const startAmp = currentPullY;
                const startTension = currentTension;
                const startTime = performance.now();
                const decay = 8.8;   // Damping coefficient
                const omega = 23.0;  // Oscillation frequency

                function snapStep(now) {
                    const t = (now - startTime) / 1000;

                    if (t < 0.58) {
                        // Closed-form damped harmonic formula: y(t) = A * e^(-decay*t) * cos(omega*t)
                        const envelope = Math.exp(-decay * t) * Math.cos(omega * t);
                        const curY = startAmp * envelope;
                        const curStretchY = 1 + (startTension * 0.36) * envelope;
                        const curStretchX = 1 / Math.sqrt(Math.max(0.6, curStretchY));

                        applyDeformation(curY, curStretchY, curStretchX, envelope);
                        animFrameId = requestAnimationFrame(snapStep);
                    } else {
                        resetToRest();
                    }
                }

                animFrameId = requestAnimationFrame(snapStep);

                // Hardware Watchdog Fallback: absolutely guarantees return to 0
                watchdogTimer = setTimeout(() => {
                    resetToRest();
                }, 620);
            }

            // Attach interaction listeners
            if (dragArea) {
                dragArea.addEventListener('pointerdown', onPointerDown);
                window.addEventListener('pointermove', onPointerMove);
                window.addEventListener('pointerup', onPointerUp);
                window.addEventListener('pointercancel', onPointerUp);
                window.addEventListener('blur', onPointerUp);
                document.addEventListener('mouseleave', onPointerUp);
            }

            // Wallpaper Switcher (Called from outer card preview switcher or global Grid BG)
            window.setClockBg = function (bg) {
                const container = document.getElementById('clockContainer');
                if (container) {
                    container.setAttribute('data-clock-bg', bg === 'blob' ? 'blob' : 'black');
                }
                try {
                    localStorage.setItem('elastic-clock-bg', bg);
                } catch (e) {}
            };

            // Initialization
            window.addEventListener('DOMContentLoaded', () => {
                updateLiveClock();
                setInterval(updateLiveClock, 1000);

                let savedBg = 'black';
                try {
                    savedBg = localStorage.getItem('elastic-clock-bg') || 'black';
                } catch (e) {}
                window.setClockBg(savedBg);
            });
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elastic Lockscreen Glass Clock — Glass Dark</title>
    <meta name="description" content="Lockscreen Glass Clock dengan widget kotak kaca frosted, digit condensed lockscreen elegan, fisika elastis pull-to-stretch, dan audio synth boing.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            height: 100%;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            min-height: 100%;
            background: transparent;
            overflow: hidden;
            user-select: none; -webkit-user-select: none;
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── Outer Stage & Wallpaper ── */
        #clockContainer {
            width: 100%;
            height: 100%;
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            transition: background 0.35s ease;
            position: relative;
        }

        #clockContainer[data-clock-bg="black"],
        #clockContainer[data-clock-bg="dark"] {
            background-color: #08080C;
            background-image: radial-gradient(ellipse at 50% 35%, #181C28 0%, #0D0F17 55%, #08080C 100%);
        }

        #clockContainer[data-clock-bg="blob"] {
            background-color: #0D0D0D;
            background-image: url('../blob_4-5.svg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
        }

        /* ── Glass Clock Box ("Kotak Biasa" Lockscreen Widget) ── */
        .clock-glass-box {
            width: 100%;
            max-width: 370px;
            padding: 24px 22px 18px;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            border: 1.5px solid rgba(255, 255, 255, 0.22);
            border-top: 1.5px solid rgba(255, 255, 255, 0.42);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55),
                        inset 0 1px 1px rgba(255, 255, 255, 0.30);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
            touch-action: none;
            position: relative;
            transform-origin: center center;
            will-change: transform;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .clock-glass-box:hover {
            border-color: rgba(255, 255, 255, 0.32);
            border-top-color: rgba(255, 255, 255, 0.55);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65),
                        inset 0 1px 2px rgba(255, 255, 255, 0.38);
        }

        .clock-glass-box.dragging {
            cursor: grabbing;
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.75),
                        0 0 30px rgba(56, 189, 248, 0.25),
                        inset 0 1px 2px rgba(255, 255, 255, 0.45);
        }

        /* ── Date Line (Above Digits) ── */
        #dateLine {
            font-size: 15px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.86);
            letter-spacing: 0.02em;
            margin-bottom: 20px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            will-change: transform;
            pointer-events: none;
        }

        /* ── Elastic Digits Mesh ── */
        #elasticMesh {
            display: flex;
            flex-direction: column;
            align-items: center;
            will-change: transform;
            pointer-events: none;
        }

        #digitRow {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 8px 0 14px;
        }

        /* ── Condensed Tall Lockscreen Numeral ── */
        .gd-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            will-change: transform;
        }

        .gd {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: clamp(66px, 16vw, 88px);
            font-weight: 800;
            line-height: 1;
            /* Condensed tall geometry matching lockscreen style */
            display: inline-block;
            transform: scaleY(1.46) scaleX(0.86);
            transform-origin: center center;
            color: rgba(235, 248, 255, 0.92);
            -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.98);
            text-shadow:
                0 0 24px rgba(186, 230, 253, 0.45),
                0 0 48px rgba(186, 230, 253, 0.18),
                0 4px 16px rgba(0, 0, 0, 0.50);
            filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.35));
            letter-spacing: -0.02em;
        }

        /* ── Colon Separator Dots ── */
        #colonGroup {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 0 8px;
            will-change: transform;
        }

        .cdot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(235, 248, 255, 0.92);
            border: 1.5px solid rgba(255, 255, 255, 0.98);
            box-shadow:
                0 0 16px rgba(186, 230, 253, 0.7),
                0 0 32px rgba(186, 230, 253, 0.3),
                0 2px 6px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
        }

        /* ── Bottom Drag Handle Pill ── */
        .clock-drag-pill {
            width: 44px;
            height: 4.5px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.38);
            margin-top: 14px;
            transition: background 0.2s, transform 0.2s, width 0.2s;
            pointer-events: none;
        }

        .clock-glass-box:hover .clock-drag-pill {
            background: rgba(255, 255, 255, 0.65);
            width: 52px;
        }

        .clock-glass-box.dragging .clock-drag-pill {
            background: #38BDF8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
            width: 58px;
        }

        /* ── Subtle Pull Gesture Hint ── */
        .clock-pull-hint {
            font-size: 11px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 0.04em;
            margin-top: 8px;
            text-transform: uppercase;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .clock-glass-box.dragging .clock-pull-hint {
            opacity: 0;
        }

        /* ── Compact screens (fit perfectly in small bento cards) ── */
        @media (max-width: 380px) {
            .clock-glass-box {
                padding: 18px 16px 14px;
                border-radius: 26px;
            }
            .gd {
                font-size: 60px;
            }
            #colonGroup {
                gap: 12px;
                padding: 0 4px;
            }
            .cdot {
                width: 10px;
                height: 10px;
            }
            #dateLine {
                font-size: 13px;
                margin-bottom: 14px;
            }
        }
    </style>
</head>
<body>
    <div id="clockContainer" data-clock-bg="black">
        <div class="clock-glass-box" id="clockBox" role="region" aria-label="Elastic Lockscreen Glass Clock — drag down to stretch">
            <!-- Date header -->
            <div id="dateLine">Sat, Sep 12</div>

            <!-- Elastic digits row -->
            <div id="elasticMesh">
                <div id="digitRow">
                    <span class="gd-wrap" id="w0"><span class="gd" id="d0">0</span></span>
                    <span class="gd-wrap" id="w1"><span class="gd" id="d1">0</span></span>
                    <div id="colonGroup">
                        <div class="cdot"></div>
                        <div class="cdot"></div>
                    </div>
                    <span class="gd-wrap" id="w2"><span class="gd" id="d2">3</span></span>
                    <span class="gd-wrap" id="w3"><span class="gd" id="d3">5</span></span>
                </div>
            </div>

            <!-- Drag handle pill -->
            <div class="clock-drag-pill" aria-hidden="true"></div>
            <!-- Pull gesture hint -->
            <div class="clock-pull-hint">Tarik ke bawah • Pull to stretch</div>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        // ── DOM References ──
        const container = document.getElementById('clockContainer');
        const box       = document.getElementById('clockBox');
        const mesh      = document.getElementById('elasticMesh');
        const dateEl    = document.getElementById('dateLine');
        const d0        = document.getElementById('d0');
        const d1        = document.getElementById('d1');
        const d2        = document.getElementById('d2');
        const d3        = document.getElementById('d3');
        const w0        = document.getElementById('w0');
        const w1        = document.getElementById('w1');
        const w2        = document.getElementById('w2');
        const w3        = document.getElementById('w3');
        const colon     = document.getElementById('colonGroup');

        // ── Auto scale-to-fit if container is compact ──
        function fitClock() {
            if (!box) return;
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const naturalW = 370;
            const naturalH = 260;
            const padX = 20;
            const padY = 20;
            const scaleW = (vw - padX) / naturalW;
            const scaleH = (vh - padY) / naturalH;
            const scale = Math.min(1.0, scaleW, scaleH);
            if (scale < 0.98) {
                box.style.transform = `scale(${Math.max(0.45, scale).toFixed(3)})`;
            } else {
                box.style.transform = '';
            }
        }
        window.addEventListener('resize', fitClock);
        window.addEventListener('DOMContentLoaded', fitClock);
        setTimeout(fitClock, 20);

        // ── Live Clock Tick ──
        const DAYS   = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        let lastTimeStr = '';

        function tick() {
            const now = new Date();
            const hh  = ('0' + now.getHours()).slice(-2);
            const mm  = ('0' + now.getMinutes()).slice(-2);
            const t   = hh + mm;
            if (t !== lastTimeStr) {
                lastTimeStr = t;
                d0.textContent = hh[0];
                d1.textContent = hh[1];
                d2.textContent = mm[0];
                d3.textContent = mm[1];
            }
            dateEl.textContent = `${DAYS[now.getDay()]}, ${MONTHS[now.getMonth()]} ${now.getDate()}`;
        }
        tick();
        setInterval(tick, 1000);

        // ── Web Audio Synthesizer ──
        let audioCtx = null;
        let tensionOsc = null;
        let tensionGain = null;

        function initAudio() {
            if (audioCtx) return;
            try {
                const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
                if (AudioCtxClass) audioCtx = new AudioCtxClass();
            } catch (e) {}
        }

        function wakeAudio() {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function startTensionAudio() {
            try {
                initAudio();
                wakeAudio();
                if (!audioCtx) return;

                tensionOsc = audioCtx.createOscillator();
                tensionGain = audioCtx.createGain();

                tensionOsc.type = 'triangle';
                tensionOsc.frequency.setValueAtTime(82, audioCtx.currentTime);
                tensionGain.gain.setValueAtTime(0.005, audioCtx.currentTime);

                tensionOsc.connect(tensionGain);
                tensionGain.connect(audioCtx.destination);
                tensionOsc.start();
            } catch (e) {}
        }

        function updateTensionAudio(ratio) {
            if (!tensionOsc || !audioCtx) return;
            try {
                tensionOsc.frequency.setValueAtTime(82 + ratio * 280, audioCtx.currentTime);
                tensionGain.gain.setValueAtTime(Math.min(0.08, ratio * 0.08), audioCtx.currentTime);
            } catch (e) {}
        }

        function stopTensionAudio() {
            if (!tensionOsc || !audioCtx) return;
            try {
                tensionGain.gain.setValueAtTime(0, audioCtx.currentTime);
                tensionOsc.stop(audioCtx.currentTime + 0.04);
            } catch (e) {}
            tensionOsc = null;
            tensionGain = null;
        }

        function playBoingSound() {
            try {
                initAudio();
                wakeAudio();
                if (!audioCtx) return;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const now = audioCtx.currentTime;

                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(140, now + 0.10);
                osc.frequency.exponentialRampToValueAtTime(88,  now + 0.42);

                gain.gain.setValueAtTime(0.22, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.48);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.50);
            } catch (e) {}
        }

        // ── Physics Engine (Pull-to-Stretch Jelly Deformation) ──
        let isDragging = false;
        let startY = 0;
        let pullY = 0;
        let tensionRatio = 0;
        let rafId = null;
        let watchDogId = null;

        function applyDeformation(py, sy, sx, ratio) {
            mesh.style.transform = `translate3d(0, ${(py * 0.36).toFixed(2)}px, 0) scaleX(${sx.toFixed(4)}) scaleY(${sy.toFixed(4)})`;

            // Catenary sag: Center colon sags most, outer digits sag least
            const sagFar = (py * 0.28 * ratio).toFixed(2);
            const sagMid = (py * 0.44 * ratio).toFixed(2);
            const sagCtr = (py * 0.58 * ratio).toFixed(2);

            w0.style.transform = `translateY(${-sagFar}px)`;
            w1.style.transform = `translateY(${-sagMid}px)`;
            colon.style.transform = `translateY(${-sagCtr}px)`;
            w2.style.transform = `translateY(${-sagMid}px)`;
            w3.style.transform = `translateY(${-sagFar}px)`;
        }

        function clearDeformation() {
            mesh.style.transform = '';
            [w0, w1, w2, w3, colon].forEach(el => { el.style.transform = ''; });
        }

        function resetPhysics() {
            if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
            if (watchDogId) { clearTimeout(watchDogId); watchDogId = null; }
            pullY = 0;
            tensionRatio = 0;
            isDragging = false;
            clearDeformation();
            box.classList.remove('dragging');
            fitClock();
        }

        function getClientY(e) {
            if (typeof e.clientY === 'number') return e.clientY;
            if (e.touches && e.touches[0]) return e.touches[0].clientY;
            return startY;
        }

        function onPointerDown(e) {
            if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
            if (watchDogId) { clearTimeout(watchDogId); watchDogId = null; }
            isDragging = true;
            startY = getClientY(e);
            box.classList.add('dragging');
            try {
                if (box.setPointerCapture && e.pointerId != null) {
                    box.setPointerCapture(e.pointerId);
                }
            } catch (_) {}
            startTensionAudio();
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            const dy = getClientY(e) - startY;

            if (dy > 0) {
                tensionRatio = 1 - Math.exp(-dy / 240);
                pullY = tensionRatio * 160;
                const sy = 1 + tensionRatio * 0.35;
                const sx = 1 / Math.sqrt(sy);
                applyDeformation(pullY, sy, sx, 1.0);
                updateTensionAudio(tensionRatio);
            } else {
                const comp = dy * 0.16;
                const sy2 = Math.max(0.92, 1 + comp / 360);
                const sx2 = 1 / Math.sqrt(sy2);
                applyDeformation(comp, sy2, sx2, 0.15);
                updateTensionAudio(0);
            }
        }

        function onPointerUp(e) {
            if (!isDragging) return;
            isDragging = false;
            box.classList.remove('dragging');

            try {
                if (box.releasePointerCapture && e && e.pointerId != null) {
                    box.releasePointerCapture(e.pointerId);
                }
            } catch (_) {}

            stopTensionAudio();

            if (Math.abs(pullY) > 12) {
                playBoingSound();
                if (navigator.vibrate) {
                    try { navigator.vibrate([18, 30, 40]); } catch (_) {}
                }
            }

            // Spring Damped Oscillation Snapback
            const initialAmp = pullY;
            const initialTen = tensionRatio;
            const startTime = performance.now();
            const DAMPING = 8.5;
            const FREQ = 22.0;

            function snapStep(now) {
                const elapsed = (now - startTime) / 1000;
                if (elapsed < 0.60) {
                    const envelope = Math.exp(-DAMPING * elapsed) * Math.cos(FREQ * elapsed);
                    const sy = 1 + (initialTen * 0.35) * Math.max(0, envelope);
                    const sx = 1 / Math.sqrt(Math.max(0.65, sy));
                    applyDeformation(initialAmp * envelope, sy, sx, Math.max(0, envelope));
                    rafId = requestAnimationFrame(snapStep);
                } else {
                    resetPhysics();
                }
            }

            rafId = requestAnimationFrame(snapStep);
            watchDogId = setTimeout(resetPhysics, 650);
        }

        // ── Event Listeners ──
        box.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
        window.addEventListener('pointercancel', onPointerUp);
        window.addEventListener('blur', onPointerUp);
        document.addEventListener('mouseleave', onPointerUp);

        // Touch fallbacks
        box.addEventListener('touchstart', e => { onPointerDown(e.touches[0]); }, { passive: true });
        box.addEventListener('touchmove',  e => { e.preventDefault(); onPointerMove(e.touches[0]); }, { passive: false });
        box.addEventListener('touchend',   e => { onPointerUp(e.changedTouches[0]); });

        // ── Wallpaper Switcher API ──
        window.setClockBg = function (bg) {
            if (container) {
                container.setAttribute('data-clock-bg', bg === 'blob' ? 'blob' : 'black');
            }
            try { localStorage.setItem('elastic-clock-bg', bg); } catch (_) {}
        };

        // Parent iframe message listener
        window.addEventListener('message', function (e) {
            if (e.data && e.data.type === 'SET_COMPONENT_BG') {
                window.setClockBg(e.data.bg);
            }
        });

        // Restore saved background
        try {
            const savedBg = localStorage.getItem('elastic-clock-bg') || 'black';
            window.setClockBg(savedBg);
        } catch (_) {}

    })();
    </script>
</body>
</html>

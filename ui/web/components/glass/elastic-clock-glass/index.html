<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elastic Lockscreen Glass Clock</title>
    <link rel="stylesheet" href="../css.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="clock-container" id="clockContainer" data-clock-bg="black">
        <!-- Draggable Pull-to-Stretch Interaction Area -->
        <div class="clock-interactive-area" id="clockInteractiveArea" role="region" aria-label="Elastic Glass Clock">
            <div class="elastic-clock-mesh" id="elasticClockMesh">
                <svg class="clock-svg" id="clockSvg" viewBox="0 0 430 620" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Translucent Frosted Glass Fill Gradient -->
                        <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
                            <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.14" />
                            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.26" />
                        </linearGradient>

                        <!-- White Specular Rim Stroke Gradient -->
                        <linearGradient id="rimStroke" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
                            <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.65" />
                            <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.45" />
                            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.85" />
                        </linearGradient>

                        <!-- Glass Drop Shadow Filter -->
                        <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.75" />
                        </filter>
                    </defs>

                    <!-- Digits Group with Catenary Sag Physics -->
                    <g id="digitsGroup" class="digits-group" filter="url(#glassShadow)">
                        <!-- Digit 1 (Tens of Hour) -->
                        <g id="digitCol0" class="digit-col" transform="translate(16, 20)">
                            <path id="pathD0" class="glass-digit" fill="url(#glassFill)" stroke="url(#rimStroke)" stroke-width="1.8" fill-rule="evenodd" d="" />
                        </g>

                        <!-- Digit 2 (Units of Hour) -->
                        <g id="digitCol1" class="digit-col" transform="translate(110, 20)">
                            <path id="pathD1" class="glass-digit" fill="url(#glassFill)" stroke="url(#rimStroke)" stroke-width="1.8" fill-rule="evenodd" d="" />
                        </g>

                        <!-- Colon ':' Group -->
                        <g id="colonCol" class="colon-group" transform="translate(202, 20)">
                            <circle id="colonDotTop" class="colon-dot" cx="13" cy="205" r="13" fill="url(#glassFill)" stroke="url(#rimStroke)" stroke-width="1.8" />
                            <circle id="colonDotBottom" class="colon-dot" cx="13" cy="375" r="13" fill="url(#glassFill)" stroke="url(#rimStroke)" stroke-width="1.8" />
                        </g>

                        <!-- Digit 3 (Tens of Minute) -->
                        <g id="digitCol2" class="digit-col" transform="translate(240, 20)">
                            <path id="pathD2" class="glass-digit" fill="url(#glassFill)" stroke="url(#rimStroke)" stroke-width="1.8" fill-rule="evenodd" d="" />
                        </g>

                        <!-- Digit 4 (Units of Minute) -->
                        <g id="digitCol3" class="digit-col" transform="translate(334, 20)">
                            <path id="pathD3" class="glass-digit" fill="url(#glassFill)" stroke="url(#rimStroke)" stroke-width="1.8" fill-rule="evenodd" d="" />
                        </g>
                    </g>
                </svg>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>

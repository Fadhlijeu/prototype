<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elastic Lockscreen Glass Clock — Pull to Stretch</title>
    <link rel="stylesheet" href="../css.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="clock-stage" id="clockStage" data-stage-bg="black">
        <!-- Floating Controls Bar -->
        <header class="clock-top-bar">
            <!-- Wallpaper Switcher -->
            <div class="ctrl-group">
                <span class="ctrl-label">Latar:</span>
                <button type="button" class="btn-ctrl active" data-bg="black" id="btnBgBlack" onclick="setClockBg('black')">
                    <span class="dot-swatch black-swatch"></span> Black
                </button>
                <button type="button" class="btn-ctrl" data-bg="blob" id="btnBgBlob" onclick="setClockBg('blob')">
                    <span class="dot-swatch blob-swatch"></span> Blob
                </button>
            </div>

            <!-- Time Mode Toggle -->
            <div class="ctrl-group">
                <span class="ctrl-label">Waktu:</span>
                <button type="button" class="btn-ctrl active" id="btnTimePhoto" onclick="setTimeMode('photo')">
                    07:06
                </button>
                <button type="button" class="btn-ctrl" id="btnTimeLive" onclick="setTimeMode('live')">
                    Live
                </button>
            </div>

            <!-- Elasticity Physics Preset -->
            <div class="ctrl-group">
                <span class="ctrl-label">Fisika:</span>
                <button type="button" class="btn-ctrl active" data-elasticity="jelly" onclick="setElasticity('jelly', this)">
                    Jelly
                </button>
                <button type="button" class="btn-ctrl" data-elasticity="rubber" onclick="setElasticity('rubber', this)">
                    Rubber
                </button>
                <button type="button" class="btn-ctrl" data-elasticity="slime" onclick="setElasticity('slime', this)">
                    Slime
                </button>
            </div>
        </header>

        <!-- Pull Hint Banner -->
        <div class="pull-hint" id="pullHint">
            <span class="pulse-arrow">↓</span> Tarik jam ke bawah — semakin ditarik, semakin kendor melar
        </div>

        <!-- Tension & Elongation Telemetry HUD -->
        <div class="tension-hud" id="tensionHud">
            <div class="hud-item">
                <span class="hud-label">Peregangan</span>
                <span class="hud-val" id="hudStretchVal">+0%</span>
            </div>
            <div class="hud-bar-track">
                <div class="hud-bar-fill" id="hudBarFill"></div>
            </div>
            <div class="hud-item">
                <span class="hud-label">Tegangan</span>
                <span class="hud-val" id="hudTensionVal">0.0 N</span>
            </div>
        </div>

        <!-- Draggable Clock Wrapper -->
        <main class="clock-interactive-area" id="clockDragArea">
            <div class="clock-anchor" id="clockAnchor">
                <!-- Elastic Clock Graphic Container -->
                <div class="elastic-clock-mesh" id="elasticClockMesh">
                    <svg class="clock-svg" id="clockSvg" viewBox="0 0 540 420" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <!-- Frosted Glass Gradient -->
                            <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
                                <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.10" />
                                <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.18" />
                            </linearGradient>

                            <!-- Specular Rim Gradient -->
                            <linearGradient id="rimStroke" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
                                <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.55" />
                                <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.40" />
                                <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.80" />
                            </linearGradient>

                            <!-- Tension Internal Glow Filter -->
                            <filter id="glassGlow" x="-20%" y="-20%" width="140%" height="140%">
                                <feGaussianBlur stdDeviation="4" result="blur" />
                                <feComposite in="SourceGraphic" in2="blur" operator="over" />
                            </filter>
                        </defs>

                        <!-- Digits Group with Dynamic Droop Matrix -->
                        <g id="digitsGroup" class="digits-group">
                            <!-- Digit 1 (Tens of Hour) -->
                            <g id="digitCol0" class="digit-col" transform="translate(18, 0)">
                                <path id="pathD0" class="glass-digit" d="" />
                            </g>

                            <!-- Digit 2 (Units of Hour) -->
                            <g id="digitCol1" class="digit-col" transform="translate(142, 0)">
                                <path id="pathD1" class="glass-digit" d="" />
                            </g>

                            <!-- Colon ':' Group (with secondary trailing jelly physics) -->
                            <g id="colonCol" class="colon-group" transform="translate(262, 0)">
                                <circle id="colonDotTop" class="colon-dot" cx="12" cy="140" r="14" />
                                <circle id="colonDotBottom" class="colon-dot" cx="12" cy="275" r="14" />
                            </g>

                            <!-- Digit 3 (Tens of Minute) -->
                            <g id="digitCol2" class="digit-col" transform="translate(296, 0)">
                                <path id="pathD2" class="glass-digit" d="" />
                            </g>

                            <!-- Digit 4 (Units of Minute) -->
                            <g id="digitCol3" class="digit-col" transform="translate(420, 0)">
                                <path id="pathD3" class="glass-digit" d="" />
                            </g>
                        </g>
                    </svg>

                    <!-- Elastic Pull Handle / Ribbon Anchor -->
                    <div class="pull-handle-wrap" id="pullHandle">
                        <div class="pull-ribbon">
                            <span class="ribbon-grip"></span>
                            <span class="ribbon-text">TARIK KE BAWAH</span>
                            <span class="ribbon-grip"></span>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Elastic Sag Floor Indicator -->
        <footer class="clock-bottom-bar">
            <button type="button" class="btn-snap-reset" onclick="triggerSnapBack()">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                </svg>
                Kembalikan Bentuk
            </button>
        </footer>
    </div>

    <script src="index.js"></script>
</body>
</html>

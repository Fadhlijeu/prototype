<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Glowing Progress Bar — Glass Dark Premium</title>
    <link rel="stylesheet" href="../css.css">
    <link rel="stylesheet" href="index.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="progress-card">
        <div class="ambient-glow"></div>

        <div class="prog-header">
            <div class="header-title-box">
                <div class="status-icon-box">
                    <i data-lucide="cloud-lightning"></i>
                </div>
                <div>
                    <div class="prog-title">Cloud Storage Sync</div>
                    <div class="prog-sub">Sinkronisasi aset multi-region live</div>
                </div>
            </div>
            <div class="storage-detail" id="storageDetail">78.4 / 100 GB</div>
        </div>

        <div class="metric-row">
            <div class="big-number-group">
                <span class="counter-val" id="counterVal">78</span>
                <span class="percent-sign">%</span>
            </div>
        </div>

        <div class="glass-track">
            <div class="glass-fill" id="glassFill" style="width: 14%;"></div>
        </div>

        <div class="telemetry-row">
            <div class="telemetry-item">
                <span class="telemetry-dot"></span>
                <span id="syncStatusLabel">Streaming Data Multi-Region</span>
            </div>
            <div class="telemetry-speed" id="syncSpeedLabel">28.4 MB/s</div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Glowing Progress Bar — Glass Dark Premium (All-in-One)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
        <!-- Shared Glass Design System Tokens & White/Blob Themes -->
    <link rel="stylesheet" href="../css.css">
    <style>
        :root {
            --bg-page: #08080C;
            --glass-card: rgba(255, 255, 255, 0.06);
            --glass-border-top: rgba(255, 255, 255, 0.24);
            --glass-border-side: rgba(255, 255, 255, 0.10);
            --glass-border-bottom: rgba(255, 255, 255, 0.04);
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.65);
            --text-muted: rgba(255, 255, 255, 0.38);
            --accent-cyan: #38BDF8;
            --accent-blue: #3B82F6;
            --accent-purple: #8B5CF6;
            --ease-spring: cubic-bezier(0.34, 1.25, 0.64, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-page);
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .progress-card {
            width: 100%;
            max-width: 420px;
            padding: 24px;
            border-radius: 24px;
            background: var(--glass-card);
            backdrop-filter: blur(28px) saturate(160%);
            -webkit-backdrop-filter: blur(28px) saturate(160%);
            border: 1px solid transparent;
            border-top-color: var(--glass-border-top);
            border-left-color: var(--glass-border-side);
            border-right-color: var(--glass-border-side);
            border-bottom-color: var(--glass-border-bottom);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }

        /* Ambient Glow Behind Card */
        .ambient-glow {
            position: absolute;
            top: -40px; right: -40px;
            width: 180px; height: 180px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(40px);
            pointer-events: none;
            z-index: 0;
            animation: pulseGlow 6s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.9); opacity: 0.5; }
            100% { transform: scale(1.15); opacity: 0.85; }
        }

        .prog-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 1;
        }

        .header-title-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-icon-box {
            width: 36px; height: 36px;
            border-radius: 10px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-cyan);
        }

        .status-icon-box svg {
            width: 18px; height: 18px;
        }

        .prog-title {
            font-size: 14.5px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .prog-sub {
            font-size: 11.5px;
            color: var(--text-secondary);
        }

        /* Big Glowing Percentage Metric */
        .metric-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            position: relative;
            z-index: 1;
        }

        .big-number-group {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .counter-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 38px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            text-shadow: 0 0 24px rgba(56, 189, 248, 0.45);
        }

        .percent-sign {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            font-weight: 600;
            color: var(--accent-cyan);
        }

        .storage-detail {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Animated Glowing Glass Track */
        .glass-track {
            width: 100%;
            height: 14px;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        .glass-fill {
            height: 100%;
            width: 78%;
            border-radius: 8px;
            background: linear-gradient(90deg, #2563EB 0%, #38BDF8 50%, #8B5CF6 100%);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.65), 0 0 8px rgba(139, 92, 246, 0.4);
            transition: width 0.6s var(--ease-spring);
            position: relative;
            overflow: hidden;
        }

        /* Shimmering Animated Beam */
        .glass-fill::after {
            content: "";
            position: absolute;
            top: 0; left: 0; bottom: 0;
            width: 60px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
            transform: skewX(-20deg);
            animation: shimmerSweep 2.2s infinite ease-in-out;
        }

        @keyframes shimmerSweep {
            0% { transform: translateX(-80px) skewX(-20deg); }
            100% { transform: translateX(450px) skewX(-20deg); }
        }

        /* Live Telemetry Status Row */
        .telemetry-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: 6px;
            position: relative;
            z-index: 1;
        }

        .telemetry-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11.5px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-secondary);
        }

        .telemetry-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #10B981;
            box-shadow: 0 0 8px #10B981;
            animation: pulseDot 1.5s infinite ease-in-out;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        .telemetry-speed {
            font-size: 11.5px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-cyan);
            font-weight: 600;
        }

        @media (max-width: 280px) {
            body { padding: 4px; }
            .progress-card { padding: 12px 10px; border-radius: 18px; gap: 8px; }
            .header-title-box { gap: 6px; }
            .status-icon-box { width: 28px; height: 28px; }
            .prog-title { font-size: 12px; }
            .prog-sub { display: none; }
            .storage-detail { font-size: 10px; }
            .counter-val { font-size: 32px; }
            .telemetry-row { display: none; }
        }
    </style>
</head>
<body>

    <div class="progress-card">
        <div class="ambient-glow"></div>

        <div class="prog-header">
            <div class="header-title-box">
                <div class="status-icon-box">
                    <i data-lucide="cloud-lightning"></i>
                </div>
                <div>
                    <div class="prog-title">Cloud Storage Sync</div>
                    <div class="prog-sub">Sinkronisasi aset multi-region live</div>
                </div>
            </div>
            <div class="storage-detail" id="storageDetail">14.0 / 100 GB</div>
        </div>

        <div class="metric-row">
            <div class="big-number-group">
                <span class="counter-val" id="counterVal">14</span>
                <span class="percent-sign">%</span>
            </div>
        </div>

        <div class="glass-track">
            <div class="glass-fill" id="glassFill" style="width: 14%;"></div>
        </div>

        <div class="telemetry-row">
            <div class="telemetry-item">
                <span class="telemetry-dot"></span>
                <span id="syncStatusLabel">Streaming Data Multi-Region</span>
            </div>
            <div class="telemetry-speed" id="syncSpeedLabel">28.4 MB/s</div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        let currentPercent = 14;
        const totalGb = 100;
        const speeds = ["24.2 MB/s", "29.8 MB/s", "33.5 MB/s", "27.1 MB/s", "38.6 MB/s"];

        function updateProgress(val) {
            currentPercent = Math.max(0, Math.min(100, Math.round(val)));
            document.getElementById('counterVal').textContent = currentPercent;
            document.getElementById('glassFill').style.width = `${currentPercent}%`;
            document.getElementById('storageDetail').textContent = `${((currentPercent / 100) * totalGb).toFixed(1)} / ${totalGb} GB`;
        }

        // Autonomous auto-advancing progress simulation (Zero dummy buttons!)
        function runAutoSyncLoop() {
            const step = () => {
                if (currentPercent < 100) {
                    const inc = Math.floor(Math.random() * 5) + 2;
                    currentPercent = Math.min(100, currentPercent + inc);
                    updateProgress(currentPercent);

                    const speedEl = document.getElementById('syncSpeedLabel');
                    if (speedEl) speedEl.textContent = speeds[Math.floor(Math.random() * speeds.length)];

                    const statusEl = document.getElementById('syncStatusLabel');
                    if (statusEl) {
                        statusEl.textContent = currentPercent === 100 ? "Sinkronisasi Selesai" : "Streaming Data Multi-Region";
                    }

                    const nextDelay = currentPercent === 100 ? 2400 : Math.floor(Math.random() * 300) + 250;
                    setTimeout(step, nextDelay);
                } else {
                    currentPercent = 5;
                    updateProgress(currentPercent);
                    const statusEl = document.getElementById('syncStatusLabel');
                    if (statusEl) statusEl.textContent = "Menginisialisasi Sesi Baru...";
                    setTimeout(step, 800);
                }
            };
            setTimeout(step, 400);
        }

        runAutoSyncLoop();
    </script>
</body>
</html>

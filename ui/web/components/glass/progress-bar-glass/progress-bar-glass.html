<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Glowing Progress Bar — Glass Dark Premium (All-in-One)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-page: #08080C;
            --glass-card: rgba(255, 255, 255, 0.06);
            --glass-border-top: rgba(255, 255, 255, 0.24);
            --glass-border-side: rgba(255, 255, 255, 0.10);
            --glass-border-bottom: rgba(255, 255, 255, 0.04);
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.65);
            --text-muted: rgba(255, 255, 255, 0.38);
            --accent-cyan: #38BDF8;
            --accent-blue: #3B82F6;
            --accent-purple: #8B5CF6;
            --ease-spring: cubic-bezier(0.34, 1.25, 0.64, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-page);
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .progress-card {
            width: 100%;
            max-width: 420px;
            padding: 24px;
            border-radius: 24px;
            background: var(--glass-card);
            backdrop-filter: blur(28px) saturate(160%);
            -webkit-backdrop-filter: blur(28px) saturate(160%);
            border: 1px solid transparent;
            border-top-color: var(--glass-border-top);
            border-left-color: var(--glass-border-side);
            border-right-color: var(--glass-border-side);
            border-bottom-color: var(--glass-border-bottom);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }

        /* Ambient Glow Behind Card */
        .ambient-glow {
            position: absolute;
            top: -40px; right: -40px;
            width: 180px; height: 180px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(40px);
            pointer-events: none;
            z-index: 0;
            animation: pulseGlow 6s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.9); opacity: 0.5; }
            100% { transform: scale(1.15); opacity: 0.85; }
        }

        .prog-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 1;
        }

        .header-title-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-icon-box {
            width: 36px; height: 36px;
            border-radius: 10px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-cyan);
        }

        .status-icon-box svg {
            width: 18px; height: 18px;
        }

        .prog-title {
            font-size: 14.5px;
            font-weight: 600;
            color: #FFFFFF;
        }

        .prog-sub {
            font-size: 11.5px;
            color: var(--text-secondary);
        }

        /* Big Glowing Percentage Metric */
        .metric-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            position: relative;
            z-index: 1;
        }

        .big-number-group {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .counter-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 38px;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: -0.02em;
            text-shadow: 0 0 24px rgba(56, 189, 248, 0.45);
        }

        .percent-sign {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            font-weight: 600;
            color: var(--accent-cyan);
        }

        .storage-detail {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Animated Glowing Glass Track */
        .glass-track {
            width: 100%;
            height: 14px;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        .glass-fill {
            height: 100%;
            width: 78%;
            border-radius: 8px;
            background: linear-gradient(90deg, #2563EB 0%, #38BDF8 50%, #8B5CF6 100%);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.65), 0 0 8px rgba(139, 92, 246, 0.4);
            transition: width 0.6s var(--ease-spring);
            position: relative;
            overflow: hidden;
        }

        /* Shimmering Animated Beam */
        .glass-fill::after {
            content: "";
            position: absolute;
            top: 0; left: 0; bottom: 0;
            width: 60px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
            transform: skewX(-20deg);
            animation: shimmerSweep 2.2s infinite ease-in-out;
        }

        @keyframes shimmerSweep {
            0% { transform: translateX(-80px) skewX(-20deg); }
            100% { transform: translateX(450px) skewX(-20deg); }
        }

        /* Interactive Controls Bar */
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 4px;
            position: relative;
            z-index: 1;
        }

        .btn-prog-ctrl {
            flex: 1;
            padding: 7px 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-prog-ctrl:hover {
            background: rgba(56, 189, 248, 0.18);
            border-color: rgba(56, 189, 248, 0.4);
            color: #FFFFFF;
            transform: translateY(-1px);
        }

        .btn-prog-ctrl svg {
            width: 13px; height: 13px;
        }
    </style>
</head>
<body>

    <div class="progress-card">
        <div class="ambient-glow"></div>

        <div class="prog-header">
            <div class="header-title-box">
                <div class="status-icon-box">
                    <i data-lucide="cloud-lightning"></i>
                </div>
                <div>
                    <div class="prog-title">Cloud Storage Sync</div>
                    <div class="prog-sub">Sinkronisasi aset multi-region live</div>
                </div>
            </div>
            <div class="storage-detail" id="storageDetail">78.4 / 100 GB</div>
        </div>

        <div class="metric-row">
            <div class="big-number-group">
                <span class="counter-val" id="counterVal">78</span>
                <span class="percent-sign">%</span>
            </div>
        </div>

        <div class="glass-track">
            <div class="glass-fill" id="glassFill" style="width: 78%;"></div>
        </div>

        <div class="controls-row">
            <button type="button" class="btn-prog-ctrl" onclick="adjustProgress(-10)">
                <i data-lucide="minus"></i> -10%
            </button>
            <button type="button" class="btn-prog-ctrl" onclick="adjustProgress(10)">
                <i data-lucide="plus"></i> +10%
            </button>
            <button type="button" class="btn-prog-ctrl" onclick="toggleAutoSimulate()" id="btnAutoSim">
                <i data-lucide="play"></i> Auto
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();

        let currentPercent = 78;
        const totalGb = 100;

        function updateProgress(val) {
            currentPercent = Math.max(5, Math.min(100, val));
            document.getElementById('counterVal').textContent = currentPercent;
            document.getElementById('glassFill').style.width = `${currentPercent}%`;
            document.getElementById('storageDetail').textContent = `${((currentPercent / 100) * totalGb).toFixed(1)} / ${totalGb} GB`;
        }

        function adjustProgress(delta) {
            updateProgress(currentPercent + delta);
        }

        let simInterval = null;
        function toggleAutoSimulate() {
            const btn = document.getElementById('btnAutoSim');
            if (simInterval) {
                clearInterval(simInterval);
                simInterval = null;
                btn.innerHTML = `<i data-lucide="play"></i> Auto`;
            } else {
                btn.innerHTML = `<i data-lucide="pause"></i> Pause`;
                simInterval = setInterval(() => {
                    let next = currentPercent + 3;
                    if (next > 100) next = 10;
                    updateProgress(next);
                }, 800);
            }
            lucide.createIcons();
        }
    </script>
</body>
</html>

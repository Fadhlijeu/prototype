<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frosted Glass Drag & Drop File Zone — Glass Dark Standalone</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css.css">
    <style>

:root {
    --bg-page: #08080C;
    --glass-card: rgba(255, 255, 255, 0.06);
    --glass-border-top: rgba(255, 255, 255, 0.24);
    --glass-border-side: rgba(255, 255, 255, 0.10);
    --glass-border-bottom: rgba(255, 255, 255, 0.04);
    --text-primary: #FFFFFF;
    --text-secondary: rgba(255, 255, 255, 0.65);
    --text-muted: rgba(255, 255, 255, 0.38);
    --accent-cyan: #38BDF8;
    --ease-spring: cubic-bezier(0.34, 1.25, 0.64, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background-color: var(--bg-page);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.glass-upload-card {
    width: 100%;
    max-width: 410px;
    background: var(--glass-card);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border-radius: 24px;
    border: 1px solid transparent;
    border-top-color: var(--glass-border-top);
    border-left-color: var(--glass-border-side);
    border-right-color: var(--glass-border-side);
    border-bottom-color: var(--glass-border-bottom);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.upload-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.upload-title-box {
    display: flex;
    align-items: center;
    gap: 8px;
}

.upload-title-box svg { width: 18px; height: 18px; color: var(--accent-cyan); }
.upload-title-box h3 { font-size: 14.5px; font-weight: 700; color: #FFFFFF; }

.upload-limit-badge {
    font-size: 10px;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    padding: 3px 8px;
    border-radius: 999px;
    background: rgba(56, 189, 248, 0.12);
    border: 1px solid rgba(56, 189, 248, 0.3);
    color: #38BDF8;
}

.glass-dropzone {
    position: relative;
    border: 1.5px dashed rgba(255, 255, 255, 0.18);
    border-radius: 18px;
    background: rgba(0, 0, 0, 0.3);
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.25s;
}

.glass-dropzone:hover, .glass-dropzone.dragover {
    border-color: var(--accent-cyan);
    background: rgba(56, 189, 248, 0.05);
}

.dropzone-icon {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    background: rgba(56, 189, 248, 0.15);
    border: 1px solid rgba(56, 189, 248, 0.3);
    color: var(--accent-cyan);
    display: flex;
    align-items: center;
    justify-content: center;
}

.dropzone-icon svg { width: 22px; height: 22px; }

.primary-text {
    font-size: 13px;
    font-weight: 600;
    color: #FFFFFF;
}

.secondary-text {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 3px;
}

.btn-browse-file {
    margin-top: 4px;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 11.5px;
    font-weight: 600;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #FFFFFF;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-browse-file:hover {
    background: rgba(255, 255, 255, 0.15);
}

.file-queue-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.queue-item {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.file-type-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: rgba(168, 85, 247, 0.15);
    border: 1px solid rgba(168, 85, 247, 0.3);
    color: #C084FC;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.file-type-icon svg { width: 16px; height: 16px; }

.file-info-col {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.file-name-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.file-name {
    font-size: 12px;
    font-weight: 600;
    color: #FFFFFF;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.file-progress-pct {
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    color: var(--accent-cyan);
}

.progress-bar-track {
    width: 100%;
    height: 5px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 999px;
    overflow: hidden;
}

.progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #38BDF8, #818CF8);
    border-radius: 999px;
    transition: width 0.3s;
}

.file-meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 10px;
    color: var(--text-muted);
}

.btn-cancel-file {
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
    border-radius: 6px;
    transition: color 0.2s;
}

.btn-cancel-file:hover { color: #EF4444; }
.btn-cancel-file svg { width: 16px; height: 16px; }

.btn-add-demo-file {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 8px 14px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
}

.btn-add-demo-file:hover {
    background: rgba(255, 255, 255, 0.08);
    color: #FFFFFF;
}

.btn-add-demo-file svg { width: 14px; height: 14px; }

    </style>
</head>
<body>

    <div class="glass-upload-card">
        <div class="upload-header">
            <div class="upload-title-box">
                <i data-lucide="cloud-upload"></i>
                <h3>Enclave File Transfer</h3>
            </div>
            <span class="upload-limit-badge">AES-256 GCM</span>
        </div>

        <!-- Dropzone Area -->
        <div class="glass-dropzone" id="dropzone">
            <div class="dropzone-ambient-glow"></div>
            <div class="dropzone-icon">
                <i data-lucide="upload-cloud"></i>
            </div>
            <div class="dropzone-text">
                <p class="primary-text">Drag & drop neural weights or datasets</p>
                <p class="secondary-text">Supported: .safetensors, .parquet, .onnx up to 500 MB</p>
            </div>
            <button type="button" class="btn-browse-file" id="btnBrowse">Browse Files</button>
            <input type="file" id="realFileInput" style="display: none;">
        </div>

        <!-- Active File Queue Item -->
        <div class="file-queue-list" id="fileQueue">
            <div class="queue-item" id="demoFileItem">
                <div class="file-type-icon"><i data-lucide="file-code"></i></div>
                <div class="file-info-col">
                    <div class="file-name-row">
                        <span class="file-name">llama_3_8b_q4_k_m.gguf</span>
                        <span class="file-progress-pct" id="filePct">74%</span>
                    </div>
                    <div class="progress-bar-track">
                        <div class="progress-bar-fill" id="fileFill" style="width: 74%;"></div>
                    </div>
                    <div class="file-meta-row">
                        <span>4.2 GB of 5.8 GB • 42 MB/s</span>
                        <span class="eta-text">ETA: 38s</span>
                    </div>
                </div>
                <button type="button" class="btn-cancel-file" id="btnCancelFile" title="Cancel">
                    <i data-lucide="x"></i>
                </button>
            </div>
        </div>

        <button type="button" class="btn-add-demo-file" id="btnAddDemo">
            <i data-lucide="plus"></i> Add Verified Dataset Chip
        </button>
    </div>

    <script>

const dropzone = document.getElementById('dropzone');
const btnBrowse = document.getElementById('btnBrowse');
const fileInput = document.getElementById('realFileInput');
const btnAddDemo = document.getElementById('btnAddDemo');
const fileQueue = document.getElementById('fileQueue');

btnBrowse.addEventListener('click', (e) => {
    e.stopPropagation();
    fileInput.click();
});

dropzone.addEventListener('click', () => {
    fileInput.click();
});

dropzone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropzone.classList.add('dragover');
});

dropzone.addEventListener('dragleave', () => {
    dropzone.classList.remove('dragover');
});

dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    if (e.dataTransfer.files.length) {
        addFileItem(e.dataTransfer.files[0].name, '1.2 GB');
    }
});

document.getElementById('btnCancelFile').addEventListener('click', () => {
    const item = document.getElementById('demoFileItem');
    if (item) item.remove();
});

btnAddDemo.addEventListener('click', () => {
    addFileItem('instruct_dataset_v4.parquet', '420 MB');
});

function addFileItem(name, size) {
    const div = document.createElement('div');
    div.className = 'queue-item';
    div.innerHTML = `
        <div class="file-type-icon" style="background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.3); color: #10B981;">
            <i data-lucide="check-circle-2"></i>
        </div>
        <div class="file-info-col">
            <div class="file-name-row">
                <span class="file-name">${name}</span>
                <span class="file-progress-pct" style="color: #10B981;">100%</span>
            </div>
            <div class="progress-bar-track">
                <div class="progress-bar-fill" style="width: 100%; background: #10B981;"></div>
            </div>
            <div class="file-meta-row">
                <span>${size} • Verified SHA-256</span>
                <span style="color: #10B981;">Complete</span>
            </div>
        </div>
        <button type="button" class="btn-cancel-file" onclick="this.parentElement.remove()" title="Remove">
            <i data-lucide="x"></i>
        </button>
    `;
    fileQueue.appendChild(div);
    if (window.lucide) lucide.createIcons();
}

        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>

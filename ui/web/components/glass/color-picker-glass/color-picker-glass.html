<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Glass Palette & Hue Picker — Glass Dark Standalone</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css.css">
    <style>

:root {
    --bg-page: #08080C;
    --glass-card: rgba(255, 255, 255, 0.06);
    --glass-border-top: rgba(255, 255, 255, 0.24);
    --glass-border-side: rgba(255, 255, 255, 0.10);
    --glass-border-bottom: rgba(255, 255, 255, 0.04);
    --text-primary: #FFFFFF;
    --text-secondary: rgba(255, 255, 255, 0.65);
    --text-muted: rgba(255, 255, 255, 0.38);
    --accent-cyan: #38BDF8;
    --ease-spring: cubic-bezier(0.34, 1.25, 0.64, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background-color: var(--bg-page);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.glass-palette-card {
    width: 100%;
    max-width: 390px;
    background: var(--glass-card);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border-radius: 24px;
    border: 1px solid transparent;
    border-top-color: var(--glass-border-top);
    border-left-color: var(--glass-border-side);
    border-right-color: var(--glass-border-side);
    border-bottom-color: var(--glass-border-bottom);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.palette-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.palette-title-group {
    display: flex;
    align-items: center;
    gap: 8px;
}

.palette-title-group svg {
    width: 18px;
    height: 18px;
    color: var(--accent-cyan);
}

.palette-title-group h3 {
    font-size: 14.5px;
    font-weight: 700;
    color: #FFFFFF;
}

.contrast-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid rgba(16, 185, 129, 0.4);
    background: rgba(16, 185, 129, 0.15);
    color: #10B981;
}

.color-field-container {
    position: relative;
    width: 100%;
    height: 130px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.1);
    cursor: crosshair;
}

#colorCanvas {
    width: 100%;
    height: 100%;
    display: block;
}

.picker-thumb {
    position: absolute;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid #FFFFFF;
    box-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
    transform: translate(-50%, -50%);
    pointer-events: none;
    top: 30px;
    left: 240px;
}

.hue-slider-wrap {
    width: 100%;
}

.hue-slider {
    -webkit-appearance: none;
    width: 100%;
    height: 14px;
    border-radius: 999px;
    background: linear-gradient(to right, #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%);
    outline: none;
    border: 1px solid rgba(255, 255, 255, 0.2);
    cursor: pointer;
}

.hue-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #FFFFFF;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    border: 2px solid var(--accent-cyan);
    cursor: pointer;
    transition: transform 0.15s;
}

.hue-slider::-webkit-slider-thumb:hover {
    transform: scale(1.2);
}

.color-output-row {
    display: flex;
    align-items: center;
    gap: 12px;
}

.color-preview-swatch {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: #38BDF8;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    flex-shrink: 0;
}

.color-inputs-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
}

.code-box {
    display: flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    padding: 6px 10px;
    flex: 1;
}

.code-prefix {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-muted);
    margin-right: 8px;
    font-family: 'JetBrains Mono', monospace;
}

.code-box input {
    background: transparent;
    border: none;
    outline: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    color: #FFFFFF;
    width: 100%;
}

.btn-copy-hex {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-copy-hex:hover {
    background: rgba(255, 255, 255, 0.12);
    color: #FFFFFF;
}

.btn-copy-hex svg { width: 16px; height: 16px; }

.preset-swatches-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 4px;
}

.preset-dot {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s;
}

.preset-dot:hover {
    transform: scale(1.15);
}

.preset-dot.active {
    border-color: #FFFFFF;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
}

    </style>
</head>
<body>

    <div class="glass-palette-card">
        <div class="palette-header">
            <div class="palette-title-group">
                <i data-lucide="palette"></i>
                <h3>Studio Color Synthesizer</h3>
            </div>
            <span class="contrast-badge ok" id="contrastBadge">AAA Contrast</span>
        </div>

        <!-- 2D Saturation/Lightness Gradient Canvas -->
        <div class="color-field-container">
            <canvas id="colorCanvas" width="330" height="130"></canvas>
            <div class="picker-thumb" id="pickerThumb"></div>
        </div>

        <!-- Hue Spectrum Slider -->
        <div class="hue-slider-wrap">
            <input type="range" min="0" max="360" value="199" class="hue-slider" id="hueSlider">
        </div>

        <!-- Output Code & Swatches -->
        <div class="color-output-row">
            <div class="color-preview-swatch" id="swatchPreview"></div>
            <div class="color-inputs-wrap">
                <div class="code-box">
                    <span class="code-prefix">HEX</span>
                    <input type="text" id="hexInput" value="#38BDF8" readonly>
                </div>
                <button type="button" class="btn-copy-hex" id="btnCopyHex" title="Copy HEX">
                    <i data-lucide="copy" id="copyIcon"></i>
                </button>
            </div>
        </div>

        <!-- Presets Palette -->
        <div class="preset-swatches-row">
            <button type="button" class="preset-dot active" style="background: #38BDF8;" data-hex="#38BDF8" title="Neon Cyan"></button>
            <button type="button" class="preset-dot" style="background: #A855F7;" data-hex="#A855F7" title="Deep Violet"></button>
            <button type="button" class="preset-dot" style="background: #10B981;" data-hex="#10B981" title="Emerald Mint"></button>
            <button type="button" class="preset-dot" style="background: #F59E0B;" data-hex="#F59E0B" title="Electric Amber"></button>
            <button type="button" class="preset-dot" style="background: #EC4899;" data-hex="#EC4899" title="Rose Quartz"></button>
        </div>
    </div>

    <script>

const canvas = document.getElementById('colorCanvas');
const ctx = canvas.getContext('2d');
const thumb = document.getElementById('pickerThumb');
const hueSlider = document.getElementById('hueSlider');
const swatch = document.getElementById('swatchPreview');
const hexInput = document.getElementById('hexInput');
const btnCopy = document.getElementById('btnCopyHex');

let currentHue = 199;

function drawCanvas() {
    const w = canvas.width;
    const h = canvas.height;

    ctx.fillStyle = `hsl(${currentHue}, 100%, 50%)`;
    ctx.fillRect(0, 0, w, h);

    // White gradient horizontal
    const whiteGrad = ctx.createLinearGradient(0, 0, w, 0);
    whiteGrad.addColorStop(0, 'rgba(255,255,255,1)');
    whiteGrad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = whiteGrad;
    ctx.fillRect(0, 0, w, h);

    // Black gradient vertical
    const blackGrad = ctx.createLinearGradient(0, 0, 0, h);
    blackGrad.addColorStop(0, 'rgba(0,0,0,0)');
    blackGrad.addColorStop(1, 'rgba(0,0,0,1)');
    ctx.fillStyle = blackGrad;
    ctx.fillRect(0, 0, w, h);
}

function updateColorAt(x, y) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    const px = Math.max(0, Math.min(canvas.width - 1, x * scaleX));
    const py = Math.max(0, Math.min(canvas.height - 1, y * scaleY));

    const pixel = ctx.getImageData(px, py, 1, 1).data;
    const hex = '#' + [pixel[0], pixel[1], pixel[2]].map(x => x.toString(16).padStart(2, '0')).join('').toUpperCase();

    swatch.style.backgroundColor = hex;
    hexInput.value = hex;

    thumb.style.left = `${(px / canvas.width) * 100}%`;
    thumb.style.top = `${(py / canvas.height) * 100}%`;
}

drawCanvas();

hueSlider.addEventListener('input', (e) => {
    currentHue = e.target.value;
    drawCanvas();
    const rect = canvas.getBoundingClientRect();
    const curX = (parseFloat(thumb.style.left) / 100) * rect.width || rect.width * 0.7;
    const curY = (parseFloat(thumb.style.top) / 100) * rect.height || rect.height * 0.3;
    updateColorAt(curX, curY);
});

canvas.parentElement.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    function move(evt) {
        const x = evt.clientX - rect.left;
        const y = evt.clientY - rect.top;
        updateColorAt(x, y);
    }
    move(e);
    function up() {
        window.removeEventListener('mousemove', move);
        window.removeEventListener('mouseup', up);
    }
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
});

btnCopy.addEventListener('click', () => {
    navigator.clipboard.writeText(hexInput.value);
    const icon = document.getElementById('copyIcon');
    icon.setAttribute('data-lucide', 'check');
    if (window.lucide) lucide.createIcons();
    setTimeout(() => {
        icon.setAttribute('data-lucide', 'copy');
        if (window.lucide) lucide.createIcons();
    }, 1500);
});

// Presets
document.querySelectorAll('.preset-dot').forEach(dot => {
    dot.addEventListener('click', () => {
        document.querySelectorAll('.preset-dot').forEach(d => d.classList.remove('active'));
        dot.classList.add('active');
        const hex = dot.dataset.hex;
        swatch.style.backgroundColor = hex;
        hexInput.value = hex;
    });
});

        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swirl Refraction Glass Bottom Sheet — Glass Dark Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-page: #0A0A0A;
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.65);
            --accent-blue-1: #4A7BF7;
            --accent-blue-2: #2E5FD9;
            --accent-blue-3: #1E3A8A;
            --ease-spring: cubic-bezier(0.32, 0.72, 0, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-page);
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
        }

        /* Demo Trigger */
        .open-trigger {
            padding: 16px 28px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--accent-blue-1), var(--accent-blue-2));
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 24px rgba(74, 123, 247, 0.35);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .open-trigger:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(74, 123, 247, 0.45);
        }

        /* Scrim / Backdrop */
        .scrim {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.32s ease;
        }

        .modal-container {
            position: fixed;
            inset: 0;
            z-index: 110;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            pointer-events: none;
        }

        /* Bottom Sheet Element */
        .sheet {
            position: relative;
            isolation: isolate;
            width: 100%;
            max-width: 480px;
            background: transparent;
            border-top: 1.5px solid rgba(255, 255, 255, 0.20);
            border-left: 1px solid rgba(255, 255, 255, 0.10);
            border-right: 1px solid rgba(255, 255, 255, 0.10);
            border-bottom: 0;
            border-radius: 28px 28px 0 0;
            padding: 36px 24px 24px;
            transform: translateY(100%);
            opacity: 0;
            transition: transform 0.5s var(--ease-spring), opacity 0.4s ease;
            box-shadow: 0 -12px 48px rgba(0, 0, 0, 0.65), inset 0 1px 1px rgba(255, 255, 255, 0.15);
            overflow: visible;
        }

        #fxCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.6;
            border-radius: 28px 28px 0 0;
            overflow: hidden;
        }

        .sheet-glass {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(180deg, rgba(22, 22, 28, 0.75), rgba(16, 18, 26, 0.88));
            backdrop-filter: blur(24px) saturate(140%);
            -webkit-backdrop-filter: blur(24px) saturate(140%);
            pointer-events: none;
            z-index: 2;
        }

        /* Layer 1: Noise Texture Overlay */
        .sheet-glass::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.04;
            mix-blend-mode: overlay;
            pointer-events: none;
        }

        .sheet-content {
            position: relative;
            z-index: 5;
            filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.3));
        }

        /* Floating 3D Icon Badge */
        .modal-icon-badge {
            position: absolute;
            z-index: 12;
            top: -42px;
            left: 50%;
            transform: translate(-50%, 20px) scale(0.8);
            width: 76px;
            height: 76px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: rgba(28, 28, 36, 0.95);
            backdrop-filter: blur(18px);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 36px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s, opacity 0.25s 0.2s;
        }

        .modal-icon-badge::before {
            content: "";
            position: absolute;
            inset: -22px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245, 166, 35, 0.4) 0%, transparent 70%);
            filter: blur(20px);
            z-index: -1;
        }

        .folder-badge-graphic {
            position: relative;
            width: 40px; height: 30px;
            border-radius: 6px 7px 6px 6px;
            background: linear-gradient(180deg, #FFD15D, #F5A623);
            box-shadow: 0 4px 12px rgba(245, 166, 35, 0.35);
            transform: translateY(2px);
        }

        .folder-badge-graphic::before {
            content: "";
            position: absolute; left: 5px; top: -7px;
            width: 20px; height: 10px;
            border-radius: 5px 5px 0 0;
            background: #FFBD3D;
        }

        .tab-color {
            position: absolute;
            width: 10px; height: 7px;
            border-radius: 4px 4px 2px 2px;
            top: -9px;
        }
        .tab-color.r { left: 7px; background: #EF4444; }
        .tab-color.g { left: 18px; background: #22C55E; }
        .tab-color.b { left: 29px; background: #3B82F6; }

        .modal-title {
            margin: 38px 0 0;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: #FFFFFF;
        }

        .modal-desc {
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.5;
            margin: 8px auto 0;
            max-width: 320px;
        }

        .modal-input-wrap {
            position: relative;
            margin: 22px 0 16px;
        }

        .modal-input-wrap input {
            width: 100%;
            height: 56px;
            padding: 0 48px 0 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            outline: none;
            background: rgba(255, 255, 255, 0.05);
            color: #FFFFFF;
            font-size: 16px;
            font-family: inherit;
            caret-color: #4A9EFF;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .modal-input-wrap input:focus {
            border-color: rgba(255, 255, 255, 0.20);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .modal-btn {
            flex: 1;
            height: 52px;
            border-radius: 16px;
            cursor: pointer;
            color: #FFFFFF;
            font-size: 16px;
            border: none;
            transition: transform 0.2s var(--ease-spring), background 0.2s, box-shadow 0.2s;
        }

        .modal-btn.cancel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.10);
            font-weight: 500;
        }

        .modal-btn.cancel:hover {
            background: rgba(255, 255, 255, 0.10);
            transform: translateY(-1px);
        }

        .modal-btn.create {
            background: linear-gradient(135deg, var(--accent-blue-1) 0%, var(--accent-blue-2) 50%, var(--accent-blue-3) 100%);
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            border-bottom: 1px solid rgba(0, 0, 0, 0.20);
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.30), inset 0 1px 1px rgba(255, 255, 255, 0.15);
            font-weight: 600;
        }

        .modal-btn.create:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.45);
        }

        .modal-btn.create:active:not(:disabled) {
            transform: scale(0.96);
        }

        .modal-btn.create:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        /* iOS Home Indicator */
        .ios-indicator {
            width: 134px;
            height: 5px;
            background: #FFFFFF;
            border-radius: 3px;
            opacity: 0.35;
            margin: 20px auto 0;
        }

        /* Active State */
        body.modal-open .scrim {
            opacity: 1;
            pointer-events: auto;
        }

        body.modal-open .modal-container {
            pointer-events: auto;
        }

        body.modal-open .sheet {
            transform: translateY(0);
            opacity: 1;
        }

        body.modal-open .modal-icon-badge {
            transform: translate(-50%, 0) scale(1);
            opacity: 1;
        }
    </style>
</head>
<body>

    <button class="open-trigger" onclick="openSheet()">Open Glass Bottom Sheet</button>

    <div class="scrim" id="scrim" onclick="closeSheet()"></div>

    <div class="modal-container" id="modalContainer" role="dialog" aria-modal="true">
        <section class="sheet" id="sheet">
            <canvas id="fxCanvas"></canvas>
            <div class="sheet-glass"></div>

            <div class="modal-icon-badge">
                <div class="folder-badge-graphic">
                    <i class="tab-color r"></i>
                    <i class="tab-color g"></i>
                    <i class="tab-color b"></i>
                </div>
            </div>

            <div class="sheet-content">
                <h2 class="modal-title">Enter Folder Name</h2>
                <p class="modal-desc">Create a new space for your files. The glass behind this sheet is organically refracted.</p>
                
                <div class="modal-input-wrap">
                    <input type="text" id="folderInput" placeholder="e.g. Design Systems" oninput="updateBtn()">
                </div>

                <div class="modal-actions">
                    <button class="modal-btn cancel" onclick="closeSheet()">Cancel</button>
                    <button class="modal-btn create" id="createBtn" disabled onclick="alert('Created: ' + document.getElementById('folderInput').value); closeSheet()">Create</button>
                </div>

                <div class="ios-indicator"></div>
            </div>
        </section>
    </div>

    <script>
        const sheet = document.getElementById('sheet');
        const canvas = document.getElementById('fxCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const work = document.createElement('canvas');
        const wctx = work.getContext('2d', { willReadFrequently: true });

        let W = 0, H = 0, raf = 0, active = false, t = 0, last = 0;

        function resize() {
            const d = Math.min(window.devicePixelRatio || 1, 1.5);
            const rect = sheet.getBoundingClientRect();
            W = Math.max(1, Math.floor(rect.width * d));
            H = Math.max(1, Math.floor(rect.height * d));
            canvas.width = W; canvas.height = H;
            work.width = W; work.height = H;
        }

        function drawScene(c) {
            c.clearRect(0, 0, W, H);
            const g = c.createLinearGradient(0, 0, W, H);
            g.addColorStop(0, '#090A0E');
            g.addColorStop(0.5, '#0D1017');
            g.addColorStop(1, '#08090C');
            c.fillStyle = g;
            c.fillRect(0, 0, W, H);

            const rg = c.createRadialGradient(W * 0.1, H * 0.1, 0, W * 0.1, H * 0.1, W * 0.6);
            rg.addColorStop(0, 'rgba(77, 99, 192, 0.3)');
            rg.addColorStop(1, 'transparent');
            c.fillStyle = rg;
            c.fillRect(0, 0, W, H);
        }

        function distort(time) {
            const data = wctx.getImageData(0, 0, W, H);
            const src = data.data;
            const out = ctx.createImageData(W, H);
            const dst = out.data;

            for (let y = 0; y < H; y += 2) {
                for (let x = 0; x < W; x += 2) {
                    const nx = x / W, ny = y / H;
                    const a = Math.sin(ny * 18 + time * 0.9) * 6 + Math.sin(ny * 40 - time * 0.35) * 2;
                    const b = Math.cos(nx * 15 - time * 0.75) * 6 + Math.sin(nx * 32 + time * 0.4) * 1.8;
                    const swirl = Math.sin(nx * 20 + ny * 12 + time * 0.6) * 5;
                    const dx = Math.round(a + swirl * 0.5);
                    const dy = Math.round(b + swirl * 0.3);
                    const sx = Math.max(0, Math.min(W - 1, x + dx));
                    const sy = Math.max(0, Math.min(H - 1, y + dy));
                    const si = (sy * W + sx) * 4;

                    for (let oy = 0; oy < 2; oy++) {
                        for (let ox = 0; ox < 2; ox++) {
                            if (x + ox < W && y + oy < H) {
                                const di = ((y + oy) * W + (x + ox)) * 4;
                                dst[di] = Math.min(255, src[si] * 1.07 + 8);
                                dst[di + 1] = Math.min(255, src[si + 1] * 1.08 + 8);
                                dst[di + 2] = Math.min(255, src[si + 2] * 1.12 + 10);
                                dst[di + 3] = 140;
                            }
                        }
                    }
                }
            }
            ctx.putImageData(out, 0, 0);
        }

        function loop(now) {
            if (!active) return;
            if (!last) last = now;
            if (now - last > 24) {
                t += 0.02;
                last = now;
                wctx.clearRect(0, 0, W, H);
                drawScene(wctx);
                distort(t);
            }
            raf = requestAnimationFrame(loop);
        }

        function openSheet() {
            active = true;
            document.body.classList.add('modal-open');
            resize();
            drawScene(wctx);
            cancelAnimationFrame(raf);
            raf = requestAnimationFrame(loop);
            setTimeout(() => document.getElementById('folderInput').focus(), 350);
        }

        function closeSheet() {
            document.body.classList.remove('modal-open');
            active = false;
            cancelAnimationFrame(raf);
        }

        function updateBtn() {
            const has = document.getElementById('folderInput').value.trim().length > 0;
            document.getElementById('createBtn').disabled = !has;
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && active) closeSheet();
        });
    </script>
</body>
</html>

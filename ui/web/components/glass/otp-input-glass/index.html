<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6-Digit Glass Security OTP Keypad — Glass Dark Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="glass-otp-card">
        <div class="otp-header">
            <div class="otp-icon-shield">
                <i data-lucide="shield-check"></i>
            </div>
            <h3>Biometric 2FA Verification</h3>
            <p>Enter the 6-digit cryptographic token generated by your Authenticator.</p>
        </div>

        <!-- 6 OTP Boxes -->
        <div class="otp-inputs-row" id="otpContainer">
            <input type="text" class="otp-box" maxlength="1" inputmode="numeric" autocomplete="one-time-code">
            <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
        </div>

        <div class="otp-status-feedback" id="otpFeedback">
            Ready for input
        </div>

        <!-- Verify Button -->
        <button type="button" class="btn-verify-token" id="btnVerify">
            Verify Enclave Token
        </button>

        <div class="otp-footer-row">
            <span class="timer-label">Resend in <strong id="resendTimer">00:45</strong></span>
            <button type="button" class="btn-resend disabled" id="btnResend">Resend Code</button>
        </div>
    </div>

    <script src="index.js"></script>
    <script>
        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6-Digit Glass Security OTP Keypad — Glass Dark Standalone</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css.css">
    <style>

:root {
    --bg-page: #08080C;
    --glass-card: rgba(255, 255, 255, 0.06);
    --glass-border-top: rgba(255, 255, 255, 0.24);
    --glass-border-side: rgba(255, 255, 255, 0.10);
    --glass-border-bottom: rgba(255, 255, 255, 0.04);
    --text-primary: #FFFFFF;
    --text-secondary: rgba(255, 255, 255, 0.65);
    --text-muted: rgba(255, 255, 255, 0.38);
    --accent-cyan: #38BDF8;
    --ease-spring: cubic-bezier(0.34, 1.25, 0.64, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background-color: var(--bg-page);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.glass-otp-card {
    width: 100%;
    max-width: 390px;
    background: var(--glass-card);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border-radius: 24px;
    border: 1px solid transparent;
    border-top-color: var(--glass-border-top);
    border-left-color: var(--glass-border-side);
    border-right-color: var(--glass-border-side);
    border-bottom-color: var(--glass-border-bottom);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
    padding: 26px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 18px;
}

.otp-icon-shield {
    width: 48px;
    height: 48px;
    border-radius: 16px;
    background: rgba(56, 189, 248, 0.15);
    border: 1px solid rgba(56, 189, 248, 0.35);
    color: var(--accent-cyan);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 10px;
}

.otp-icon-shield svg { width: 24px; height: 24px; }

.otp-header h3 {
    font-size: 17px;
    font-weight: 700;
    color: #FFFFFF;
}

.otp-header p {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 4px;
    line-height: 1.4;
}

.otp-inputs-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    width: 100%;
}

.otp-box {
    width: 46px;
    height: 52px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #FFFFFF;
    font-size: 22px;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    text-align: center;
    outline: none;
    transition: all 0.2s var(--ease-spring);
}

.otp-box:focus {
    background: rgba(56, 189, 248, 0.12);
    border-color: var(--accent-cyan);
    box-shadow: 0 0 16px rgba(56, 189, 248, 0.35);
    transform: scale(1.05);
}

.otp-status-feedback {
    font-size: 11.5px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
}

.btn-verify-token {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(168, 85, 247, 0.25));
    border: 1px solid rgba(56, 189, 248, 0.4);
    color: #FFFFFF;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-verify-token:hover {
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.4), rgba(168, 85, 247, 0.4));
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
}

.otp-footer-row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11.5px;
    color: var(--text-muted);
    padding-top: 4px;
}

.btn-resend {
    background: transparent;
    border: none;
    color: var(--accent-cyan);
    font-weight: 600;
    cursor: pointer;
}

.btn-resend.disabled {
    opacity: 0.4;
    pointer-events: none;
}

    </style>
</head>
<body>

    <div class="glass-otp-card">
        <div class="otp-header">
            <div class="otp-icon-shield">
                <i data-lucide="shield-check"></i>
            </div>
            <h3>Biometric 2FA Verification</h3>
            <p>Enter the 6-digit cryptographic token generated by your Authenticator.</p>
        </div>

        <!-- 6 OTP Boxes -->
        <div class="otp-inputs-row" id="otpContainer">
            <input type="text" class="otp-box" maxlength="1" inputmode="numeric" autocomplete="one-time-code">
            <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
        </div>

        <div class="otp-status-feedback" id="otpFeedback">
            Ready for input
        </div>

        <!-- Verify Button -->
        <button type="button" class="btn-verify-token" id="btnVerify">
            Verify Enclave Token
        </button>

        <div class="otp-footer-row">
            <span class="timer-label">Resend in <strong id="resendTimer">00:45</strong></span>
            <button type="button" class="btn-resend disabled" id="btnResend">Resend Code</button>
        </div>
    </div>

    <script>

const boxes = document.querySelectorAll('.otp-box');
const feedback = document.getElementById('otpFeedback');
const btnVerify = document.getElementById('btnVerify');

boxes.forEach((box, idx) => {
    box.addEventListener('input', (e) => {
        if (e.target.value.length === 1 && idx < boxes.length - 1) {
            boxes[idx + 1].focus();
        }
    });

    box.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !box.value && idx > 0) {
            boxes[idx - 1].focus();
        }
    });

    box.addEventListener('paste', (e) => {
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData('text').trim();
        if (/^\d{6}$/.test(text)) {
            text.split('').forEach((ch, i) => {
                if (boxes[i]) boxes[i].value = ch;
            });
            boxes[boxes.length - 1].focus();
        }
    });
});

btnVerify.addEventListener('click', () => {
    const code = Array.from(boxes).map(b => b.value).join('');
    if (code.length === 6) {
        feedback.style.color = '#10B981';
        feedback.textContent = 'Token Validated: Enclave Access Granted!';
    } else {
        feedback.style.color = '#EF4444';
        feedback.textContent = 'Please enter complete 6-digit code.';
    }
});

        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Glass 3D Radio Matrix Selector — Glass Dark Standalone</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css.css">
    <style>

:root {
    --bg-page: #08080C;
    --glass-card: rgba(255, 255, 255, 0.06);
    --glass-border-top: rgba(255, 255, 255, 0.24);
    --glass-border-side: rgba(255, 255, 255, 0.10);
    --glass-border-bottom: rgba(255, 255, 255, 0.04);
    --text-primary: #FFFFFF;
    --text-secondary: rgba(255, 255, 255, 0.65);
    --text-muted: rgba(255, 255, 255, 0.38);
    --accent-cyan: #38BDF8;
    --ease-spring: cubic-bezier(0.34, 1.25, 0.64, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background-color: var(--bg-page);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.glass-radio-card {
    width: 100%;
    max-width: 440px;
    background: var(--glass-card);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border-radius: 24px;
    border: 1px solid transparent;
    border-top-color: var(--glass-border-top);
    border-left-color: var(--glass-border-side);
    border-right-color: var(--glass-border-side);
    border-bottom-color: var(--glass-border-bottom);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.radio-card-header {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.radio-tag {
    font-size: 10px;
    font-weight: 700;
    color: var(--accent-cyan);
    letter-spacing: 0.08em;
}

.radio-card-header h3 {
    font-size: 16px;
    font-weight: 700;
    color: #FFFFFF;
}

.radio-options-column {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.glass-radio-option {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 16px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    cursor: pointer;
    transition: all 0.25s var(--ease-spring);
    user-select: none;
}

.glass-radio-option input {
    display: none;
}

.glass-radio-option:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.18);
}

.glass-radio-option.active {
    background: rgba(56, 189, 248, 0.12);
    border-color: rgba(56, 189, 248, 0.45);
    box-shadow: 0 4px 20px rgba(56, 189, 248, 0.2);
}

.radio-orb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.3);
    background: rgba(0, 0, 0, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 2px;
    transition: all 0.2s;
}

.glass-radio-option.active .radio-orb {
    border-color: var(--accent-cyan);
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
}

.orb-core {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-cyan);
    transform: scale(0);
    transition: transform 0.25s var(--ease-spring);
}

.glass-radio-option.active .orb-core {
    transform: scale(1);
}

.radio-info-block {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.radio-title-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

.option-title {
    font-size: 13px;
    font-weight: 600;
    color: #FFFFFF;
}

.option-pill {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-muted);
}

.option-pill.best {
    background: rgba(16, 185, 129, 0.2);
    border: 1px solid rgba(16, 185, 129, 0.4);
    color: #10B981;
}

.option-pill.purple {
    background: rgba(168, 85, 247, 0.2);
    border: 1px solid rgba(168, 85, 247, 0.4);
    color: #C084FC;
}

.option-desc {
    font-size: 11.5px;
    color: var(--text-secondary);
    line-height: 1.4;
}

    </style>
</head>
<body>

    <div class="glass-radio-card">
        <div class="radio-card-header">
            <span class="radio-tag">INFERENCE ENGINE CONFIGURATION</span>
            <h3>Precision & Quantization Mode</h3>
        </div>

        <div class="radio-options-column" role="radiogroup">
            <!-- Option 1 -->
            <label class="glass-radio-option active" data-val="balanced">
                <input type="radio" name="precisionMode" value="balanced" checked>
                <div class="radio-orb">
                    <div class="orb-core"></div>
                </div>
                <div class="radio-info-block">
                    <div class="radio-title-line">
                        <span class="option-title">Balanced Quantization (W8A8)</span>
                        <span class="option-pill best">RECOMMENDED</span>
                    </div>
                    <p class="option-desc">Optimal trade-off: 45 tokens/s on standard GPU nodes with near-zero loss in reasoning benchmarks.</p>
                </div>
            </label>

            <!-- Option 2 -->
            <label class="glass-radio-option" data-val="speed">
                <input type="radio" name="precisionMode" value="speed">
                <div class="radio-orb">
                    <div class="orb-core"></div>
                </div>
                <div class="radio-info-block">
                    <div class="radio-title-line">
                        <span class="option-title">Ultra-High Velocity (Q4_K_M)</span>
                        <span class="option-pill">110 TOK/S</span>
                    </div>
                    <p class="option-desc">Aggressive 4-bit edge memory footprint. Ideal for streaming UI agents and real-time chat loops.</p>
                </div>
            </label>

            <!-- Option 3 -->
            <label class="glass-radio-option" data-val="full">
                <input type="radio" name="precisionMode" value="full">
                <div class="radio-orb">
                    <div class="orb-core"></div>
                </div>
                <div class="radio-info-block">
                    <div class="radio-title-line">
                        <span class="option-title">Full Precision (FP16 Uncompressed)</span>
                        <span class="option-pill purple">RESEARCH</span>
                    </div>
                    <p class="option-desc">Maximum analytical fidelity for formal code verification and cryptographic audit routines.</p>
                </div>
            </label>
        </div>
    </div>

    <script>

const options = document.querySelectorAll('.glass-radio-option');

options.forEach(opt => {
    opt.addEventListener('click', () => {
        options.forEach(o => o.classList.remove('active'));
        opt.classList.add('active');
        const radio = opt.querySelector('input[type="radio"]');
        if (radio) radio.checked = true;
    });
});

        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>

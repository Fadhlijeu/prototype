<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frosted Glass Folder Card — Glass Dark Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-page: #0A0A0A;
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.65);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-page);
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 24px;
            flex-wrap: wrap;
        }

        /* Folder Card Container */
        .folder-card {
            position: relative;
            width: 170px;
            height: 170px;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.3s ease;
            filter: drop-shadow(0 14px 22px rgba(0, 0, 0, 0.35));
        }

        .folder-card:hover {
            transform: translateY(-5px) scale(1.03);
            filter: drop-shadow(0 20px 28px rgba(0, 0, 0, 0.45));
        }

        .folder-card:active {
            transform: scale(0.98);
        }

        /* Single Unified Frosted Glass Panel */
        .glass-folder {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.03) 100%);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            mask: url(#folder-shape);
            -webkit-mask: url(#folder-shape);
        }

        /* Layer 1: Noise Texture Overlay */
        .glass-folder::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.04;
            mix-blend-mode: overlay;
            pointer-events: none;
        }

        /* Glossy Highlight Border */
        .glossy-border {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }

        /* Content */
        .card-content {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 20px 20px 20px;
            pointer-events: none;
        }

        .folder-icon-wrapper {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
        }

        .folder-icon-wrapper svg {
            width: 24px;
            height: 24px;
            stroke-width: 1.5px;
        }

        .folder-text-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .folder-title {
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.01em;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .folder-subtitle {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 400;
        }
    </style>
</head>
<body>

    <!-- SVG Mask & Gradient Defs -->
    <svg width="0" height="0" style="position: absolute; pointer-events: none;" aria-hidden="true">
        <defs>
            <mask id="folder-shape">
                <path d="M 20 0 H 65 C 76 0, 78 20, 88 20 H 140 A 20 20 0 0 1 160 40 V 140 A 20 20 0 0 1 140 160 H 20 A 20 20 0 0 1 0 140 V 20 A 20 20 0 0 1 20 0 Z" fill="#ffffff"/>
            </mask>
            <linearGradient id="gloss" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="rgba(255, 255, 255, 0.65)"/>
                <stop offset="35%" stop-color="rgba(255, 255, 255, 0.18)"/>
                <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
            </linearGradient>
        </defs>
    </svg>

    <!-- Folder 1: Figma Files -->
    <div class="folder-card" onclick="alert('Opened Figma Files')">
        <div class="glass-folder"></div>
        <svg class="glossy-border" viewBox="0 0 160 160">
            <path d="M 20 0 H 65 C 76 0, 78 20, 88 20 H 140 A 20 20 0 0 1 160 40 V 140 A 20 20 0 0 1 140 160 H 20 A 20 20 0 0 1 0 140 V 20 A 20 20 0 0 1 20 0 Z" fill="none" stroke="url(#gloss)" stroke-width="1.2"/>
        </svg>
        <div class="card-content">
            <div class="folder-icon-wrapper">
                <svg viewBox="0 0 38 57" fill="none" style="width: 20px; height: auto;">
                    <path d="M19 28.5C19 33.7467 14.7467 38 9.5 38C4.25329 38 0 33.7467 0 28.5C0 23.2533 4.25329 19 9.5 19H19V28.5Z" fill="#A259FF"/>
                    <path d="M0 9.5C0 4.25329 4.25329 0 9.5 0H19V19H9.5C4.25329 19 0 14.7467 0 9.5Z" fill="#F24E1E"/>
                    <path d="M38 9.5C38 14.7467 33.7467 19 28.5 19H19V0H28.5C33.7467 0 38 4.25329 38 9.5Z" fill="#FF7262"/>
                    <path d="M38 28.5C38 33.7467 33.7467 38 28.5 38C23.2533 38 19 33.7467 19 28.5C19 23.2533 23.2533 19 28.5 19C33.7467 19 38 23.2533 38 28.5Z" fill="#1ABCFE"/>
                    <path d="M9.5 57C14.7467 57 19 52.7467 19 47.5V38H9.5C4.25329 38 0 42.2533 0 47.5C0 52.7467 4.25329 57 9.5 57Z" fill="#0ACF83"/>
                </svg>
            </div>
            <div class="folder-text-group">
                <div class="folder-title">Figma Files</div>
                <div class="folder-subtitle">202 files, 2.6 GB</div>
            </div>
        </div>
    </div>

    <!-- Folder 2: Design System -->
    <div class="folder-card" onclick="alert('Opened Design System')">
        <div class="glass-folder"></div>
        <svg class="glossy-border" viewBox="0 0 160 160">
            <path d="M 20 0 H 65 C 76 0, 78 20, 88 20 H 140 A 20 20 0 0 1 160 40 V 140 A 20 20 0 0 1 140 160 H 20 A 20 20 0 0 1 0 140 V 20 A 20 20 0 0 1 20 0 Z" fill="none" stroke="url(#gloss)" stroke-width="1.2"/>
        </svg>
        <div class="card-content">
            <div class="folder-icon-wrapper">
                <i data-lucide="layers" style="color: #60A5FA;"></i>
            </div>
            <div class="folder-text-group">
                <div class="folder-title">Design System</div>
                <div class="folder-subtitle">84 files, 1.2 GB</div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>

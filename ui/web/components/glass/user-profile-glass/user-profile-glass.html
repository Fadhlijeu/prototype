<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frosted Glass Executive Profile Card — Glass Dark Standalone</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css.css">
    <style>

:root {
    --bg-page: #08080C;
    --glass-card: rgba(255, 255, 255, 0.06);
    --glass-border-top: rgba(255, 255, 255, 0.24);
    --glass-border-side: rgba(255, 255, 255, 0.10);
    --glass-border-bottom: rgba(255, 255, 255, 0.04);
    --text-primary: #FFFFFF;
    --text-secondary: rgba(255, 255, 255, 0.65);
    --text-muted: rgba(255, 255, 255, 0.38);
    --accent-cyan: #38BDF8;
    --ease-spring: cubic-bezier(0.34, 1.25, 0.64, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background-color: var(--bg-page);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.glass-profile-card {
    width: 100%;
    max-width: 390px;
    background: var(--glass-card);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border-radius: 26px;
    border: 1px solid transparent;
    border-top-color: var(--glass-border-top);
    border-left-color: var(--glass-border-side);
    border-right-color: var(--glass-border-side);
    border-bottom-color: var(--glass-border-bottom);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

.profile-cover {
    height: 96px;
    width: 100%;
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.35) 0%, rgba(168, 85, 247, 0.35) 100%);
    position: relative;
    padding: 12px 18px;
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
}

.badge-role {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 3px 8px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #FFFFFF;
}

.profile-body {
    padding: 0 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.avatar-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-top: -34px;
}

.profile-avatar-aura {
    position: relative;
    width: 68px;
    height: 68px;
    border-radius: 50%;
    padding: 2.5px;
    background: linear-gradient(135deg, #38BDF8, #C084FC);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
}

.avatar-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
}

.avatar-live-beacon {
    position: absolute;
    bottom: 2px;
    right: 2px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #10B981;
    border: 2px solid #08080C;
    box-shadow: 0 0 8px #10B981;
}

.btn-profile-follow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 16px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: #FFFFFF;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-profile-follow:hover {
    background: rgba(255, 255, 255, 0.15);
}

.btn-profile-follow.following {
    background: rgba(16, 185, 129, 0.18);
    border-color: rgba(16, 185, 129, 0.4);
    color: #10B981;
}

.btn-profile-follow svg { width: 14px; height: 14px; }

.name-badge-line {
    display: flex;
    align-items: center;
    gap: 6px;
}

.profile-name {
    font-size: 17px;
    font-weight: 700;
    color: #FFFFFF;
}

.verified-icon {
    color: var(--accent-cyan);
    display: flex;
}

.verified-icon svg { width: 16px; height: 16px; }

.profile-handle {
    font-size: 11.5px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    margin-top: 2px;
}

.profile-bio {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.45;
    margin-top: 6px;
}

.profile-stats-bar {
    display: flex;
    align-items: center;
    justify-content: space-around;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 14px;
    padding: 10px 12px;
}

.p-stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
}

.p-num {
    font-size: 14px;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    color: #FFFFFF;
}

.p-num.text-emerald { color: #10B981; }

.p-label {
    font-size: 9px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.06em;
}

.profile-tags-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.p-tag {
    font-size: 11px;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--text-secondary);
}

    </style>
</head>
<body>

    <div class="glass-profile-card">
        <!-- Cover Banner -->
        <div class="profile-cover">
            <div class="cover-mesh-aurora"></div>
            <div class="badge-role">STAFF ARCHITECT</div>
        </div>

        <div class="profile-body">
            <div class="avatar-row">
                <div class="profile-avatar-aura">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" alt="Alina Vance" class="avatar-img">
                    <span class="avatar-live-beacon" title="Online in Enclave"></span>
                </div>
                <button type="button" class="btn-profile-follow" id="btnFollow">
                    <i data-lucide="user-plus" id="followIcon"></i>
                    <span id="followText">Follow</span>
                </button>
            </div>

            <div class="profile-identity">
                <div class="name-badge-line">
                    <h3 class="profile-name">Alina Vance</h3>
                    <div class="verified-icon" title="Cryptographically Verified Key"><i data-lucide="badge-check"></i></div>
                </div>
                <p class="profile-handle">@alina.vance • Enclave Cluster 09</p>
                <p class="profile-bio">Core contributor to decentralized confidential agent clusters, WebAssembly runtimes, and low-latency P2P meshes.</p>
            </div>

            <!-- Stats Bar -->
            <div class="profile-stats-bar">
                <div class="p-stat">
                    <span class="p-num" id="followerCount">14.8k</span>
                    <span class="p-label">FOLLOWERS</span>
                </div>
                <div class="p-stat">
                    <span class="p-num">342</span>
                    <span class="p-label">MODULES</span>
                </div>
                <div class="p-stat">
                    <span class="p-num text-emerald">99.9%</span>
                    <span class="p-label">RELIABILITY</span>
                </div>
            </div>

            <!-- Tech Pills -->
            <div class="profile-tags-row">
                <span class="p-tag">Rust</span>
                <span class="p-tag">Confidential AI</span>
                <span class="p-tag">WASM</span>
                <span class="p-tag">WireGuard</span>
            </div>
        </div>
    </div>

    <script>

const btnFollow = document.getElementById('btnFollow');
const followText = document.getElementById('followText');
const followIcon = document.getElementById('followIcon');
const followerCount = document.getElementById('followerCount');

let isFollowing = false;

btnFollow.addEventListener('click', () => {
    isFollowing = !isFollowing;
    btnFollow.classList.toggle('following', isFollowing);
    if (isFollowing) {
        followText.textContent = 'Following';
        followIcon.setAttribute('data-lucide', 'check');
        followerCount.textContent = '14.9k';
    } else {
        followText.textContent = 'Follow';
        followIcon.setAttribute('data-lucide', 'user-plus');
        followerCount.textContent = '14.8k';
    }
    if (window.lucide) lucide.createIcons();
});

        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>

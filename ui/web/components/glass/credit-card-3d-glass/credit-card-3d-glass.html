<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Holographic Glass Card — Glass Dark Standalone</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css.css">
    <style>

:root {
    --bg-page: #08080C;
    --glass-card: rgba(255, 255, 255, 0.07);
    --glass-border-top: rgba(255, 255, 255, 0.32);
    --glass-border-side: rgba(255, 255, 255, 0.12);
    --glass-border-bottom: rgba(255, 255, 255, 0.05);
    --text-primary: #FFFFFF;
    --text-secondary: rgba(255, 255, 255, 0.65);
    --text-muted: rgba(255, 255, 255, 0.38);
    --accent-cyan: #38BDF8;
    --ease-spring: cubic-bezier(0.34, 1.25, 0.64, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background-color: var(--bg-page);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.card-showcase-container {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
}

.card-3d-scene {
    width: 100%;
    max-width: 370px;
    height: 225px;
    perspective: 1200px;
    cursor: grab;
}

.card-3d-scene:active {
    cursor: grabbing;
}

.card-3d-flipper {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.card-3d-flipper.flipped {
    transform: rotateY(180deg) !important;
}

.card-glass-face {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 20px;
    backface-visibility: hidden;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 100%);
    backdrop-filter: blur(32px) saturate(180%);
    -webkit-backdrop-filter: blur(32px) saturate(180%);
    border: 1px solid transparent;
    border-top-color: var(--glass-border-top);
    border-left-color: var(--glass-border-side);
    border-right-color: var(--glass-border-side);
    border-bottom-color: var(--glass-border-bottom);
    box-shadow: 0 20px 48px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.2);
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
}

.face-front {
    z-index: 2;
}

.face-back {
    transform: rotateY(180deg);
    padding: 20px 0 16px 0;
}

.card-glare-foil {
    position: absolute;
    inset: -50%;
    background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.25) 50%, transparent 60%);
    pointer-events: none;
    transform: translate(-10%, -10%);
    transition: transform 0.1s linear;
}

.card-front-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.card-brand-logo {
    display: flex;
    align-items: center;
    gap: 8px;
}

.brand-core {
    font-size: 14.5px;
    font-weight: 800;
    letter-spacing: 0.1em;
    color: #FFFFFF;
}

.brand-tag {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.12em;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(56, 189, 248, 0.18);
    border: 1px solid rgba(56, 189, 248, 0.4);
    color: #38BDF8;
}

.nfc-icon svg {
    width: 20px;
    height: 20px;
    color: rgba(255, 255, 255, 0.6);
    transform: rotate(45deg);
}

.chip-and-network {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 4px 0;
}

.gold-chip {
    width: 44px;
    height: 32px;
    border-radius: 7px;
    background: linear-gradient(135deg, #FDE68A 0%, #D97706 100%);
    box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.6), 0 2px 6px rgba(0, 0, 0, 0.3);
    position: relative;
    overflow: hidden;
}

.chip-line {
    position: absolute;
    top: 50%; left: 0; right: 0;
    height: 1px;
    background: rgba(0, 0, 0, 0.35);
}

.chip-line.horizontal {
    top: 0; bottom: 0; left: 50%; width: 1px; height: 100%;
}

.network-badge {
    display: flex;
    align-items: center;
}

.network-circle {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    opacity: 0.85;
}

.network-circle.orange { background: #F97316; margin-right: -10px; }
.network-circle.red { background: #EF4444; }

.card-number-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: #FFFFFF;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
    display: flex;
    justify-content: space-between;
}

.card-front-bottom {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
}

.card-label {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 2px;
}

.card-holder-name, .card-expiry-date {
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: #FFFFFF;
}

/* Back Face */
.magnetic-strip {
    width: 100%;
    height: 40px;
    background: #000000;
    margin-top: 4px;
}

.signature-band {
    padding: 0 24px;
    margin-top: 10px;
}

.sign-label {
    font-size: 8px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
}

.sign-box {
    display: flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.85);
    height: 32px;
    border-radius: 4px;
    padding: 0 10px;
    justify-content: space-between;
    margin-top: 4px;
}

.signature-text {
    font-family: cursive;
    color: #1E293B;
    font-size: 14px;
}

.cvv-badge {
    display: flex;
    align-items: center;
    gap: 4px;
}

.cvv-label {
    font-size: 9px;
    color: #64748B;
    font-weight: 700;
}

.cvv-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: #0F172A;
}

.card-back-footer {
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.disclaimer-text {
    font-size: 8.5px;
    color: var(--text-muted);
    line-height: 1.3;
    max-width: 230px;
}

.hologram-seal {
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.08em;
    padding: 4px 8px;
    border-radius: 6px;
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.4), rgba(236, 72, 153, 0.4));
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: #FFFFFF;
}

/* Controls */
.card-interactive-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 370px;
    gap: 10px;
}

.btn-flip-card {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 14px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #FFFFFF;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-flip-card:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.25);
}

.btn-flip-card svg { width: 14px; height: 14px; }

.currency-switch {
    display: flex;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    padding: 2px;
}

.btn-curr {
    padding: 5px 9px;
    font-size: 11px;
    font-weight: 600;
    background: transparent;
    border: none;
    color: var(--text-muted);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-curr.active {
    background: rgba(56, 189, 248, 0.2);
    color: #38BDF8;
}

    </style>
</head>
<body>

    <div class="card-showcase-container">
        <!-- 3D Card Scene -->
        <div class="card-3d-scene" id="cardScene">
            <div class="card-3d-flipper" id="cardFlipper">
                <!-- Front Face -->
                <div class="card-glass-face face-front">
                    <div class="card-glare-foil" id="cardFoil"></div>
                    <div class="card-front-top">
                        <div class="card-brand-logo">
                            <span class="brand-core">NEXUS</span>
                            <span class="brand-tag">PLATINUM</span>
                        </div>
                        <div class="nfc-icon">
                            <i data-lucide="rss"></i>
                        </div>
                    </div>

                    <div class="chip-and-network">
                        <div class="gold-chip">
                            <div class="chip-line"></div>
                            <div class="chip-line horizontal"></div>
                        </div>
                        <div class="network-badge">
                            <span class="network-circle orange"></span>
                            <span class="network-circle red"></span>
                        </div>
                    </div>

                    <div class="card-number-display">
                        <span class="num-group">4920</span>
                        <span class="num-group">8819</span>
                        <span class="num-group">3200</span>
                        <span class="num-group">7642</span>
                    </div>

                    <div class="card-front-bottom">
                        <div class="card-holder-block">
                            <div class="card-label">CARDHOLDER</div>
                            <div class="card-holder-name">ADRIAN PRATAMA</div>
                        </div>
                        <div class="card-expiry-block">
                            <div class="card-label">EXPIRES</div>
                            <div class="card-expiry-date">09/29</div>
                        </div>
                    </div>
                </div>

                <!-- Back Face -->
                <div class="card-glass-face face-back">
                    <div class="magnetic-strip"></div>
                    <div class="signature-band">
                        <span class="sign-label">AUTHORIZED SIGNATURE</span>
                        <div class="sign-box">
                            <span class="signature-text">Adrian P.</span>
                            <div class="cvv-badge">
                                <span class="cvv-label">CVV</span>
                                <span class="cvv-value">729</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-back-footer">
                        <p class="disclaimer-text">Issued by Nexus Glass Enclave. Encrypted via Zero-Knowledge biometrics. Non-transferable.</p>
                        <div class="hologram-seal">SECURE</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Controls Toolbar -->
        <div class="card-interactive-controls">
            <button type="button" class="btn-flip-card" id="btnFlipCard">
                <i data-lucide="rotate-cw"></i> Flip Card (CVV)
            </button>
            <div class="currency-switch">
                <button type="button" class="btn-curr active" data-cur="USD">$ USD</button>
                <button type="button" class="btn-curr" data-cur="IDR">Rp IDR</button>
                <button type="button" class="btn-curr" data-cur="EUR">€ EUR</button>
            </div>
        </div>
    </div>

    <script>

const scene = document.getElementById('cardScene');
const flipper = document.getElementById('cardFlipper');
const foil = document.getElementById('cardFoil');
const btnFlip = document.getElementById('btnFlipCard');

let isFlipped = false;

// 3D Parallax Tilt
scene.addEventListener('mousemove', (e) => {
    if (isFlipped) return;
    const rect = scene.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;
    
    const rotateX = ((y - centerY) / centerY) * -14;
    const rotateY = ((x - centerX) / centerX) * 14;
    
    flipper.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    foil.style.transform = `translate(${x * 0.4}px, ${y * 0.4}px)`;
});

scene.addEventListener('mouseleave', () => {
    if (!isFlipped) {
        flipper.style.transform = 'rotateX(0deg) rotateY(0deg)';
    }
});

// Flip Button
btnFlip.addEventListener('click', () => {
    isFlipped = !isFlipped;
    flipper.classList.toggle('flipped', isFlipped);
});

// Currency Switcher
document.querySelectorAll('.btn-curr').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.btn-curr').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    });
});

        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>

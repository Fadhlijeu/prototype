<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Glass Notification Bell & Popover — Glass Dark Standalone</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css.css">
    <style>

:root {
    --bg-page: #08080C;
    --glass-card: rgba(255, 255, 255, 0.06);
    --glass-border-top: rgba(255, 255, 255, 0.24);
    --glass-border-side: rgba(255, 255, 255, 0.10);
    --glass-border-bottom: rgba(255, 255, 255, 0.04);
    --text-primary: #FFFFFF;
    --text-secondary: rgba(255, 255, 255, 0.65);
    --text-muted: rgba(255, 255, 255, 0.38);
    --accent-cyan: #38BDF8;
    --ease-spring: cubic-bezier(0.34, 1.25, 0.64, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background-color: var(--bg-page);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.glass-notif-stage {
    width: 100%;
    max-width: 390px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
}

.notif-bar-header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-radius: 16px;
    background: var(--glass-card);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.08);
}

.system-status-text {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--text-secondary);
}

.btn-glass-bell {
    position: relative;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.2s;
}

.btn-glass-bell:hover {
    transform: scale(1.06);
    background: rgba(255, 255, 255, 0.14);
}

.btn-glass-bell svg { width: 18px; height: 18px; }

.notif-badge-pill {
    position: absolute;
    top: -4px;
    right: -4px;
    background: #EF4444;
    color: #FFFFFF;
    font-size: 9px;
    font-weight: 800;
    padding: 1px 5px;
    border-radius: 999px;
    box-shadow: 0 0 8px #EF4444;
}

.glass-notif-tray {
    width: 100%;
    background: var(--glass-card);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border-radius: 22px;
    border: 1px solid transparent;
    border-top-color: var(--glass-border-top);
    border-left-color: var(--glass-border-side);
    border-right-color: var(--glass-border-side);
    border-bottom-color: var(--glass-border-bottom);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.tray-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.tray-top h4 {
    font-size: 13.5px;
    font-weight: 700;
    color: #FFFFFF;
}

.btn-clear-notifs {
    background: transparent;
    border: none;
    font-size: 11px;
    color: var(--accent-cyan);
    font-weight: 600;
    cursor: pointer;
}

.notif-items-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.notif-item {
    display: flex;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    transition: background-color 0.2s;
}

.notif-item:hover {
    background: rgba(255, 255, 255, 0.06);
}

.notif-item.read {
    opacity: 0.6;
}

.notif-icon-box {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.notif-icon-box.green {
    background: rgba(16, 185, 129, 0.15);
    border: 1px solid rgba(16, 185, 129, 0.3);
    color: #10B981;
}

.notif-icon-box.amber {
    background: rgba(245, 158, 11, 0.15);
    border: 1px solid rgba(245, 158, 11, 0.3);
    color: #FBBF24;
}

.notif-icon-box.cyan {
    background: rgba(56, 189, 248, 0.15);
    border: 1px solid rgba(56, 189, 248, 0.3);
    color: #38BDF8;
}

.notif-icon-box svg { width: 16px; height: 16px; }

.notif-content-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.notif-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.n-title {
    font-size: 12.5px;
    font-weight: 600;
    color: #FFFFFF;
}

.n-time {
    font-size: 10px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
}

.n-desc {
    font-size: 11px;
    color: var(--text-secondary);
    line-height: 1.35;
}

    </style>
</head>
<body>

    <div class="glass-notif-stage">
        <!-- Top Trigger Bar -->
        <div class="notif-bar-header">
            <span class="system-status-text">NOTIFICATIONS DISPATCH</span>
            <button type="button" class="btn-glass-bell" id="btnBell" aria-label="Toggle notifications">
                <i data-lucide="bell"></i>
                <span class="notif-badge-pill" id="bellBadge">3</span>
            </button>
        </div>

        <!-- Floating Popover Glass Tray -->
        <div class="glass-notif-tray" id="notifTray">
            <div class="tray-top">
                <h4>System Signals</h4>
                <button type="button" class="btn-clear-notifs" id="btnClearAll">Mark All Read</button>
            </div>

            <div class="notif-items-list" id="notifList">
                <div class="notif-item unread">
                    <div class="notif-icon-box green"><i data-lucide="server"></i></div>
                    <div class="notif-content-col">
                        <div class="notif-title-row">
                            <span class="n-title">Cluster Provisioned</span>
                            <span class="n-time">2m ago</span>
                        </div>
                        <p class="n-desc">Singapore Edge-01 cluster active with 12 encrypted nodes.</p>
                    </div>
                </div>

                <div class="notif-item unread">
                    <div class="notif-icon-box amber"><i data-lucide="key"></i></div>
                    <div class="notif-content-col">
                        <div class="notif-title-row">
                            <span class="n-title">API Key Rotated</span>
                            <span class="n-time">14m ago</span>
                        </div>
                        <p class="n-desc">Zero-knowledge master key pair rotated successfully.</p>
                    </div>
                </div>

                <div class="notif-item unread">
                    <div class="notif-icon-box cyan"><i data-lucide="database"></i></div>
                    <div class="notif-content-col">
                        <div class="notif-title-row">
                            <span class="n-title">Snapshot Completed</span>
                            <span class="n-time">1h ago</span>
                        </div>
                        <p class="n-desc">Continuous backup verified: 4.8 GB compressed parquet.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>

const btnClear = document.getElementById('btnClearAll');
const badge = document.getElementById('bellBadge');
const items = document.querySelectorAll('.notif-item');

btnClear.addEventListener('click', () => {
    items.forEach(item => {
        item.classList.remove('unread');
        item.classList.add('read');
    });
    badge.style.display = 'none';
});

        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>

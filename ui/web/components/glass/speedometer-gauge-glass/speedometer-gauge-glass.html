<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Glass Network Speedometer Gauge — Glass Dark Standalone</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css.css">
    <style>

:root {
    --bg-page: #08080C;
    --glass-card: rgba(255, 255, 255, 0.06);
    --glass-border-top: rgba(255, 255, 255, 0.24);
    --glass-border-side: rgba(255, 255, 255, 0.10);
    --glass-border-bottom: rgba(255, 255, 255, 0.04);
    --text-primary: #FFFFFF;
    --text-secondary: rgba(255, 255, 255, 0.65);
    --text-muted: rgba(255, 255, 255, 0.38);
    --accent-cyan: #38BDF8;
    --ease-spring: cubic-bezier(0.34, 1.25, 0.64, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background-color: var(--bg-page);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.glass-speed-card {
    width: 100%;
    max-width: 390px;
    background: var(--glass-card);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border-radius: 24px;
    border: 1px solid transparent;
    border-top-color: var(--glass-border-top);
    border-left-color: var(--glass-border-side);
    border-right-color: var(--glass-border-side);
    border-bottom-color: var(--glass-border-bottom);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
}

.speed-header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.speed-title-block {
    display: flex;
    align-items: center;
    gap: 8px;
}

.speed-title-block svg { width: 18px; height: 18px; color: var(--accent-cyan); }
.speed-title-block h3 { font-size: 14.5px; font-weight: 700; color: #FFFFFF; }

.server-tag {
    font-size: 10.5px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-muted);
}

.gauge-arc-stage {
    position: relative;
    width: 240px;
    height: 130px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
}

.speedo-svg {
    width: 100%;
    height: 100%;
}

#gaugePath {
    transition: stroke-dashoffset 0.6s var(--ease-spring);
}

.speedo-center-readout {
    position: absolute;
    bottom: 0px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.speedo-val {
    font-size: 34px;
    font-weight: 800;
    color: #FFFFFF;
    font-family: 'JetBrains Mono', monospace;
    line-height: 1;
}

.speedo-unit {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent-cyan);
    letter-spacing: 0.05em;
    margin-top: 2px;
}

.speedo-stats-row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 14px;
    padding: 10px 16px;
}

.s-kpi {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
}

.s-lbl {
    font-size: 9px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.06em;
}

.s-val {
    font-size: 11.5px;
    font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
}

.s-val.text-cyan { color: #38BDF8; }
.s-val.text-purple { color: #C084FC; }
.s-val.text-emerald { color: #10B981; }

.s-divider {
    width: 1px;
    height: 22px;
    background: rgba(255, 255, 255, 0.08);
}

.btn-test-speed {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px;
    border-radius: 12px;
    font-size: 12.5px;
    font-weight: 600;
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(168, 85, 247, 0.2));
    border: 1px solid rgba(56, 189, 248, 0.4);
    color: #FFFFFF;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-test-speed:hover {
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.35), rgba(168, 85, 247, 0.35));
    box-shadow: 0 0 16px rgba(56, 189, 248, 0.35);
}

.btn-test-speed svg { width: 15px; height: 15px; }

    </style>
</head>
<body>

    <div class="glass-speed-card">
        <div class="speed-header">
            <div class="speed-title-block">
                <i data-lucide="gauge"></i>
                <h3>Network Velocity Gauge</h3>
            </div>
            <span class="server-tag">Singapore Edge-01</span>
        </div>

        <!-- Gauge Visual Arc Stage -->
        <div class="gauge-arc-stage">
            <svg class="speedo-svg" viewBox="0 0 240 140">
                <defs>
                    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#38BDF8"/>
                        <stop offset="50%" stop-color="#818CF8"/>
                        <stop offset="100%" stop-color="#EC4899"/>
                    </linearGradient>
                </defs>
                <!-- Gray background arc: 180deg to 0deg (semicircle) -->
                <path d="M 30,120 A 90,90 0 0,1 210,120" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="14" stroke-linecap="round"/>
                <!-- Dynamic gradient arc -->
                <path id="gaugePath" d="M 30,120 A 90,90 0 0,1 210,120" fill="none" stroke="url(#gaugeGrad)" stroke-width="14" stroke-linecap="round" stroke-dasharray="283" stroke-dashoffset="56"/>
            </svg>

            <!-- Center Digital Counter -->
            <div class="speedo-center-readout">
                <span class="speedo-val" id="speedoVal">842.6</span>
                <span class="speedo-unit">Mbps</span>
            </div>
        </div>

        <!-- Latency / Jitter Readouts -->
        <div class="speedo-stats-row">
            <div class="s-kpi">
                <span class="s-lbl">DOWNLOAD</span>
                <span class="s-val text-cyan" id="downVal">842.6 Mbps</span>
            </div>
            <div class="s-divider"></div>
            <div class="s-kpi">
                <span class="s-lbl">UPLOAD</span>
                <span class="s-val text-purple">124.8 Mbps</span>
            </div>
            <div class="s-divider"></div>
            <div class="s-kpi">
                <span class="s-lbl">LATENCY</span>
                <span class="s-val text-emerald">8 ms</span>
            </div>
        </div>

        <button type="button" class="btn-test-speed" id="btnTestSpeed">
            <i data-lucide="zap"></i> Start Speed Velocity Test
        </button>
    </div>

    <script>

const gauge = document.getElementById('gaugePath');
const valEl = document.getElementById('speedoVal');
const downEl = document.getElementById('downVal');
const btnTest = document.getElementById('btnTestSpeed');

const maxDash = 283;

function setSpeed(mbps) {
    const ratio = Math.min(1000, mbps) / 1000;
    const offset = maxDash - (ratio * maxDash);
    gauge.style.strokeDashoffset = offset;
    valEl.textContent = mbps.toFixed(1);
    downEl.textContent = `${mbps.toFixed(1)} Mbps`;
}

btnTest.addEventListener('click', () => {
    btnTest.disabled = true;
    let step = 0;
    const interval = setInterval(() => {
        step++;
        const target = Math.sin(step * 0.4) * 300 + 600 + Math.random() * 80;
        setSpeed(target);
        if (step > 15) {
            clearInterval(interval);
            setSpeed(942.8);
            btnTest.disabled = false;
        }
    }, 120);
});

        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>

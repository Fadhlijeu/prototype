<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Storage Card — Glass Dark Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
        <!-- Shared Glass Design System Tokens & White/Blob Themes -->
    <link rel="stylesheet" href="../css.css">
    <style>
        :root {
            --bg-page: #0A0A0A;
            --glass-card: rgba(255, 255, 255, 0.06);
            --glass-border-top: rgba(255, 255, 255, 0.25);
            --glass-border-side: rgba(255, 255, 255, 0.12);
            --glass-border-bottom: rgba(255, 255, 255, 0.04);
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.65);
            --aurora-1: rgba(70, 110, 220, 0.65);
            --aurora-2: rgba(40, 60, 160, 0.55);
            --aurora-3: rgba(140, 70, 230, 0.45);
            --ease-spring: cubic-bezier(0.32, 0.72, 0, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-page);
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* LAYER 5: Page Background Wrapper */
        .storage-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            transition: transform 0.3s ease;
        }

        .storage-wrapper:hover {
            transform: translateY(-4px);
        }

        /* LAYER 4: 3D Shadow Card */
        .layer-4-shadow {
            position: absolute;
            top: 12px; left: 0; right: 0; bottom: -12px;
            background: rgba(25, 45, 110, 0.5);
            border-radius: 32px;
            filter: blur(30px);
            transform: scale(0.96) translateY(12px);
            z-index: -2;
            transition: all 0.4s var(--ease-spring);
        }

        .storage-wrapper:hover .layer-4-shadow {
            transform: scale(0.98) translateY(16px);
            filter: blur(40px);
        }

        /* LAYER 3: Aurora Mesh Gradient */
        .layer-3-aurora {
            position: absolute;
            inset: 0;
            border-radius: 28px;
            overflow: hidden;
            z-index: -1;
            contain: layout style paint;
        }

        .aurora-blob {
            position: absolute;
            filter: blur(40px);
            animation: auroraMorph 10s infinite alternate ease-in-out;
        }

        .blob-1 { top: -10%; left: -10%; width: 70%; height: 70%; background: radial-gradient(circle, var(--aurora-1) 0%, transparent 70%); }
        .blob-2 { bottom: -20%; right: -10%; width: 80%; height: 80%; background: radial-gradient(circle, var(--aurora-2) 0%, transparent 60%); animation-delay: -3s; }
        .blob-3 { top: 10%; right: 20%; width: 60%; height: 60%; background: radial-gradient(circle, var(--aurora-3) 0%, transparent 60%); animation-delay: -6s; }

        @keyframes auroraMorph {
            0% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; transform: translate(0, 0) scale(1); }
            50% { transform: translate(5%, 10%) scale(1.05); }
            100% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; transform: translate(-5%, -5%) scale(0.95); }
        }

        /* LAYER 2: Main Glass Card */
        .layer-2-glass {
            position: relative;
            width: 100%;
            padding: 26px 30px;
            background: var(--glass-card);
            backdrop-filter: blur(30px) saturate(160%);
            -webkit-backdrop-filter: blur(30px) saturate(160%);
            border-radius: 28px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.12);
            border: 1px solid transparent;
            border-top-color: var(--glass-border-top);
            border-left-color: var(--glass-border-side);
            border-right-color: var(--glass-border-side);
            border-bottom-color: var(--glass-border-bottom);
            overflow: hidden;
            z-index: 1;
        }

        /* LAYER 1: Noise Texture Overlay */
        .layer-2-glass::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.04;
            mix-blend-mode: overlay;
            pointer-events: none;
            z-index: 0;
        }

        /* Decorative Twinkle Grid */
        .layer-1-pattern {
            position: absolute;
            top: 22px; right: 26px;
            display: grid;
            grid-template-columns: repeat(5, 10px);
            grid-template-rows: repeat(3, 10px);
            gap: 14px;
            pointer-events: none;
        }

        .plus-mark {
            width: 10px; height: 10px;
            position: relative;
            animation: twinkle 3s infinite alternate;
        }

        .plus-mark.hide { opacity: 0 !important; animation: none; }

        .plus-mark::before, .plus-mark::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.2);
        }
        .plus-mark::before { top: 4px; left: 0; width: 10px; height: 1.5px; }
        .plus-mark::after { top: 0; left: 4px; width: 1.5px; height: 10px; }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 0.95; }
        }

        /* LAYER 0: Content Layout */
        .layer-0-content {
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
            z-index: 2;
        }

        .icon-container {
            position: relative;
            width: 60px; height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.15);
        }

        .icon-container svg {
            color: var(--text-primary);
            width: 28px; height: 28px;
            stroke-width: 1.5px;
        }

        .badge {
            position: absolute;
            top: -2px; right: -2px;
            width: 18px; height: 18px;
            background: #4ADE80;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(74, 222, 128, 0.4);
            border: 2px solid #1E293B;
        }

        .badge svg {
            color: var(--text-primary);
            width: 10px; height: 10px;
            stroke-width: 2px;
        }

        .data-section { flex: 1; }

        .data-section h2 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.01em;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.25);
        }

        .data-section p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .progress-track {
            width: 100%;
            height: 10px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            margin-top: 16px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 55%;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.95) 0%, rgba(74, 123, 247, 0.85) 100%);
            border-radius: 6px;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
            transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        }
    </style>
</head>
<body>

    <div class="storage-wrapper">
        <div class="layer-4-shadow"></div>
        
        <div class="layer-3-aurora">
            <div class="aurora-blob blob-1"></div>
            <div class="aurora-blob blob-2"></div>
            <div class="aurora-blob blob-3"></div>
        </div>

        <article class="layer-2-glass" role="region" aria-label="Storage information">
            <div class="layer-1-pattern" aria-hidden="true">
                <div class="plus-mark" style="animation-delay: 0.1s;"></div>
                <div class="plus-mark" style="animation-delay: 0.3s;"></div>
                <div class="plus-mark" style="animation-delay: 0.5s;"></div>
                <div class="plus-mark" style="animation-delay: 0.2s;"></div>
                <div class="plus-mark" style="animation-delay: 0.7s;"></div>
                <div class="plus-mark hide"></div>
                <div class="plus-mark" style="animation-delay: 0.4s;"></div>
                <div class="plus-mark" style="animation-delay: 0.6s;"></div>
                <div class="plus-mark" style="animation-delay: 0.1s;"></div>
                <div class="plus-mark hide"></div>
                <div class="plus-mark" style="animation-delay: 0.8s;"></div>
                <div class="plus-mark" style="animation-delay: 0.2s;"></div>
                <div class="plus-mark" style="animation-delay: 0.9s;"></div>
                <div class="plus-mark" style="animation-delay: 0.3s;"></div>
                <div class="plus-mark" style="animation-delay: 0.5s;"></div>
            </div>

            <div class="layer-0-content">
                <div class="icon-container">
                    <i data-lucide="cloud"></i>
                    <div class="badge"><i data-lucide="arrow-up"></i></div>
                </div>
                
                <div class="data-section">
                    <h2>Available Space</h2>
                    <p>70.1 GB of 128 TB Used</p>
                    <div class="progress-track" aria-hidden="true">
                        <div class="progress-fill" role="progressbar" aria-valuenow="55" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                </div>
            </div>
        </article>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>

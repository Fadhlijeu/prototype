<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Modal Dialog — Glass Dark Premium (All-in-One)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
:root {
    --bg-page: #08080C;
    --glass-card: rgba(255, 255, 255, 0.06);
    --glass-card-hover: rgba(255, 255, 255, 0.09);
    --glass-border-top: rgba(255, 255, 255, 0.24);
    --glass-border-side: rgba(255, 255, 255, 0.10);
    --glass-border-bottom: rgba(255, 255, 255, 0.04);
    --text-primary: #FFFFFF;
    --text-secondary: rgba(255, 255, 255, 0.65);
    --text-muted: rgba(255, 255, 255, 0.38);
    --accent-cyan: #4A9EFF;
    --accent-blue-1: #4A7BF7;
    --accent-blue-2: #2E5FD9;
    --accent-blue-3: #1E3A8A;
    --accent-green: #10B981;
    --accent-amber: #F59E0B;
    --accent-red: #EF4444;
    --ease-spring: cubic-bezier(0.34, 1.15, 0.64, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background-color: var(--bg-page);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text-primary);
}


body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
}

.modal-box {
    position: relative;
    width: 100%;
    max-width: 400px;
    border-radius: 26px;
    background: var(--glass-card);
    backdrop-filter: blur(28px) saturate(160%);
    border: 1px solid transparent;
    border-top-color: var(--glass-border-top);
    border-left-color: var(--glass-border-side);
    border-right-color: var(--glass-border-side);
    border-bottom-color: var(--glass-border-bottom);
    box-shadow: 0 20px 48px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.modal-title {
    font-size: 16px;
    font-weight: 700;
}

.close-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
}

.close-btn:hover {
    background: rgba(255, 255, 255, 0.12);
    color: #FFFFFF;
}

.modal-content {
    font-size: 13.5px;
    color: var(--text-secondary);
    line-height: 1.6;
}

.modal-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 6px;
}

.btn-m {
    padding: 9px 16px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.2s var(--ease-spring);
}

.btn-m.cancel {
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-secondary);
    border-color: rgba(255, 255, 255, 0.1);
}

.btn-m.confirm {
    background: linear-gradient(135deg, #4A7BF7, #2E5FD9);
    color: #FFFFFF;
    box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
}

.btn-m:hover { transform: translateY(-1px); }

.modal-status-feedback {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 600;
    margin-top: 16px;
    transition: all 0.25s ease;
}
.modal-status-feedback.confirm {
    display: flex;
    background: rgba(16, 185, 129, 0.16);
    border: 1px solid rgba(16, 185, 129, 0.4);
    color: #34D399;
    box-shadow: 0 4px 16px rgba(16, 185, 129, 0.2);
}
.modal-status-feedback.cancel {
    display: flex;
    background: rgba(239, 68, 68, 0.16);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: #F87171;
    box-shadow: 0 4px 16px rgba(239, 68, 68, 0.2);
}
.modal-status-feedback.close {
    display: flex;
    background: rgba(148, 163, 184, 0.16);
    border: 1px solid rgba(148, 163, 184, 0.3);
    color: #E2E8F0;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
}
    </style>
</head>
<body>

    <div class="modal-box">
        <div class="modal-head">
            <h3 class="modal-title">Confirm Component Action</h3>
            <button type="button" class="close-btn" onclick="handleModalAction('close', 'Modal ditutup.')">
                <i data-lucide="x"></i>
            </button>
        </div>
        <p class="modal-content">
            Are you sure you want to deploy the Glass Dark Premium design tokens to all child components?
        </p>
        <div class="modal-actions">
            <button type="button" class="btn-m cancel" onclick="handleModalAction('cancel', 'Tindakan Dibatalkan.')">Cancel</button>
            <button type="button" class="btn-m confirm" onclick="handleModalAction('confirm', 'Tindakan Dikonfirmasi!')">Confirm</button>
        </div>
        <div class="modal-status-feedback" id="modalFeedback"></div>
    </div>

    <script>
        if (window.lucide) window.lucide.createIcons();

        let modalFbTimer = null;
        function handleModalAction(type, msg) {
            const fb = document.getElementById('modalFeedback');
            if (!fb) return;
            fb.className = `modal-status-feedback ${type}`;
            fb.innerHTML = type === 'confirm' ? `<i data-lucide="check-circle-2"></i> ${msg}` :
                           type === 'cancel' ? `<i data-lucide="x-circle"></i> ${msg}` :
                           `<i data-lucide="info"></i> ${msg}`;
            if (window.lucide) window.lucide.createIcons();
            clearTimeout(modalFbTimer);
            modalFbTimer = setTimeout(() => {
                fb.className = 'modal-status-feedback';
            }, 2600);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Glass Battery & Telemetry Capsule — Glass Dark Standalone</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css.css">
    <style>

:root {
    --bg-page: #08080C;
    --glass-card: rgba(255, 255, 255, 0.06);
    --glass-border-top: rgba(255, 255, 255, 0.24);
    --glass-border-side: rgba(255, 255, 255, 0.10);
    --glass-border-bottom: rgba(255, 255, 255, 0.04);
    --text-primary: #FFFFFF;
    --text-secondary: rgba(255, 255, 255, 0.65);
    --text-muted: rgba(255, 255, 255, 0.38);
    --accent-cyan: #38BDF8;
    --ease-spring: cubic-bezier(0.34, 1.25, 0.64, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background-color: var(--bg-page);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.glass-battery-card {
    width: 100%;
    max-width: 390px;
    background: var(--glass-card);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border-radius: 24px;
    border: 1px solid transparent;
    border-top-color: var(--glass-border-top);
    border-left-color: var(--glass-border-side);
    border-right-color: var(--glass-border-side);
    border-bottom-color: var(--glass-border-bottom);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
}

.battery-top-bar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.battery-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    font-weight: 700;
    color: var(--accent-cyan);
    letter-spacing: 0.08em;
}

.bat-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-cyan);
    box-shadow: 0 0 8px var(--accent-cyan);
}

.bat-health {
    font-size: 11px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
}

.battery-visual-scene {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 10px 0;
}

.battery-outer-glass {
    position: relative;
    width: 240px;
    height: 84px;
    border-radius: 20px;
    background: rgba(0, 0, 0, 0.45);
    border: 2px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.3);
    padding: 6px;
    overflow: hidden;
}

.battery-terminal-nipple {
    position: absolute;
    right: -10px;
    top: 50%;
    transform: translateY(-50%);
    width: 8px;
    height: 32px;
    background: rgba(255, 255, 255, 0.25);
    border-radius: 0 6px 6px 0;
}

.battery-fluid-fill {
    height: 100%;
    border-radius: 14px;
    background: linear-gradient(90deg, #059669 0%, #10B981 60%, #34D399 100%);
    box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
    position: relative;
    overflow: hidden;
    transition: width 0.35s var(--ease-spring), background 0.35s;
}

.fluid-wave {
    position: absolute;
    top: 0; right: 0; bottom: 0; width: 24px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4));
    animation: wavePulse 1.8s infinite alternate ease-in-out;
}

@keyframes wavePulse {
    0% { transform: scaleX(0.8); opacity: 0.3; }
    100% { transform: scaleX(1.4); opacity: 0.8; }
}

.battery-overlay-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FFFFFF;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    pointer-events: none;
}

.battery-overlay-icon svg { width: 32px; height: 32px; }

.battery-number-display {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.pct-big {
    font-size: 42px;
    font-weight: 800;
    color: #FFFFFF;
    font-family: 'JetBrains Mono', monospace;
    line-height: 1;
}

.pct-sign {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent-cyan);
    margin-top: -32px;
    margin-left: 64px;
}

.charge-status-text {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #10B981;
    margin-top: 6px;
    font-family: 'JetBrains Mono', monospace;
}

.battery-metrics-row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    padding: 10px 14px;
}

.b-stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
}

.b-lbl {
    font-size: 9px;
    font-weight: 700;
    color: var(--text-muted);
}

.b-val {
    font-size: 11.5px;
    font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
    color: #FFFFFF;
}

.battery-slider-wrap {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.slider-hint {
    font-size: 11px;
    color: var(--text-muted);
}

.bat-slider {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
    outline: none;
    cursor: pointer;
}

.bat-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #38BDF8;
    box-shadow: 0 0 10px #38BDF8;
    cursor: pointer;
}

    </style>
</head>
<body>

    <div class="glass-battery-card">
        <div class="battery-top-bar">
            <div class="battery-badge">
                <span class="bat-dot"></span>
                <span>QUANTUM CELL TELEMETRY</span>
            </div>
            <span class="bat-health">Health: 99.2%</span>
        </div>

        <!-- 3D Glass Battery Capsule Container -->
        <div class="battery-visual-scene">
            <div class="battery-outer-glass">
                <div class="battery-terminal-nipple"></div>
                <!-- Translucent Fluid Liquid Level -->
                <div class="battery-fluid-fill" id="batFluid" style="width: 82%;">
                    <div class="fluid-wave"></div>
                    <div class="fluid-bubbles"></div>
                </div>
                <!-- Bolt Icon overlay -->
                <div class="battery-overlay-icon" id="boltIcon">
                    <i data-lucide="zap"></i>
                </div>
            </div>
        </div>

        <div class="battery-number-display">
            <span class="pct-big" id="batPct">82</span>
            <span class="pct-sign">%</span>
            <span class="charge-status-text" id="batStatus">SUPERCHARGING ACTIVE (65W)</span>
        </div>

        <!-- Metric Telemetry Grid -->
        <div class="battery-metrics-row">
            <div class="b-stat">
                <span class="b-lbl">VOLTAGE</span>
                <span class="b-val">4.28 V</span>
            </div>
            <div class="b-stat">
                <span class="b-lbl">TEMPERATURE</span>
                <span class="b-val">28.4 °C</span>
            </div>
            <div class="b-stat">
                <span class="b-lbl">EST. RUNTIME</span>
                <span class="b-val" id="batTime">14h 20m</span>
            </div>
        </div>

        <!-- Controls Interactive Slider -->
        <div class="battery-slider-wrap">
            <label for="batRange" class="slider-hint">Simulate Battery Level:</label>
            <input type="range" min="5" max="100" value="82" class="bat-slider" id="batRange">
        </div>
    </div>

    <script>

const slider = document.getElementById('batRange');
const fluid = document.getElementById('batFluid');
const pctText = document.getElementById('batPct');
const timeText = document.getElementById('batTime');
const statusText = document.getElementById('batStatus');

slider.addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    fluid.style.width = `${val}%`;
    pctText.textContent = val;

    // Color shifting
    if (val > 50) {
        fluid.style.background = 'linear-gradient(90deg, #059669 0%, #10B981 60%, #34D399 100%)';
        fluid.style.boxShadow = '0 0 20px rgba(16, 185, 129, 0.5)';
        statusText.style.color = '#10B981';
        statusText.textContent = 'SUPERCHARGING ACTIVE (65W)';
    } else if (val > 20) {
        fluid.style.background = 'linear-gradient(90deg, #D97706 0%, #F59E0B 60%, #FCD34D 100%)';
        fluid.style.boxShadow = '0 0 20px rgba(245, 158, 11, 0.5)';
        statusText.style.color = '#F59E0B';
        statusText.textContent = 'DISCHARGING • NORMAL WORKLOAD';
    } else {
        fluid.style.background = 'linear-gradient(90deg, #DC2626 0%, #EF4444 60%, #FCA5A5 100%)';
        fluid.style.boxShadow = '0 0 20px rgba(239, 68, 68, 0.5)';
        statusText.style.color = '#EF4444';
        statusText.textContent = 'LOW POWER RESERVE • CONNECT DOCK';
    }

    const hours = Math.floor((val / 100) * 18);
    const mins = Math.floor(((val / 100) * 18 - hours) * 60);
    timeText.textContent = `${hours}h ${mins}m`;
});

        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Input Fields — Glass Dark Premium (All-in-One)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-page: #08080C;
            --glass-card: rgba(255, 255, 255, 0.06);
            --glass-border-top: rgba(255, 255, 255, 0.24);
            --glass-border-side: rgba(255, 255, 255, 0.10);
            --glass-border-bottom: rgba(255, 255, 255, 0.04);
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.65);
            --text-muted: rgba(255, 255, 255, 0.38);
            --accent-cyan: #38BDF8;
            --ease-spring: cubic-bezier(0.34, 1.15, 0.64, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-page);
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .form-group-wrap {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .field-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            display: block;
            letter-spacing: 0.02em;
        }

        .glass-field {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--glass-card);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border-radius: 16px;
            border: 1px solid transparent;
            border-top-color: var(--glass-border-top);
            border-left-color: var(--glass-border-side);
            border-right-color: var(--glass-border-side);
            border-bottom-color: var(--glass-border-bottom);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            padding: 0 14px;
            transition: all 0.2s ease;
        }

        .glass-field:focus-within {
            border-color: rgba(56, 189, 248, 0.5);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18), 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .field-icon {
            color: var(--text-muted);
            width: 18px;
            height: 18px;
            stroke-width: 1.5px;
            flex-shrink: 0;
            transition: color 0.2s;
        }

        .glass-field:focus-within .field-icon {
            color: var(--accent-cyan);
        }

        .glass-input {
            flex: 1;
            width: 0;
            min-width: 0;
            background: transparent;
            border: none;
            outline: none;
            color: #FFFFFF;
            font-size: 14px;
            font-family: inherit;
            padding: 13px 12px;
        }

        .glass-input::placeholder {
            color: var(--text-muted);
        }

        /* Anti-white box browser autofill override */
        .glass-input:-webkit-autofill,
        .glass-input:-webkit-autofill:hover,
        .glass-input:-webkit-autofill:focus,
        .glass-input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 1000px #0E1018 inset !important;
            -webkit-text-fill-color: #FFFFFF !important;
            caret-color: #FFFFFF !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .field-action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            flex-shrink: 0;
        }

        .field-action-btn:hover {
            color: #FFFFFF;
        }

        .field-action-btn svg {
            width: 17px;
            height: 17px;
        }
    </style>
</head>
<body>

    <div class="form-group-wrap">
        <div>
            <span class="field-label">Pencarian Universal</span>
            <div class="glass-field">
                <i data-lucide="search" class="field-icon"></i>
                <input type="text" class="glass-input" placeholder="Cari komponen, file, token..." autocomplete="off">
            </div>
        </div>

        <div>
            <span class="field-label">Email Pengguna</span>
            <div class="glass-field">
                <i data-lucide="mail" class="field-icon"></i>
                <input type="email" class="glass-input" placeholder="nama@domain.com" autocomplete="off">
            </div>
        </div>

        <div>
            <span class="field-label">Kata Sandi Akun</span>
            <div class="glass-field">
                <i data-lucide="lock" class="field-icon"></i>
                <input type="password" id="passInput" class="glass-input" placeholder="Masukkan kata sandi aman..." autocomplete="new-password">
                <button type="button" class="field-action-btn" id="togglePassBtn" onclick="togglePasswordVisibility()" title="Lihat kata sandi">
                    <i data-lucide="eye" id="eyeIcon"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        if (window.lucide) window.lucide.createIcons();

        function togglePasswordVisibility() {
            const passInput = document.getElementById('passInput');
            const eyeIcon = document.getElementById('eyeIcon');
            if (!passInput) return;

            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                passInput.type = 'password';
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            if (window.lucide) window.lucide.createIcons();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Input Fields — Glass Dark Premium</title>
    <link rel="stylesheet" href="../css.css">
    <link rel="stylesheet" href="index.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="form-group-wrap">
        <div>
            <span class="field-label">Pencarian Universal</span>
            <div class="glass-field">
                <i data-lucide="search" class="field-icon"></i>
                <input type="text" class="glass-input" placeholder="Cari komponen, file, token..." autocomplete="off">
            </div>
        </div>

        <div>
            <span class="field-label">Email Pengguna</span>
            <div class="glass-field">
                <i data-lucide="mail" class="field-icon"></i>
                <input type="email" class="glass-input" placeholder="nama@domain.com" autocomplete="off">
            </div>
        </div>

        <div>
            <span class="field-label">Kata Sandi Akun</span>
            <div class="glass-field">
                <i data-lucide="lock" class="field-icon"></i>
                <input type="password" id="passInput" class="glass-input" placeholder="Masukkan kata sandi aman..." autocomplete="new-password">
                <button type="button" class="field-action-btn" id="togglePassBtn" title="Lihat kata sandi">
                    <i data-lucide="eye" id="eyeIcon"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>

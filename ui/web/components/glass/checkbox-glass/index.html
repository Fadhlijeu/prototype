<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Checkbox & Radio — Glass Dark Premium</title>
    <link rel="stylesheet" href="../css.css">
    <link rel="stylesheet" href="index.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="check-group">
        <div class="check-item active" onclick="this.classList.toggle('active')">
            <div class="glass-checkbox">
                <i data-lucide="check"></i>
            </div>
            <span class="check-text">Enable 5-layer Glass Stack</span>
        </div>
        <div class="check-item active" onclick="this.classList.toggle('active')">
            <div class="glass-checkbox">
                <i data-lucide="check"></i>
            </div>
            <span class="check-text">Asymmetric Specular Borders</span>
        </div>
        <div class="check-item" onclick="this.classList.toggle('active')">
            <div class="glass-checkbox">
                <i data-lucide="check"></i>
            </div>
            <span class="check-text">Spring Physics Dock Animations</span>
        </div>
    </div>

    <script>
        if (window.lucide) window.lucide.createIcons();
    </script>
</body>
</html>

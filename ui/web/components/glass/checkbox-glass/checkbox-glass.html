<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Checkbox & Radio — Glass Dark Premium (All-in-One)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
        <!-- Shared Glass Design System Tokens & White/Blob Themes -->
    <link rel="stylesheet" href="../css.css">
    <style>
:root {
    --bg-page: #08080C;
    --glass-card: rgba(255, 255, 255, 0.06);
    --glass-card-hover: rgba(255, 255, 255, 0.09);
    --glass-border-top: rgba(255, 255, 255, 0.24);
    --glass-border-side: rgba(255, 255, 255, 0.10);
    --glass-border-bottom: rgba(255, 255, 255, 0.04);
    --text-primary: #FFFFFF;
    --text-secondary: rgba(255, 255, 255, 0.65);
    --text-muted: rgba(255, 255, 255, 0.38);
    --accent-cyan: #4A9EFF;
    --accent-blue-1: #4A7BF7;
    --accent-blue-2: #2E5FD9;
    --accent-blue-3: #1E3A8A;
    --accent-green: #10B981;
    --accent-amber: #F59E0B;
    --accent-red: #EF4444;
    --ease-spring: cubic-bezier(0.34, 1.15, 0.64, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background-color: var(--bg-page);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text-primary);
}


body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
}

.check-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 320px;
}

.check-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 14px;
    background: var(--glass-card);
    backdrop-filter: blur(18px);
    border: 1px solid transparent;
    border-top-color: var(--glass-border-top);
    border-left-color: var(--glass-border-side);
    border-right-color: var(--glass-border-side);
    border-bottom-color: var(--glass-border-bottom);
    cursor: pointer;
    user-select: none;
    transition: all 0.2s ease;
}

.check-item:hover {
    background: var(--glass-card-hover);
}

.glass-checkbox {
    width: 20px;
    height: 20px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s var(--ease-spring);
    flex-shrink: 0;
}

.check-item.active .glass-checkbox {
    background: linear-gradient(135deg, #4A7BF7, #2E5FD9);
    border-color: var(--text-muted);
    box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
}

.glass-checkbox svg {
    width: 13px; height: 13px;
    color: var(--text-primary);
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.2s var(--ease-spring);
}

.check-item.active .glass-checkbox svg {
    opacity: 1;
    transform: scale(1);
}

.check-text {
    font-size: 13.5px;
    font-weight: 500;
}

    </style>
</head>
<body>

    <div class="check-group">
        <div class="check-item active" onclick="this.classList.toggle('active')">
            <div class="glass-checkbox">
                <i data-lucide="check"></i>
            </div>
            <span class="check-text">Enable 5-layer Glass Stack</span>
        </div>
        <div class="check-item active" onclick="this.classList.toggle('active')">
            <div class="glass-checkbox">
                <i data-lucide="check"></i>
            </div>
            <span class="check-text">Asymmetric Specular Borders</span>
        </div>
        <div class="check-item" onclick="this.classList.toggle('active')">
            <div class="glass-checkbox">
                <i data-lucide="check"></i>
            </div>
            <span class="check-text">Spring Physics Dock Animations</span>
        </div>
    </div>

    <script>
        if (window.lucide) window.lucide.createIcons();
    </script>
    <script>

    </script>
</body>
</html>

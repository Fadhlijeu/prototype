<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Input Bar — Glass Dark Premium</title>
    <link rel="stylesheet" href="../css.css">
    <link rel="stylesheet" href="index.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="chat-bar-wrapper">
        <!-- Media Upload Preview Container (Authentic Glass Multi-File Container) -->
        <div class="upload-preview-area" id="uploadPreviewArea">
            <div class="preview-header">
                <div class="preview-header-left">
                    <i data-lucide="paperclip"></i>
                    <span id="previewCountBadge">Lampiran (0)</span>
                </div>
                <button type="button" class="btn-clear-all" id="btnClearAll" title="Hapus semua berkas">
                    <i data-lucide="trash-2"></i> Hapus Semua
                </button>
            </div>
            <div class="preview-files-list" id="previewFilesList">
                <!-- Dynamically populated file chips -->
            </div>
        </div>

        <!-- Chat Form -->
        <form class="chat-input-bar" id="chatForm">
            <!-- Hidden File Input with multiple attribute -->
            <input type="file" id="chatFileInput" multiple accept="image/*,.pdf,.doc,.docx,.txt,.zip" style="display: none;">

            <button type="button" class="icon-btn" id="attachBtn" title="Lampirkan berkas (gambar, dokumen, multi-file)">
                <i data-lucide="plus"></i>
            </button>

            <input type="text" id="chatInput" class="chat-input" placeholder="Tanyakan apapun. Multi berkas & gambar didukung..." autocomplete="off">

            <button type="button" class="icon-btn" id="micBtn" title="Dikte suara">
                <i data-lucide="mic"></i>
            </button>

            <button type="submit" class="icon-btn send-btn" title="Kirim pesan">
                <i data-lucide="arrow-up"></i>
            </button>
        </form>
    </div>

    <div class="toast-notification" id="toastBox">
        <i data-lucide="check-circle-2"></i>
        <span id="toastText">Pesan terkirim!</span>
    </div>

    <script src="index.js"></script>
</body>
</html>

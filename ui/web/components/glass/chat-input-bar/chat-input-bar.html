<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Input Bar — Glass Dark Premium (All-in-One)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-page: #08080C;
            --glass-card: rgba(255, 255, 255, 0.06);
            --glass-border-top: rgba(255, 255, 255, 0.24);
            --glass-border-side: rgba(255, 255, 255, 0.10);
            --glass-border-bottom: rgba(255, 255, 255, 0.04);
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.65);
            --text-muted: rgba(255, 255, 255, 0.38);
            --accent-cyan: #38BDF8;
            --accent-blue-1: #38BDF8;
            --accent-blue-2: #2563EB;
            --accent-blue-3: #1D4ED8;
            --ease-spring: cubic-bezier(0.34, 1.15, 0.64, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-page);
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow-x: auto;
        }

        .chat-bar-wrapper {
            position: relative;
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Uploaded Media Preview Area (Above Input Field) */
        .upload-preview-area {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            animation: slideDownFade 0.25s var(--ease-spring);
        }

        .upload-preview-area.active {
            display: flex;
        }

        @keyframes slideDownFade {
            from { opacity: 0; transform: translateY(8px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .preview-thumb-box {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .preview-thumb-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-thumb-box svg {
            width: 20px;
            height: 20px;
            color: var(--accent-cyan);
        }

        .preview-meta {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .preview-filename {
            font-size: 13px;
            font-weight: 600;
            color: #FFFFFF;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .preview-filesize {
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-muted);
        }

        .btn-remove-media {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .btn-remove-media:hover {
            background: rgba(239, 68, 68, 0.25);
            border-color: rgba(239, 68, 68, 0.5);
            color: #F87171;
            transform: scale(1.1);
        }

        .btn-remove-media svg {
            width: 14px;
            height: 14px;
        }

        /* Main Chat Input Bar */
        .chat-input-bar {
            position: relative;
            display: flex;
            align-items: center;
            height: 56px;
            padding: 4px 6px 4px 14px;
            gap: 8px;
            background: var(--glass-card);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border-radius: 28px;
            border: 1px solid transparent;
            border-top-color: var(--glass-border-top);
            border-left-color: var(--glass-border-side);
            border-right-color: var(--glass-border-side);
            border-bottom-color: var(--glass-border-bottom);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            overflow: hidden;
            width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .chat-input-bar:focus-within {
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2), 0 10px 36px rgba(0, 0, 0, 0.6);
        }

        .chat-input {
            position: relative;
            z-index: 1;
            flex: 1;
            width: 0;
            min-width: 0;
            background: transparent;
            border: none;
            outline: none;
            color: #FFFFFF;
            font-size: 14px;
            font-family: inherit;
            padding: 0 4px;
        }

        .chat-input::placeholder {
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .icon-btn {
            position: relative;
            z-index: 1;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.10);
            color: var(--text-secondary);
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #FFFFFF;
            transform: scale(1.05);
        }

        .icon-btn.active {
            background: rgba(56, 189, 248, 0.2);
            border-color: rgba(56, 189, 248, 0.5);
            color: var(--accent-cyan);
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
            stroke-width: 1.5px;
        }

        .send-btn {
            background: linear-gradient(135deg, var(--accent-blue-1) 0%, var(--accent-blue-2) 60%, var(--accent-blue-3) 100%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #FFFFFF;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.45);
        }

        .send-btn:hover {
            box-shadow: 0 6px 22px rgba(56, 189, 248, 0.6);
            transform: translateY(-1px) scale(1.05);
        }

        /* Glass Toast Notification */
        .toast-notification {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 10px 20px;
            border-radius: 20px;
            color: #FFFFFF;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s var(--ease-spring);
            z-index: 1000;
        }

        .toast-notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .toast-notification svg {
            width: 16px;
            height: 16px;
            color: var(--accent-cyan);
        }
    </style>
</head>
<body>

    <div class="chat-bar-wrapper">
        <!-- Media Upload Preview Container (Above Input) -->
        <div class="upload-preview-area" id="uploadPreviewArea">
            <div class="preview-thumb-box" id="previewThumbBox">
                <i data-lucide="file-text"></i>
            </div>
            <div class="preview-meta">
                <span class="preview-filename" id="previewFilename">image_upload.png</span>
                <span class="preview-filesize" id="previewFilesize">1.4 MB</span>
            </div>
            <button type="button" class="btn-remove-media" onclick="removeUploadedMedia()" title="Hapus media">
                <i data-lucide="x"></i>
            </button>
        </div>

        <!-- Chat Form -->
        <form class="chat-input-bar" id="chatForm" onsubmit="handleChatSubmit(event)">
            <!-- Hidden File Input -->
            <input type="file" id="chatFileInput" accept="image/*,.pdf,.doc,.docx,.txt" style="display: none;" onchange="handleFileSelected(this)">

            <button type="button" class="icon-btn" id="attachBtn" onclick="triggerFileInput()" title="Lampirkan berkas (gambar, dokumen)">
                <i data-lucide="plus"></i>
            </button>

            <input type="text" id="chatInput" class="chat-input" placeholder="Tanyakan apapun. Gambar dan dokumen didukung..." autocomplete="off">

            <button type="button" class="icon-btn" id="micBtn" onclick="toggleMic()" title="Dikte suara">
                <i data-lucide="mic"></i>
            </button>

            <button type="submit" class="icon-btn send-btn" title="Kirim pesan">
                <i data-lucide="arrow-up"></i>
            </button>
        </form>
    </div>

    <div class="toast-notification" id="toastBox">
        <i data-lucide="check-circle-2"></i>
        <span id="toastText">Pesan terkirim!</span>
    </div>

    <script>
        lucide.createIcons();

        let currentUploadedFile = null;

        function triggerFileInput() {
            document.getElementById('chatFileInput').click();
        }

        function handleFileSelected(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                currentUploadedFile = file;

                const previewArea = document.getElementById('uploadPreviewArea');
                const thumbBox = document.getElementById('previewThumbBox');
                const nameEl = document.getElementById('previewFilename');
                const sizeEl = document.getElementById('previewFilesize');

                nameEl.textContent = file.name;
                const sizeKb = (file.size / 1024).toFixed(1);
                sizeEl.textContent = sizeKb > 1024 ? `${(sizeKb / 1024).toFixed(2)} MB` : `${sizeKb} KB`;

                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        thumbBox.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                    };
                    reader.readAsDataURL(file);
                } else {
                    thumbBox.innerHTML = `<i data-lucide="file-text"></i>`;
                    lucide.createIcons();
                }

                previewArea.classList.add('active');
                document.getElementById('attachBtn').classList.add('active');
            }
        }

        function removeUploadedMedia() {
            currentUploadedFile = null;
            document.getElementById('chatFileInput').value = '';
            document.getElementById('uploadPreviewArea').classList.remove('active');
            document.getElementById('attachBtn').classList.remove('active');
        }

        function handleChatSubmit(e) {
            e.preventDefault();
            const input = document.getElementById('chatInput');
            const text = input.value.trim();

            if (!text && !currentUploadedFile) {
                showToast('Ketik pesan atau lampirkan berkas terlebih dahulu.', 'alert-circle');
                return;
            }

            const sentMsg = currentUploadedFile ? `Terkirim: "${text || currentUploadedFile.name}" dengan 1 berkas` : `Terkirim: "${text}"`;
            showToast(sentMsg, 'check-circle-2');

            // Reset input and media preview
            input.value = '';
            removeUploadedMedia();
        }

        let isRecording = false;
        function toggleMic() {
            isRecording = !isRecording;
            const micBtn = document.getElementById('micBtn');
            if (isRecording) {
                micBtn.classList.add('active');
                showToast('Mendengarkan suara...', 'mic');
            } else {
                micBtn.classList.remove('active');
                showToast('Perekaman selesai.', 'check');
            }
        }

        let toastTimer = null;
        function showToast(msg, iconName = 'check-circle-2') {
            const toast = document.getElementById('toastBox');
            const text = document.getElementById('toastText');
            text.textContent = msg;

            toast.querySelector('svg')?.remove();
            const icon = document.createElement('i');
            icon.setAttribute('data-lucide', iconName);
            toast.prepend(icon);
            lucide.createIcons();

            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>

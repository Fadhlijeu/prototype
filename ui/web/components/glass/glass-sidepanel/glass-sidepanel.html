<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Sidepanel / Sidebar — Glass Dark Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
        <!-- Shared Glass Design System Tokens & White/Blob Themes -->
    <link rel="stylesheet" href="../css.css">
    <style>
        :root {
            --bg-page: #0A0A0A;
            --glass-card: rgba(255, 255, 255, 0.05);
            --glass-border-top: rgba(255, 255, 255, 0.22);
            --glass-border-side: rgba(255, 255, 255, 0.09);
            --glass-border-bottom: rgba(255, 255, 255, 0.04);
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.65);
            --text-muted: rgba(255, 255, 255, 0.35);
            --accent-blue: #4A7BF7;
            --accent-cyan: #4A9EFF;
            --ease-spring: cubic-bezier(0.34, 1.1, 0.64, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-page);
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        /* Sidepanel Container */
        .sidepanel-wrapper {
            position: relative;
            width: 300px;
            height: 680px;
            border-radius: 28px;
            background: var(--glass-card);
            backdrop-filter: blur(30px) saturate(160%);
            -webkit-backdrop-filter: blur(30px) saturate(160%);
            border: 1px solid transparent;
            border-top-color: var(--glass-border-top);
            border-left-color: var(--glass-border-side);
            border-right-color: var(--glass-border-side);
            border-bottom-color: var(--glass-border-bottom);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            padding: 24px 18px;
            overflow: hidden;
        }

        /* Layer 1: Noise Texture Overlay */
        .sidepanel-wrapper::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.04;
            mix-blend-mode: overlay;
            pointer-events: none;
            z-index: 0;
        }

        /* Ambient Glow Blob behind Sidebar */
        .sidepanel-glow {
            position: absolute;
            top: -40px; left: -40px;
            width: 160px; height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(74, 123, 247, 0.3) 0%, transparent 70%);
            filter: blur(40px);
            pointer-events: none;
            z-index: 0;
        }

        /* Brand Header */
        .brand-header {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .brand-icon {
            width: 38px; height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(74, 123, 247, 0.6), rgba(157, 78, 221, 0.5));
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-icon svg { width: 20px; height: 20px; stroke-width: 1.5px; color: var(--text-primary); }

        .brand-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .brand-title span { color: var(--accent-cyan); }

        .live-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #4ADE80;
            box-shadow: 0 0 8px #4ADE80;
            display: inline-block;
            margin-right: 4px;
        }

        /* Quick Search Bar */
        .search-wrap {
            position: relative;
            z-index: 1;
            margin: 16px 0 12px;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 8px 12px;
            gap: 8px;
        }

        .search-wrap svg { width: 16px; height: 16px; stroke-width: 1.5px; color: var(--text-muted); }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 13px;
            font-family: inherit;
        }

        .search-input::placeholder { color: var(--text-muted); }

        /* Menu Groups */
        .menu-list {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
            scrollbar-width: none;
            margin: 8px 0;
        }

        .menu-list::-webkit-scrollbar { display: none; }

        .section-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            padding: 10px 12px 6px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 14px;
            color: var(--text-secondary);
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .menu-item.active {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .item-left svg {
            width: 18px; height: 18px;
            stroke-width: 1.5px;
        }

        .menu-item.active .item-left svg { color: var(--accent-cyan); }

        .item-badge {
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
        }

        /* Storage Mini Meter */
        .storage-footer {
            position: relative;
            z-index: 1;
            padding: 16px 14px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-top: auto;
        }

        .storage-text {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .storage-text strong { color: var(--text-primary); }

        .meter-track {
            width: 100%; height: 6px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 3px;
            overflow: hidden;
        }

        .meter-fill {
            height: 100%; width: 55%;
            background: linear-gradient(90deg, #4A7BF7, #4A9EFF);
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <aside class="sidepanel-wrapper" role="navigation" aria-label="Main Sidepanel">
        <div class="sidepanel-glow"></div>

        <div class="brand-header">
            <div class="brand-icon">
                <i data-lucide="shield"></i>
            </div>
            <div>
                <div class="brand-title">Glass<span>OS</span></div>
                <div style="font-size: 11px; color: var(--text-secondary);"><span class="live-dot"></span> Online Workspace</div>
            </div>
        </div>

        <div class="search-wrap">
            <i data-lucide="search"></i>
            <input type="text" class="search-input" placeholder="Search spaces & files...">
        </div>

        <div class="menu-list">
            <div class="section-label">Main Workspace</div>
            
            <div class="menu-item active" onclick="activate(this)">
                <div class="item-left">
                    <i data-lucide="layout-grid"></i>
                    <span>Overview</span>
                </div>
            </div>

            <div class="menu-item" onclick="activate(this)">
                <div class="item-left">
                    <i data-lucide="folder"></i>
                    <span>Spaces & Folders</span>
                </div>
                <span class="item-badge">4</span>
            </div>

            <div class="menu-item" onclick="activate(this)">
                <div class="item-left">
                    <i data-lucide="bot"></i>
                    <span>AI Swarm</span>
                </div>
                <span class="item-badge" style="color: #4ADE80;">Live</span>
            </div>

            <div class="section-label">System & Tools</div>

            <div class="menu-item" onclick="activate(this)">
                <div class="item-left">
                    <i data-lucide="bar-chart-2"></i>
                    <span>Telemetry</span>
                </div>
            </div>

            <div class="menu-item" onclick="activate(this)">
                <div class="item-left">
                    <i data-lucide="sparkles"></i>
                    <span>Memory Cleaner</span>
                </div>
                <span class="item-badge" style="color: #F87171;">2.4G</span>
            </div>

            <div class="menu-item" onclick="activate(this)">
                <div class="item-left">
                    <i data-lucide="settings"></i>
                    <span>Settings</span>
                </div>
            </div>
        </div>

        <div class="storage-footer">
            <div class="storage-text">
                <span>Storage</span>
                <strong>70.1 GB / 128 TB</strong>
            </div>
            <div class="meter-track">
                <div class="meter-fill"></div>
            </div>
        </div>
    </aside>

    <script>
        lucide.createIcons();
        function activate(el) {
            document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        }
    </script>
</body>
</html>

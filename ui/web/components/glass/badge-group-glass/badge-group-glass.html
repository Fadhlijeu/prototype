<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Glass Filter Tag Cloud — Glass Dark Standalone</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css.css">
    <style>

:root {
    --bg-page: #08080C;
    --glass-card: rgba(255, 255, 255, 0.06);
    --glass-border-top: rgba(255, 255, 255, 0.24);
    --glass-border-side: rgba(255, 255, 255, 0.10);
    --glass-border-bottom: rgba(255, 255, 255, 0.04);
    --text-primary: #FFFFFF;
    --text-secondary: rgba(255, 255, 255, 0.65);
    --text-muted: rgba(255, 255, 255, 0.38);
    --accent-cyan: #38BDF8;
    --ease-spring: cubic-bezier(0.34, 1.25, 0.64, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background-color: var(--bg-page);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.glass-tag-cloud-card {
    width: 100%;
    max-width: 410px;
    background: var(--glass-card);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border-radius: 24px;
    border: 1px solid transparent;
    border-top-color: var(--glass-border-top);
    border-left-color: var(--glass-border-side);
    border-right-color: var(--glass-border-side);
    border-bottom-color: var(--glass-border-bottom);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.tag-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.tag-header-left {
    display: flex;
    align-items: center;
    gap: 8px;
}

.tag-header-left svg { width: 18px; height: 18px; color: var(--accent-cyan); }
.tag-header-left h3 { font-size: 14.5px; font-weight: 700; color: #FFFFFF; }

.tag-counter {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
}

.tag-cloud-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 90px;
}

.glass-tag {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
}

.glass-tag:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #FFFFFF;
}

.glass-tag.active {
    background: rgba(56, 189, 248, 0.18);
    border-color: rgba(56, 189, 248, 0.4);
    color: #FFFFFF;
    font-weight: 600;
}

.tag-glow-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
}

.tag-glow-dot.green { background: #10B981; box-shadow: 0 0 8px #10B981; }
.tag-glow-dot.cyan { background: #38BDF8; box-shadow: 0 0 8px #38BDF8; }
.tag-glow-dot.purple { background: #C084FC; box-shadow: 0 0 8px #C084FC; }
.tag-glow-dot.amber { background: #FBBF24; box-shadow: 0 0 8px #FBBF24; }
.tag-glow-dot.blue { background: #60A5FA; box-shadow: 0 0 8px #60A5FA; }

.btn-remove-tag {
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1px;
    margin-left: 2px;
    transition: color 0.15s;
}

.btn-remove-tag:hover { color: #EF4444; }
.btn-remove-tag svg { width: 13px; height: 13px; }

.add-tag-box {
    display: flex;
    gap: 8px;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 5px 6px 5px 12px;
}

.add-tag-box input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-size: 12px;
    color: #FFFFFF;
    font-family: inherit;
}

.add-tag-box input::placeholder {
    color: var(--text-muted);
}

.btn-add-tag-action {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 11.5px;
    font-weight: 600;
    background: rgba(56, 189, 248, 0.2);
    border: 1px solid rgba(56, 189, 248, 0.35);
    color: #38BDF8;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-add-tag-action:hover {
    background: rgba(56, 189, 248, 0.35);
    color: #FFFFFF;
}

.btn-add-tag-action svg { width: 13px; height: 13px; }

    </style>
</head>
<body>

    <div class="glass-tag-cloud-card">
        <div class="tag-header">
            <div class="tag-header-left">
                <i data-lucide="tags"></i>
                <h3>Telemetry Signal Tags</h3>
            </div>
            <span class="tag-counter" id="activeCount">5 Active</span>
        </div>

        <!-- Tag Cloud Area -->
        <div class="tag-cloud-wrap" id="tagCloud">
            <span class="glass-tag active" data-name="Production Enclave">
                <span class="tag-glow-dot green"></span>
                <span class="tag-name">Production Enclave</span>
                <button type="button" class="btn-remove-tag"><i data-lucide="x"></i></button>
            </span>
            <span class="glass-tag active" data-name="Sub-15ms Latency">
                <span class="tag-glow-dot cyan"></span>
                <span class="tag-name">Sub-15ms Latency</span>
                <button type="button" class="btn-remove-tag"><i data-lucide="x"></i></button>
            </span>
            <span class="glass-tag active" data-name="ZK Attested">
                <span class="tag-glow-dot purple"></span>
                <span class="tag-name">ZK Attested</span>
                <button type="button" class="btn-remove-tag"><i data-lucide="x"></i></button>
            </span>
            <span class="glass-tag" data-name="WASM Runtime">
                <span class="tag-glow-dot amber"></span>
                <span class="tag-name">WASM Runtime</span>
                <button type="button" class="btn-remove-tag"><i data-lucide="x"></i></button>
            </span>
            <span class="glass-tag" data-name="FlashAttention-3">
                <span class="tag-glow-dot blue"></span>
                <span class="tag-name">FlashAttention-3</span>
                <button type="button" class="btn-remove-tag"><i data-lucide="x"></i></button>
            </span>
        </div>

        <!-- Add Custom Tag Input -->
        <div class="add-tag-box">
            <input type="text" id="newTagInput" placeholder="Add custom filter tag (Press Enter)...">
            <button type="button" class="btn-add-tag-action" id="btnAddTag">
                <i data-lucide="plus"></i> Add
            </button>
        </div>
    </div>

    <script>

const tagCloud = document.getElementById('tagCloud');
const input = document.getElementById('newTagInput');
const btnAdd = document.getElementById('btnAddTag');
const counter = document.getElementById('activeCount');

function updateCounter() {
    const active = tagCloud.querySelectorAll('.glass-tag.active').length;
    counter.textContent = `${active} Active`;
}

function bindTagEvents(tag) {
    tag.addEventListener('click', (e) => {
        if (e.target.closest('.btn-remove-tag')) {
            tag.remove();
            updateCounter();
            return;
        }
        tag.classList.toggle('active');
        updateCounter();
    });
}

document.querySelectorAll('.glass-tag').forEach(bindTagEvents);

function addTag() {
    const val = input.value.trim();
    if (!val) return;
    const span = document.createElement('span');
    span.className = 'glass-tag active';
    span.dataset.name = val;
    span.innerHTML = `
        <span class="tag-glow-dot cyan"></span>
        <span class="tag-name">${val}</span>
        <button type="button" class="btn-remove-tag"><i data-lucide="x"></i></button>
    `;
    tagCloud.appendChild(span);
    bindTagEvents(span);
    input.value = '';
    if (window.lucide) lucide.createIcons();
    updateCounter();
}

btnAdd.addEventListener('click', addTag);
input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTag();
});

        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>

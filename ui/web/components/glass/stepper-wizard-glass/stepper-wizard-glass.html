<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Glass Progression Wizard — Glass Dark Standalone</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css.css">
    <style>

:root {
    --bg-page: #08080C;
    --glass-card: rgba(255, 255, 255, 0.06);
    --glass-border-top: rgba(255, 255, 255, 0.24);
    --glass-border-side: rgba(255, 255, 255, 0.10);
    --glass-border-bottom: rgba(255, 255, 255, 0.04);
    --text-primary: #FFFFFF;
    --text-secondary: rgba(255, 255, 255, 0.65);
    --text-muted: rgba(255, 255, 255, 0.38);
    --accent-cyan: #38BDF8;
    --ease-spring: cubic-bezier(0.34, 1.25, 0.64, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background-color: var(--bg-page);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.glass-wizard-card {
    width: 100%;
    max-width: 440px;
    background: var(--glass-card);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border-radius: 24px;
    border: 1px solid transparent;
    border-top-color: var(--glass-border-top);
    border-left-color: var(--glass-border-side);
    border-right-color: var(--glass-border-side);
    border-bottom-color: var(--glass-border-bottom);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.wizard-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
}

.wizard-badge {
    font-size: 10px;
    font-weight: 700;
    color: var(--accent-cyan);
    letter-spacing: 0.08em;
}

.wizard-title-block h3 {
    font-size: 16.5px;
    font-weight: 700;
    color: #FFFFFF;
    margin-top: 2px;
}

.step-indicator {
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-muted);
}

.stepper-track-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 0 12px;
}

.stepper-line-bg {
    position: absolute;
    left: 24px;
    right: 24px;
    height: 3px;
    background: rgba(255, 255, 255, 0.08);
    z-index: 1;
}

.stepper-line-fill {
    position: absolute;
    left: 24px;
    height: 3px;
    background: linear-gradient(90deg, #38BDF8, #818CF8);
    z-index: 2;
    transition: width 0.35s var(--ease-spring);
}

.step-node {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
}

.node-circle {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #111118;
    border: 1.5px solid rgba(255, 255, 255, 0.15);
    color: var(--text-muted);
    font-size: 11.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s;
}

.step-node.active .node-circle {
    background: #0284C7;
    border-color: #38BDF8;
    color: #FFFFFF;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
}

.step-node.completed .node-circle {
    background: #10B981;
    border-color: #10B981;
    color: #FFFFFF;
}

.node-label {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-muted);
    white-space: nowrap;
}

.step-node.active .node-label {
    color: #FFFFFF;
}

.step-content-box {
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.step-content-box h4 {
    font-size: 13.5px;
    font-weight: 600;
    color: #FFFFFF;
}

.step-content-box p {
    font-size: 11.5px;
    color: var(--text-secondary);
    line-height: 1.4;
}

.step-sample-select {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 4px;
}

.radio-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    font-size: 11.5px;
    color: var(--text-secondary);
    cursor: pointer;
}

.radio-pill.active {
    background: rgba(56, 189, 248, 0.15);
    border-color: rgba(56, 189, 248, 0.4);
    color: #FFFFFF;
}

.radio-pill svg { width: 14px; height: 14px; color: var(--accent-cyan); }

.wizard-footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.btn-step-nav {
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-step-nav.prev {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-secondary);
}

.btn-step-nav.prev:disabled {
    opacity: 0.3;
    pointer-events: none;
}

.btn-step-nav.next {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, #0284C7, #38BDF8);
    border: none;
    color: #FFFFFF;
    box-shadow: 0 4px 14px rgba(56, 189, 248, 0.35);
}

.btn-step-nav.next svg { width: 14px; height: 14px; }

    </style>
</head>
<body>

    <div class="glass-wizard-card">
        <div class="wizard-header">
            <div class="wizard-title-block">
                <span class="wizard-badge">PIPELINE PROVISIONING</span>
                <h3>Node Setup Wizard</h3>
            </div>
            <span class="step-indicator" id="stepCounter">Step 1 of 4</span>
        </div>

        <!-- Stepper Nodes Bar -->
        <div class="stepper-track-wrap">
            <div class="stepper-line-bg"></div>
            <div class="stepper-line-fill" id="stepperLineFill" style="width: 0%;"></div>
            
            <div class="step-node active" data-step="1">
                <div class="node-circle">1</div>
                <span class="node-label">Cluster</span>
            </div>
            <div class="step-node" data-step="2">
                <div class="node-circle">2</div>
                <span class="node-label">Enclave</span>
            </div>
            <div class="step-node" data-step="3">
                <div class="node-circle">3</div>
                <span class="node-label">Models</span>
            </div>
            <div class="step-node" data-step="4">
                <div class="node-circle">4</div>
                <span class="node-label">Launch</span>
            </div>
        </div>

        <!-- Dynamic Step Content Card -->
        <div class="step-content-box" id="stepContent">
            <h4 id="stepHeading">Select Regional Compute Cluster</h4>
            <p id="stepDesc">Choose the low-latency GPU edge datacenter closest to your primary inference pipeline.</p>
            <div class="step-sample-select">
                <div class="radio-pill active"><i data-lucide="server"></i> ap-southeast-1 (Singapore)</div>
                <div class="radio-pill"><i data-lucide="server"></i> ap-northeast-1 (Tokyo)</div>
            </div>
        </div>

        <!-- Wizard Navigation Footer -->
        <div class="wizard-footer-row">
            <button type="button" class="btn-step-nav prev" id="btnPrevStep" disabled>Previous</button>
            <button type="button" class="btn-step-nav next" id="btnNextStep">Continue Step <i data-lucide="arrow-right"></i></button>
        </div>
    </div>

    <script>

let curStep = 1;
const totalSteps = 4;

const stepsData = {
    1: {
        heading: 'Select Regional Compute Cluster',
        desc: 'Choose the low-latency GPU edge datacenter closest to your primary inference pipeline.',
        pills: ['ap-southeast-1 (Singapore)', 'ap-northeast-1 (Tokyo)']
    },
    2: {
        heading: 'Configure Enclave Security Parameters',
        desc: 'Enable hardware cryptographic memory encryption and zero-knowledge TLS attestation.',
        pills: ['AMD SEV-SNP Isolation (Strict)', 'Intel TDX Confidential VM']
    },
    3: {
        heading: 'Deploy Quantized Foundation Models',
        desc: 'Mount optimized neural weights onto PagedAttention high-throughput memory buffers.',
        pills: ['Llama-3-8B-Instruct (FP8)', 'Qwen-2.5-Coder-32B (Q4_K_M)']
    },
    4: {
        heading: 'Final Confirmation & Instant Spin-up',
        desc: 'Review pipeline architecture topology and launch autonomous agent execution.',
        pills: ['Execute Cluster Provisioning', 'Export Terraform Config']
    }
};

function updateWizard() {
    document.getElementById('stepCounter').textContent = `Step ${curStep} of ${totalSteps}`;
    const fillPct = ((curStep - 1) / (totalSteps - 1)) * 100;
    document.getElementById('stepperLineFill').style.width = `${fillPct}%`;

    document.querySelectorAll('.step-node').forEach((node, idx) => {
        const stepNum = idx + 1;
        node.classList.remove('active', 'completed');
        if (stepNum === curStep) {
            node.classList.add('active');
        } else if (stepNum < curStep) {
            node.classList.add('completed');
        }
    });

    const data = stepsData[curStep];
    document.getElementById('stepHeading').textContent = data.heading;
    document.getElementById('stepDesc').textContent = data.desc;
    
    const pillsWrap = document.querySelector('.step-sample-select');
    pillsWrap.innerHTML = data.pills.map((p, i) => `
        <div class="radio-pill ${i === 0 ? 'active' : ''}">
            <i data-lucide="server"></i> ${p}
        </div>
    `).join('');
    if (window.lucide) lucide.createIcons();

    document.getElementById('btnPrevStep').disabled = (curStep === 1);
    document.getElementById('btnNextStep').innerHTML = (curStep === totalSteps)
        ? 'Deploy Pipeline <i data-lucide="rocket"></i>'
        : 'Continue Step <i data-lucide="arrow-right"></i>';
    if (window.lucide) lucide.createIcons();
}

document.getElementById('btnNextStep').addEventListener('click', () => {
    if (curStep < totalSteps) {
        curStep++;
        updateWizard();
    } else {
        alert('Enclave Provisioning Initiated Successfully!');
    }
});

document.getElementById('btnPrevStep').addEventListener('click', () => {
    if (curStep > 1) {
        curStep--;
        updateWizard();
    }
});

        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>

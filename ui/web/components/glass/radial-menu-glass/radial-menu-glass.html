<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blooming Orbital Radial Glass FAB — Glass Dark Standalone</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css.css">
    <style>

:root {
    --bg-page: #08080C;
    --glass-card: rgba(255, 255, 255, 0.06);
    --glass-border-top: rgba(255, 255, 255, 0.24);
    --glass-border-side: rgba(255, 255, 255, 0.10);
    --glass-border-bottom: rgba(255, 255, 255, 0.04);
    --text-primary: #FFFFFF;
    --text-secondary: rgba(255, 255, 255, 0.65);
    --text-muted: rgba(255, 255, 255, 0.38);
    --accent-cyan: #38BDF8;
    --ease-spring: cubic-bezier(0.34, 1.35, 0.64, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background-color: var(--bg-page);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.glass-radial-menu-stage {
    width: 100%;
    max-width: 380px;
    height: 380px;
    background: var(--glass-card);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border-radius: 28px;
    border: 1px solid transparent;
    border-top-color: var(--glass-border-top);
    border-left-color: var(--glass-border-side);
    border-right-color: var(--glass-border-side);
    border-bottom-color: var(--glass-border-bottom);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 20px;
    position: relative;
    overflow: hidden;
}

.radial-orbit-container {
    position: relative;
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: auto;
}

.radial-fab-center {
    position: relative;
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.3) 0%, rgba(168, 85, 247, 0.25) 100%);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 8px 28px rgba(56, 189, 248, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.4);
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 20;
    transition: transform 0.25s var(--ease-spring);
}

.radial-fab-center:hover {
    transform: scale(1.08);
}

.fab-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s var(--ease-spring);
}

.fab-icon svg { width: 28px; height: 28px; }

.radial-orbit-container.open .fab-icon {
    transform: rotate(135deg);
}

.radial-satellite {
    position: absolute;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    opacity: 0;
    pointer-events: none;
    transform: translate(0, 0) scale(0.4);
    transition: transform 0.35s var(--ease-spring), opacity 0.25s, background-color 0.2s;
    z-index: 15;
}

.radial-satellite svg { width: 20px; height: 20px; color: var(--accent-cyan); }

.radial-satellite:hover {
    background: rgba(56, 189, 248, 0.25);
    border-color: var(--accent-cyan);
    transform: scale(1.15) !important;
}

.sat-tooltip {
    position: absolute;
    bottom: -24px;
    font-size: 10px;
    font-weight: 700;
    white-space: nowrap;
    background: rgba(0, 0, 0, 0.85);
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
}

.radial-satellite:hover .sat-tooltip {
    opacity: 1;
}

.radial-selected-toast {
    font-size: 11.5px;
    color: var(--text-secondary);
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 6px 16px;
    border-radius: 999px;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    z-index: 10;
}

.radial-selected-toast.visible {
    opacity: 1;
    transform: translateY(0);
}

.radial-selected-toast strong { color: var(--accent-cyan); }

    </style>
</head>
<body>

    <div class="glass-radial-menu-stage" id="radialStage">
        <!-- Central Radial Hub Container -->
        <div class="radial-orbit-container">
            <!-- Satellite 1: Search -->
            <button type="button" class="radial-satellite" data-angle="210" data-label="Deep Search" id="sat1">
                <i data-lucide="search"></i>
                <span class="sat-tooltip">Deep Search</span>
            </button>
            <!-- Satellite 2: Bookmark -->
            <button type="button" class="radial-satellite" data-angle="255" data-label="Save Prompt" id="sat2">
                <i data-lucide="bookmark"></i>
                <span class="sat-tooltip">Save Prompt</span>
            </button>
            <!-- Satellite 3: Analytics -->
            <button type="button" class="radial-satellite" data-angle="300" data-label="Telemetry" id="sat3">
                <i data-lucide="activity"></i>
                <span class="sat-tooltip">Telemetry</span>
            </button>
            <!-- Satellite 4: Code Export -->
            <button type="button" class="radial-satellite" data-angle="345" data-label="Export API" id="sat4">
                <i data-lucide="code-2"></i>
                <span class="sat-tooltip">Export API</span>
            </button>
            <!-- Satellite 5: Share Link -->
            <button type="button" class="radial-satellite" data-angle="30" data-label="Share Enclave" id="sat5">
                <i data-lucide="share-2"></i>
                <span class="sat-tooltip">Share Enclave</span>
            </button>

            <!-- Center Bloom FAB -->
            <button type="button" class="radial-fab-center" id="btnRadialCenter" aria-label="Toggle Radial Actions">
                <div class="fab-halo"></div>
                <div class="fab-icon" id="fabIcon">
                    <i data-lucide="plus"></i>
                </div>
            </button>
        </div>

        <div class="radial-selected-toast" id="radialToast">
            Action: <strong>Deep Search</strong> initiated
        </div>
    </div>

    <script>

const fab = document.getElementById('btnRadialCenter');
const container = document.querySelector('.radial-orbit-container');
const toast = document.getElementById('radialToast');
const satellites = document.querySelectorAll('.radial-satellite');

let isOpen = false;
const radius = 95; // px distance from center

function toggleRadial() {
    isOpen = !isOpen;
    container.classList.toggle('open', isOpen);

    satellites.forEach((sat, idx) => {
        if (isOpen) {
            const angle = parseInt(sat.dataset.angle) * (Math.PI / 180);
            const x = Math.cos(angle) * radius;
            const y = Math.sin(angle) * radius;
            
            setTimeout(() => {
                sat.style.opacity = '1';
                sat.style.pointerEvents = 'auto';
                sat.style.transform = `translate(${x}px, ${y}px) scale(1)`;
            }, idx * 40);
        } else {
            sat.style.opacity = '0';
            sat.style.pointerEvents = 'none';
            sat.style.transform = 'translate(0, 0) scale(0.4)';
        }
    });
}

fab.addEventListener('click', toggleRadial);

satellites.forEach(sat => {
    sat.addEventListener('click', () => {
        const label = sat.dataset.label;
        toast.innerHTML = `Action: <strong>${label}</strong> triggered`;
        toast.classList.add('visible');
        setTimeout(() => toast.classList.remove('visible'), 2400);
        toggleRadial();
    });
});

        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>

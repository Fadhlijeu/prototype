<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Buttons Collection — Glass Dark Premium (All-in-One)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
        <!-- Shared Glass Design System Tokens & White/Blob Themes -->
    <link rel="stylesheet" href="../css.css">
    <style>
:root {
    --bg-page: #08080C;
    --glass-card: rgba(255, 255, 255, 0.06);
    --glass-card-hover: rgba(255, 255, 255, 0.09);
    --glass-border-top: rgba(255, 255, 255, 0.24);
    --glass-border-side: rgba(255, 255, 255, 0.10);
    --glass-border-bottom: rgba(255, 255, 255, 0.04);
    --text-primary: #FFFFFF;
    --text-secondary: rgba(255, 255, 255, 0.65);
    --text-muted: rgba(255, 255, 255, 0.38);
    --accent-cyan: #4A9EFF;
    --accent-blue-1: #4A7BF7;
    --accent-blue-2: #2E5FD9;
    --accent-blue-3: #1E3A8A;
    --accent-green: #10B981;
    --accent-amber: #F59E0B;
    --accent-red: #EF4444;
    --ease-spring: cubic-bezier(0.34, 1.15, 0.64, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background-color: var(--bg-page);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text-primary);
}


body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
}

.btn-showcase-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: center;
    max-width: 480px;
}

.btn-glass {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 14px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.22s var(--ease-spring);
    border: 1px solid transparent;
    user-select: none;
}

.btn-glass::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    opacity: 0.04;
    mix-blend-mode: overlay;
    pointer-events: none;
}

.btn-primary-glass {
    background: linear-gradient(135deg, #4A7BF7 0%, #2E5FD9 50%, #1E3A8A 100%);
    border-top-color: var(--text-muted);
    border-left-color: rgba(255, 255, 255, 0.15);
    border-right-color: rgba(255, 255, 255, 0.15);
    border-bottom-color: rgba(0, 0, 0, 0.3);
    color: var(--text-primary);
    box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.25);
}

.btn-primary-glass:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 26px rgba(59, 130, 246, 0.5);
}

.btn-secondary-glass {
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(20px);
    border-top-color: var(--glass-border-top);
    border-left-color: var(--glass-border-side);
    border-right-color: var(--glass-border-side);
    border-bottom-color: var(--glass-border-bottom);
    color: var(--text-primary);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
}

.btn-secondary-glass:hover {
    background: rgba(255, 255, 255, 0.12);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
}

.btn-ghost-glass {
    background: transparent;
    color: var(--text-secondary);
    border-color: transparent;
}

.btn-ghost-glass:hover {
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-primary);
}

.btn-danger-glass {
    background: rgba(239, 68, 68, 0.15);
    backdrop-filter: blur(16px);
    border-top-color: rgba(239, 68, 68, 0.4);
    border-left-color: rgba(239, 68, 68, 0.2);
    border-right-color: rgba(239, 68, 68, 0.2);
    border-bottom-color: rgba(239, 68, 68, 0.1);
    color: #F87171;
    box-shadow: 0 4px 14px rgba(239, 68, 68, 0.2);
}

.btn-danger-glass:hover {
    background: rgba(239, 68, 68, 0.25);
    transform: translateY(-2px);
}

.btn-glass:active {
    transform: scale(0.96);
}

.btn-glass svg {
    width: 16px; height: 16px; stroke-width: 1.5px;
}

    </style>
</head>
<body>

    <div class="btn-showcase-wrap">
        <button type="button" class="btn-glass btn-primary-glass">
            <i data-lucide="sparkles"></i> Primary Action
        </button>
        <button type="button" class="btn-glass btn-secondary-glass">
            <i data-lucide="download"></i> Secondary
        </button>
        <button type="button" class="btn-glass btn-danger-glass">
            <i data-lucide="trash-2"></i> Delete
        </button>
        <button type="button" class="btn-glass btn-ghost-glass">
            <i data-lucide="x"></i> Ghost
        </button>
    </div>

    <script>
        if (window.lucide) window.lucide.createIcons();
    </script>
    <script>

document.querySelectorAll('.btn-glass').forEach(btn => {
    btn.addEventListener('click', () => {
        btn.style.transform = 'scale(0.94)';
        setTimeout(() => btn.style.transform = '', 150);
    });
});

    </script>
</body>
</html>

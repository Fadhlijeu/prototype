<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form Inputs — Raw Pure HTML (All-in-One)</title>
    <style>
body {
    font-family: system-ui, -apple-system, sans-serif;
    padding: 16px;
    margin: 0;
    line-height: 1.5;
}
    </style>
</head>
<body>
<div style="display: flex; flex-direction: column; gap: 8px; max-width: 320px;">
    <label>Text: <input type="text" placeholder="Text input..."></label>
    <label>Password: <input type="password" placeholder="Password input..."></label>
    <label>Email: <input type="email" placeholder="user@domain.com"></label>
    <label>Number: <input type="number" min="1" max="100" value="25"></label>
    <label>Search: <input type="search" placeholder="Search..."></label>
    <label>File: <input type="file"></label>
</div>
</body>
</html>

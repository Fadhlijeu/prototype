<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox Switch Pattern — Raw Pure HTML (All-in-One)</title>
    <style>
body {
    font-family: system-ui, -apple-system, sans-serif;
    padding: 16px;
    margin: 0;
    line-height: 1.5;
}
    </style>
</head>
<body>
<div>
    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
        <input type="checkbox" role="switch">
        <span>Dark Mode Switch (Native Role Switch)</span>
    </label>
</div>
</body>
</html>

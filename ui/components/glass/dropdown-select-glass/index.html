<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Floating Dropdown — Glass Dark Premium</title>
    <link rel="stylesheet" href="../css.css">
    <link rel="stylesheet" href="index.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="dropdown-wrap" id="drop">
        <button type="button" class="dropdown-trigger" onclick="toggleDropdown()">
            <span id="selectedLabel">Personal Workspace</span>
            <i data-lucide="chevron-down"></i>
        </button>
        <div class="dropdown-menu">
            <div class="dropdown-item selected" onclick="selectOption('Personal Workspace', this)">
                <i data-lucide="user"></i> Personal Workspace
            </div>
            <div class="dropdown-item" onclick="selectOption('Design System Lab', this)">
                <i data-lucide="gem"></i> Design System Lab
            </div>
            <div class="dropdown-item" onclick="selectOption('Cloud File Manager', this)">
                <i data-lucide="folder-kanban"></i> Cloud File Manager
            </div>
            <div class="dropdown-item" onclick="selectOption('Production Archive', this)">
                <i data-lucide="archive"></i> Production Archive
            </div>
        </div>
    </div>

    <script>
        if (window.lucide) window.lucide.createIcons();
    </script>
    <script src="index.js"></script>
</body>
</html>

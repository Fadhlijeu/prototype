<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Floating Dropdown — Glass Dark Premium (All-in-One)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
:root {
    --bg-page: #08080C;
    --glass-card: rgba(255, 255, 255, 0.06);
    --glass-card-hover: rgba(255, 255, 255, 0.09);
    --glass-border-top: rgba(255, 255, 255, 0.24);
    --glass-border-side: rgba(255, 255, 255, 0.10);
    --glass-border-bottom: rgba(255, 255, 255, 0.04);
    --text-primary: #FFFFFF;
    --text-secondary: rgba(255, 255, 255, 0.65);
    --text-muted: rgba(255, 255, 255, 0.38);
    --accent-cyan: #4A9EFF;
    --accent-blue-1: #4A7BF7;
    --accent-blue-2: #2E5FD9;
    --accent-blue-3: #1E3A8A;
    --accent-green: #10B981;
    --accent-amber: #F59E0B;
    --accent-red: #EF4444;
    --ease-spring: cubic-bezier(0.34, 1.15, 0.64, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background-color: var(--bg-page);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text-primary);
}


body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
}

.dropdown-wrap {
    position: relative;
    width: 100%;
    max-width: 320px;
}

.dropdown-trigger {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-radius: 16px;
    background: var(--glass-card);
    backdrop-filter: blur(24px);
    border: 1px solid transparent;
    border-top-color: var(--glass-border-top);
    border-left-color: var(--glass-border-side);
    border-right-color: var(--glass-border-side);
    border-bottom-color: var(--glass-border-bottom);
    color: #FFFFFF;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    transition: all 0.2s ease;
}

.dropdown-trigger svg {
    width: 16px; height: 16px;
    color: var(--text-secondary);
    transition: transform 0.25s var(--ease-spring);
}

.dropdown-menu {
    position: absolute;
    top: calc(100% + 8px);
    left: 0; width: 100%;
    background: rgba(15, 15, 22, 0.85);
    backdrop-filter: blur(28px) saturate(180%);
    border-radius: 18px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
    padding: 6px;
    display: none;
    flex-direction: column;
    gap: 4px;
    z-index: 100;
}

.dropdown-wrap.open .dropdown-menu {
    display: flex;
}

.dropdown-wrap.open .dropdown-trigger svg {
    transform: rotate(180deg);
}

.dropdown-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 12px;
    color: var(--text-secondary);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.18s ease;
}

.dropdown-item:hover {
    background: rgba(255, 255, 255, 0.09);
    color: #FFFFFF;
}

.dropdown-item.selected {
    background: rgba(74, 158, 255, 0.15);
    color: var(--accent-cyan);
    font-weight: 600;
}

.dropdown-item svg {
    width: 16px; height: 16px;
}

    </style>
</head>
<body>

    <div class="dropdown-wrap" id="drop">
        <button type="button" class="dropdown-trigger" onclick="toggleDropdown()">
            <span id="selectedLabel">Glass Dark Premium</span>
            <i data-lucide="chevron-down"></i>
        </button>
        <div class="dropdown-menu">
            <div class="dropdown-item selected" onclick="selectOption('Glass Dark Premium', this)">
                <i data-lucide="gem"></i> Glass Dark Premium
            </div>
            <div class="dropdown-item" onclick="selectOption('Raw Semantic HTML', this)">
                <i data-lucide="code-2"></i> Raw Semantic HTML
            </div>
            <div class="dropdown-item" onclick="selectOption('Neumorphism Soft', this)">
                <i data-lucide="circle-dot"></i> Neumorphism Soft
            </div>
            <div class="dropdown-item" onclick="selectOption('Cyberpunk Neon', this)">
                <i data-lucide="zap"></i> Cyberpunk Neon
            </div>
        </div>
    </div>

    <script>
        if (window.lucide) window.lucide.createIcons();
    </script>
    <script>

function toggleDropdown() {
    document.getElementById('drop').classList.toggle('open');
}

function selectOption(text, el) {
    document.getElementById('selectedLabel').innerText = text;
    document.querySelectorAll('.dropdown-item').forEach(i => i.classList.remove('selected'));
    el.classList.add('selected');
    document.getElementById('drop').classList.remove('open');
}

    </script>
</body>
</html>

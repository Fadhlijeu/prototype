<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Buttons Collection — Glass Dark Premium</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="btn-showcase-wrap">
        <button type="button" class="btn-glass btn-primary-glass">
            <i data-lucide="sparkles"></i> Primary Action
        </button>
        <button type="button" class="btn-glass btn-secondary-glass">
            <i data-lucide="download"></i> Secondary
        </button>
        <button type="button" class="btn-glass btn-danger-glass">
            <i data-lucide="trash-2"></i> Delete
        </button>
        <button type="button" class="btn-glass btn-ghost-glass">
            <i data-lucide="x"></i> Ghost
        </button>
    </div>

    <script>
        if (window.lucide) window.lucide.createIcons();
    </script>
    <script src="index.js"></script>
</body>
</html>

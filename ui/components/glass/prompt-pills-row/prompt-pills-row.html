<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Pills Row — Glass Dark Premium (All-in-One)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-page: #08080C;
            --glass-card: rgba(255, 255, 255, 0.06);
            --glass-border-top: rgba(255, 255, 255, 0.24);
            --glass-border-side: rgba(255, 255, 255, 0.10);
            --glass-border-bottom: rgba(255, 255, 255, 0.04);
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.70);
            --accent-cyan: #4A9EFF;
            --ease-spring: cubic-bezier(0.34, 1.15, 0.64, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-page);
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 12px 14px;
            overflow-x: auto;
        }

        .pills-container {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 8px 4px;
            width: max-content;
            min-width: 100%;
            -webkit-overflow-scrolling: touch;
        }

        .pills-container::-webkit-scrollbar {
            display: none;
        }

        .pill {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            border-radius: 20px;
            background: var(--glass-card);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid transparent;
            border-top-color: var(--glass-border-top);
            border-left-color: var(--glass-border-side);
            border-right-color: var(--glass-border-side);
            border-bottom-color: var(--glass-border-bottom);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.08);
            white-space: nowrap;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.22s var(--ease-spring);
        }

        .pill::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.038;
            mix-blend-mode: overlay;
            pointer-events: none;
            z-index: 0;
        }

        .pill:hover {
            background: rgba(255, 255, 255, 0.12);
            border-top-color: rgba(255, 255, 255, 0.35);
            color: #FFFFFF;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35), 0 0 12px rgba(74, 158, 255, 0.25);
        }

        .pill:active {
            transform: scale(0.96);
        }

        .pill svg {
            width: 16px;
            height: 16px;
            stroke-width: 1.5px;
            color: var(--accent-cyan);
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .pill span {
            position: relative;
            z-index: 1;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="pills-container" role="toolbar" aria-label="Quick Actions">
        <button class="pill" onclick="alert('Action: Slides')">
            <i data-lucide="monitor-play"></i> <span>Slides</span>
        </button>
        <button class="pill" onclick="alert('Action: Swarm')">
            <i data-lucide="bot"></i> <span>Swarm</span>
        </button>
        <button class="pill" onclick="alert('Action: Websites')">
            <i data-lucide="layout-grid"></i> <span>Websites</span>
        </button>
        <button class="pill" onclick="alert('Action: Deep Research')">
            <i data-lucide="microscope"></i> <span>Deep Research</span>
        </button>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>

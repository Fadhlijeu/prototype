<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Pills Row — Glass Dark Premium (All-in-One)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-page: #08080C;
            --glass-card: rgba(255, 255, 255, 0.06);
            --glass-card-hover: rgba(255, 255, 255, 0.12);
            --glass-border-top: rgba(255, 255, 255, 0.24);
            --glass-border-side: rgba(255, 255, 255, 0.10);
            --glass-border-bottom: rgba(255, 255, 255, 0.04);
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.70);
            --accent-cyan: #4A9EFF;
            --ease-spring: cubic-bezier(0.34, 1.15, 0.64, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-page);
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow-x: auto;
        }

        .pills-wrapper {
            position: relative;
            width: 100%;
            max-width: 680px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pills-container {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow-x: auto;
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: rgba(74, 158, 255, 0.4) rgba(255, 255, 255, 0.05);
            padding: 8px 4px 14px;
            width: 100%;
            -webkit-overflow-scrolling: touch;
        }

        /* Glass Horizontal Scrollbar Slider */
        .pills-container::-webkit-scrollbar {
            height: 6px;
        }
        .pills-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 4px;
        }
        .pills-container::-webkit-scrollbar-thumb {
            background: linear-gradient(90deg, rgba(74, 158, 255, 0.45), rgba(139, 92, 246, 0.45));
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .pills-container::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(90deg, rgba(74, 158, 255, 0.8), rgba(139, 92, 246, 0.8));
            box-shadow: 0 0 10px rgba(74, 158, 255, 0.6);
        }

        .pill-nav-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }
        .pill-nav-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            color: #FFFFFF;
            transform: scale(1.08);
        }

        .pill {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            border-radius: 20px;
            background: var(--glass-card);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid transparent;
            border-top-color: var(--glass-border-top);
            border-left-color: var(--glass-border-side);
            border-right-color: var(--glass-border-side);
            border-bottom-color: var(--glass-border-bottom);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.08);
            white-space: nowrap;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.22s var(--ease-spring);
        }

        .pill::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.038;
            mix-blend-mode: overlay;
            pointer-events: none;
            z-index: 0;
        }

        .pill:hover {
            background: var(--glass-card-hover);
            border-top-color: rgba(255, 255, 255, 0.35);
            color: #FFFFFF;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35), 0 0 12px rgba(74, 158, 255, 0.25);
        }

        .pill:active {
            transform: scale(0.96);
        }

        .pill svg {
            width: 15px;
            height: 15px;
            stroke-width: 1.5px;
            color: var(--accent-cyan);
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .pill span {
            position: relative;
            z-index: 1;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="pills-wrapper">
        <button class="pill-nav-btn" onclick="slidePills(-180)" title="Slide Kiri" aria-label="Slide Left">
            <i data-lucide="chevron-left"></i>
        </button>

        <div class="pills-container" id="pillsTrack" role="toolbar" aria-label="Quick Actions">
            <button class="pill" onclick="triggerPill('Slides')">
                <i data-lucide="monitor-play"></i> <span>Slides</span>
            </button>
            <button class="pill" onclick="triggerPill('Swarm')">
                <i data-lucide="bot"></i> <span>Swarm</span>
            </button>
            <button class="pill" onclick="triggerPill('Websites')">
                <i data-lucide="layout-grid"></i> <span>Websites</span>
            </button>
            <button class="pill" onclick="triggerPill('Deep Research')">
                <i data-lucide="microscope"></i> <span>Deep Research</span>
            </button>
            <button class="pill" onclick="triggerPill('Code Synthesizer')">
                <i data-lucide="code-2"></i> <span>Code Synthesizer</span>
            </button>
            <button class="pill" onclick="triggerPill('Audio Visualizer')">
                <i data-lucide="activity"></i> <span>Audio Visualizer</span>
            </button>
            <button class="pill" onclick="triggerPill('Neural Reasoning')">
                <i data-lucide="sparkles"></i> <span>Neural Reasoning</span>
            </button>
        </div>

        <button class="pill-nav-btn" onclick="slidePills(180)" title="Slide Kanan" aria-label="Slide Right">
            <i data-lucide="chevron-right"></i>
        </button>
    </div>

    <script>
        lucide.createIcons();

        function slidePills(delta) {
            const track = document.getElementById('pillsTrack');
            if (track) track.scrollBy({ left: delta, behavior: 'smooth' });
        }

        function triggerPill(action) {
            console.log('Action activated:', action);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Pills Row — Glass Dark Premium</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="pills-container" role="toolbar" aria-label="Quick Actions">
        <button class="pill glass-noise">
            <i data-lucide="monitor-play"></i> <span>Slides</span>
        </button>
        <button class="pill glass-noise">
            <i data-lucide="bot"></i> <span>Swarm</span>
        </button>
        <button class="pill glass-noise">
            <i data-lucide="layout-grid"></i> <span>Websites</span>
        </button>
        <button class="pill glass-noise">
            <i data-lucide="microscope"></i> <span>Deep Research</span>
        </button>
    </div>

    <script src="index.js"></script>
</body>
</html>

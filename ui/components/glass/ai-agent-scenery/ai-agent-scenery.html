<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Scenery — Glass Dark Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-page: #0A0A0A;
            --glass-card: rgba(255, 255, 255, 0.06);
            --glass-border-top: rgba(255, 255, 255, 0.22);
            --glass-border-side: rgba(255, 255, 255, 0.10);
            --glass-border-bottom: rgba(255, 255, 255, 0.04);
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.65);
            --text-muted: rgba(255, 255, 255, 0.35);
            --accent-cyan: #4A9EFF;
            --accent-blue-1: #4A7BF7;
            --accent-blue-2: #2E5FD9;
            --ease-spring: cubic-bezier(0.34, 1.1, 0.64, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-page);
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 12px;
        }

        .scenery-container {
            width: 100%;
            max-width: 440px;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 24px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .icon-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--glass-card);
            backdrop-filter: blur(20px);
            border: 1px solid transparent;
            border-top-color: var(--glass-border-top);
            border-left-color: var(--glass-border-side);
            border-right-color: var(--glass-border-side);
            border-bottom-color: var(--glass-border-bottom);
            color: var(--text-primary);
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            transition: transform 0.2s ease;
        }

        .icon-btn:hover { transform: scale(1.06); }
        .icon-btn svg { width: 18px; height: 18px; stroke-width: 1.5px; }

        /* Main Workspace */
        .main-workspace {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 100%;
        }

        .glow-orb {
            position: absolute;
            width: 160px; height: 120px;
            background: rgba(74, 158, 255, 0.35);
            filter: blur(50px);
            bottom: 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* Glass Selector Card */
        .glass-card {
            position: relative;
            z-index: 1;
            width: 100%;
            border-radius: 26px;
            padding: 6px;
            background: var(--glass-card);
            backdrop-filter: blur(30px) saturate(160%);
            -webkit-backdrop-filter: blur(30px) saturate(160%);
            border: 1px solid transparent;
            border-top-color: var(--glass-border-top);
            border-left-color: var(--glass-border-side);
            border-right-color: var(--glass-border-side);
            border-bottom-color: var(--glass-border-bottom);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        .glass-card::before {
            content: "";
            position: absolute; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.04;
            mix-blend-mode: overlay;
            pointer-events: none;
        }

        .model-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-radius: 18px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .model-item:hover { background: rgba(255, 255, 255, 0.04); }
        .model-item.active { background: rgba(255, 255, 255, 0.08); }

        .model-title { font-size: 14.5px; font-weight: 600; }
        .model-subtitle { font-size: 11.5px; color: var(--text-secondary); margin-top: 2px; }
        .checkmark { color: var(--accent-cyan); width: 18px; height: 18px; stroke-width: 1.5px; opacity: 0; transition: opacity 0.2s; }
        .model-item.active .checkmark { opacity: 1; }

        .divider { height: 1px; background: rgba(255, 255, 255, 0.06); margin: 4px 14px; }

        .effort-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            cursor: pointer;
            border-radius: 18px;
        }

        .effort-row:hover { background: rgba(255, 255, 255, 0.04); }

        .greeting {
            position: relative;
            z-index: 1;
            margin: 20px 0 16px;
            font-size: 16px;
            text-align: center;
            line-height: 1.5;
            color: #D1D1D6;
        }

        /* Bottom Section */
        .bottom-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            z-index: 2;
            width: 100%;
            margin-top: 10px;
        }

        .pills-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            padding: 4px 2px;
            width: 100%;
        }

        .pills-scroll::-webkit-scrollbar { display: none; }

        .pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.09);
            white-space: nowrap;
            color: var(--text-secondary);
            font-size: 12.5px;
            font-weight: 500;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .pill:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #FFFFFF;
            transform: translateY(-1px);
        }

        .pill svg { width: 15px; height: 15px; stroke-width: 1.5px; color: var(--accent-cyan); }

        .chat-bar {
            display: flex;
            align-items: center;
            height: 52px;
            border-radius: 26px;
            padding: 4px 6px 4px 14px;
            gap: 8px;
            background: var(--glass-card);
            backdrop-filter: blur(30px);
            border: 1px solid transparent;
            border-top-color: var(--glass-border-top);
            border-left-color: var(--glass-border-side);
            border-right-color: var(--glass-border-side);
            border-bottom-color: var(--glass-border-bottom);
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
            width: 100%;
        }

        .chat-input {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            outline: none;
            color: #FFFFFF;
            font-size: 13.5px;
        }

        .chat-input::placeholder { color: var(--text-muted); }

        .icon-circle {
            width: 36px; height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #FFFFFF;
            cursor: pointer;
            flex-shrink: 0;
        }

        .icon-circle svg { width: 16px; height: 16px; stroke-width: 1.5px; }

        .send-btn {
            background: linear-gradient(135deg, var(--accent-blue-1), var(--accent-blue-2));
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            border-bottom: 1px solid rgba(0, 0, 0, 0.20);
        }

        @media (max-width: 480px) {
            body {
                padding: 8px;
            }
            .scenery-container {
                max-width: 100%;
            }
            .glass-card {
                border-radius: 20px;
            }
            .model-item {
                padding: 10px 14px;
            }
            .model-title {
                font-size: 13.5px;
            }
            .model-subtitle {
                font-size: 11px;
            }
            .pills-scroll {
                -webkit-overflow-scrolling: touch;
                scroll-snap-type: x mandatory;
            }
            .pill {
                scroll-snap-align: start;
            }
            .chat-bar {
                height: 48px;
                padding: 4px 6px 4px 12px;
            }
            .chat-input {
                min-width: 0;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="scenery-container">
        
        <header class="top-bar">
            <div class="icon-btn"><i data-lucide="menu"></i></div>
            <div class="icon-btn"><i data-lucide="volume-2"></i></div>
        </header>

        <main class="main-workspace">
            <div class="glow-orb"></div>

            <div class="glass-card">
                <div class="model-item" onclick="selectModel(this)">
                    <div>
                        <div class="model-title">K3</div>
                        <div class="model-subtitle">Chat & Agent, flagship all-rounder</div>
                    </div>
                    <i data-lucide="check" class="checkmark"></i>
                </div>

                <div class="model-item" onclick="selectModel(this)">
                    <div>
                        <div class="model-title">K3 Swarm</div>
                        <div class="model-subtitle">Massive search, batch processing</div>
                    </div>
                    <i data-lucide="check" class="checkmark"></i>
                </div>

                <div class="model-item active" onclick="selectModel(this)">
                    <div>
                        <div class="model-title">Instant</div>
                        <div class="model-subtitle">Fast chat, quick replies</div>
                    </div>
                    <i data-lucide="check" class="checkmark"></i>
                </div>

                <div class="divider"></div>

                <div class="effort-row">
                    <div>
                        <div class="model-title">Thinking effort</div>
                        <div class="model-subtitle">Reasoning depth</div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <span style="font-size: 12.5px; color: var(--accent-cyan); font-weight: 500;">High</span>
                        <i data-lucide="chevron-right" style="color: #8E8E93; width: 16px;"></i>
                    </div>
                </div>
            </div>

            <div class="greeting">
                Hi <strong>Muhammad Fadhli</strong>, what would<br>you like to do with GlassOS today?
            </div>
        </main>

        <section class="bottom-section">
            <div class="pills-scroll">
                <button class="pill"><i data-lucide="monitor-play"></i> Slides</button>
                <button class="pill"><i data-lucide="bot"></i> Swarm</button>
                <button class="pill"><i data-lucide="layout-grid"></i> Websites</button>
                <button class="pill"><i data-lucide="microscope"></i> Deep Research</button>
            </div>

            <div class="chat-bar">
                <button class="icon-circle"><i data-lucide="plus"></i></button>
                <input type="text" class="chat-input" placeholder="Ask anything. Images work too...">
                <button class="icon-circle"><i data-lucide="mic"></i></button>
                <button class="icon-circle send-btn"><i data-lucide="arrow-up"></i></button>
            </div>
        </section>

    </div>

    <script>
        lucide.createIcons();
        function selectModel(el) {
            document.querySelectorAll('.model-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        }
    </script>
</body>
</html>

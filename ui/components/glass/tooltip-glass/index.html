<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Micro Tooltip — Glass Dark Premium</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="tooltip-demo-wrap">
        <div class="has-tooltip">
            <button type="button" class="trigger-btn">
                <i data-lucide="share-2"></i>
            </button>
            <div class="glass-tooltip">Share Component</div>
        </div>
        <div class="has-tooltip">
            <button type="button" class="trigger-btn">
                <i data-lucide="heart"></i>
            </button>
            <div class="glass-tooltip">Add to Favorites</div>
        </div>
        <div class="has-tooltip">
            <button type="button" class="trigger-btn">
                <i data-lucide="copy"></i>
            </button>
            <div class="glass-tooltip">Copy Source Code</div>
        </div>
    </div>

    <script>
        if (window.lucide) window.lucide.createIcons();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Input Bar — Glass Dark Premium</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="chat-bar-wrapper">
        <form class="chat-input-bar glass-noise">
            <button type="button" class="icon-btn" title="Attach file">
                <i data-lucide="plus"></i>
            </button>
            <input type="text" id="chatInput" class="chat-input" placeholder="Ask anything. Images and documents work too..." autocomplete="off">
            <button type="button" class="icon-btn" title="Voice dictation">
                <i data-lucide="mic"></i>
            </button>
            <button type="submit" class="icon-btn send-btn" title="Send message">
                <i data-lucide="arrow-up"></i>
            </button>
        </form>
    </div>

    <script src="index.js"></script>
</body>
</html>

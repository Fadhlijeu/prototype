<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Input Bar — Glass Dark Premium (All-in-One)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-page: #08080C;
            --glass-card: rgba(255, 255, 255, 0.06);
            --glass-border-top: rgba(255, 255, 255, 0.24);
            --glass-border-side: rgba(255, 255, 255, 0.10);
            --glass-border-bottom: rgba(255, 255, 255, 0.04);
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.65);
            --text-muted: rgba(255, 255, 255, 0.38);
            --accent-blue-1: #4A7BF7;
            --accent-blue-2: #2E5FD9;
            --accent-blue-3: #1E3A8A;
            --ease-spring: cubic-bezier(0.34, 1.15, 0.64, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-page);
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            overflow-x: hidden;
        }

        .chat-bar-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
        }

        .chat-input-bar {
            position: relative;
            display: flex;
            align-items: center;
            height: 54px;
            padding: 4px 6px 4px 14px;
            gap: 8px;
            background: var(--glass-card);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border-radius: 28px;
            border: 1px solid transparent;
            border-top-color: var(--glass-border-top);
            border-left-color: var(--glass-border-side);
            border-right-color: var(--glass-border-side);
            border-bottom-color: var(--glass-border-bottom);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            overflow: hidden;
            width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .chat-input-bar:focus-within {
            border-color: rgba(74, 158, 255, 0.4);
            box-shadow: 0 0 0 3px rgba(74, 158, 255, 0.15), 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .chat-input-bar::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.038;
            mix-blend-mode: overlay;
            pointer-events: none;
            z-index: 0;
        }

        .chat-input {
            position: relative;
            z-index: 1;
            flex: 1;
            width: 0;
            min-width: 0;
            background: transparent;
            border: none;
            outline: none;
            color: #FFFFFF;
            font-size: 14px;
            font-family: inherit;
            padding: 0 4px;
        }

        .chat-input::placeholder {
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .icon-btn {
            position: relative;
            z-index: 1;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.10);
            color: var(--text-secondary);
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #FFFFFF;
            transform: scale(1.05);
        }

        .icon-btn svg {
            width: 17px;
            height: 17px;
            stroke-width: 1.5px;
        }

        .send-btn {
            background: linear-gradient(135deg, var(--accent-blue-1) 0%, var(--accent-blue-2) 50%, var(--accent-blue-3) 100%);
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            border-bottom: 1px solid rgba(0, 0, 0, 0.20);
            color: #FFFFFF;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
        }

        .send-btn:hover {
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
            transform: translateY(-1px);
        }

        @media (max-width: 360px) {
            .chat-input-bar {
                padding: 4px 6px 4px 8px;
                gap: 5px;
            }
            .icon-btn {
                width: 32px;
                height: 32px;
            }
            .chat-input {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="chat-bar-wrapper">
        <form class="chat-input-bar" onsubmit="event.preventDefault(); alert('Prompt sent: ' + document.getElementById('chatInput').value)">
            <button type="button" class="icon-btn" title="Attach file">
                <i data-lucide="plus"></i>
            </button>
            <input type="text" id="chatInput" class="chat-input" placeholder="Ask anything. Images and documents work too..." autocomplete="off">
            <button type="button" class="icon-btn" title="Voice dictation">
                <i data-lucide="mic"></i>
            </button>
            <button type="submit" class="icon-btn send-btn" title="Send message">
                <i data-lucide="arrow-up"></i>
            </button>
        </form>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>

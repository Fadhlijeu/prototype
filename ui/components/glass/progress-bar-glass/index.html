<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Glowing Progress Bar — Glass Dark Premium</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="progress-card">
        <div class="prog-head">
            <span class="prog-title">Cloud Storage Sync</span>
            <span class="prog-val">72%</span>
        </div>
        <div class="glass-track">
            <div class="glass-fill"></div>
        </div>
    </div>

    <script>
        if (window.lucide) window.lucide.createIcons();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Glowing Progress Bar — Glass Dark Premium (All-in-One)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
:root {
    --bg-page: #08080C;
    --glass-card: rgba(255, 255, 255, 0.06);
    --glass-card-hover: rgba(255, 255, 255, 0.09);
    --glass-border-top: rgba(255, 255, 255, 0.24);
    --glass-border-side: rgba(255, 255, 255, 0.10);
    --glass-border-bottom: rgba(255, 255, 255, 0.04);
    --text-primary: #FFFFFF;
    --text-secondary: rgba(255, 255, 255, 0.65);
    --text-muted: rgba(255, 255, 255, 0.38);
    --accent-cyan: #4A9EFF;
    --accent-blue-1: #4A7BF7;
    --accent-blue-2: #2E5FD9;
    --accent-blue-3: #1E3A8A;
    --accent-green: #10B981;
    --accent-amber: #F59E0B;
    --accent-red: #EF4444;
    --ease-spring: cubic-bezier(0.34, 1.15, 0.64, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background-color: var(--bg-page);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text-primary);
}


body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
}

.progress-card {
    width: 100%;
    max-width: 360px;
    padding: 18px 20px;
    border-radius: 20px;
    background: var(--glass-card);
    backdrop-filter: blur(20px);
    border: 1px solid transparent;
    border-top-color: var(--glass-border-top);
    border-left-color: var(--glass-border-side);
    border-right-color: var(--glass-border-side);
    border-bottom-color: var(--glass-border-bottom);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.prog-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
}

.prog-title { font-size: 13.5px; font-weight: 600; }
.prog-val { font-size: 12px; color: var(--accent-cyan); font-weight: 600; }

.glass-track {
    width: 100%;
    height: 10px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.1);
    overflow: hidden;
    position: relative;
}

.glass-fill {
    height: 100%;
    width: 72%;
    border-radius: 6px;
    background: linear-gradient(90deg, #4A7BF7 0%, #06B6D4 100%);
    box-shadow: 0 0 12px rgba(6, 182, 212, 0.5);
    transition: width 0.4s var(--ease-spring);
}

    </style>
</head>
<body>

    <div class="progress-card">
        <div class="prog-head">
            <span class="prog-title">Cloud Storage Sync</span>
            <span class="prog-val">72%</span>
        </div>
        <div class="glass-track">
            <div class="glass-fill"></div>
        </div>
    </div>

    <script>
        if (window.lucide) window.lucide.createIcons();
    </script>
    <script>

    </script>
</body>
</html>

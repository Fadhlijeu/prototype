<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thinking Effort Selector — Glass Dark Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="glass-card-wrapper">
        <div class="layer-2-glass" onclick="cycleEffort()">
            <div class="content">
                <div class="title-group">
                    <span class="title">Thinking Effort</span>
                    <span class="subtitle">Depth of multi-step reasoning</span>
                </div>
                <div class="right-group">
                    <span class="effort-badge" id="effortVal">High</span>
                    <i data-lucide="chevron-right" class="chevron"></i>
                </div>
            </div>
        </div>
    </div>

    
    <script src="index.js"></script>
</body>
</html>

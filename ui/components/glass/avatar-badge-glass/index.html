<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Avatar with Status Badge — Glass Dark Premium</title>
    <link rel="stylesheet" href="../css.css">
    <link rel="stylesheet" href="index.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="avatar-row">
        <div class="glass-avatar-wrap">
            <div class="glass-avatar">K3</div>
            <div class="avatar-badge online"></div>
        </div>
        <div class="glass-avatar-wrap">
            <div class="glass-avatar" style="background: linear-gradient(135deg, #06B6D4, #3B82F6);">SW</div>
            <div class="avatar-badge online"></div>
        </div>
        <div class="glass-avatar-wrap">
            <div class="glass-avatar" style="background: linear-gradient(135deg, #EC4899, #8B5CF6);">AG</div>
            <div class="avatar-badge busy"></div>
        </div>
    </div>

    <script>
        if (window.lucide) window.lucide.createIcons();
    </script>
</body>
</html>

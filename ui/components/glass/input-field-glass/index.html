<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Input Fields — Glass Dark Premium</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="form-group-wrap">
        <div class="glass-field">
            <i data-lucide="search"></i>
            <input type="text" class="glass-input" placeholder="Search components, tokens, or files...">
        </div>
        <div class="glass-field">
            <i data-lucide="mail"></i>
            <input type="email" class="glass-input" placeholder="Enter email address...">
        </div>
        <div class="glass-field">
            <i data-lucide="lock"></i>
            <input type="password" class="glass-input" placeholder="Enter secure password...">
        </div>
    </div>

    <script>
        if (window.lucide) window.lucide.createIcons();
    </script>
</body>
</html>

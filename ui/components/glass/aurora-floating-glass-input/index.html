<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Liquid Frosted Breadcrumb — Dark Glass</title>
    <link rel="stylesheet" href="../css.css">
    <link rel="stylesheet" href="index.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="component-canvas">
        <button type="button" class="glass-pill-widget" id="sample-pill-btn" aria-label="Aurora Floating Glass Input">
            <span class="glass-pill-icon"><i data-lucide="sparkles"></i></span>
            <span class="glass-pill-text">Aurora Floating Glass Input</span>
        </button>
    </div>

    <script>
        if (window.lucide) window.lucide.createIcons();
    </script>
    <script src="index.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Floating Glass Input — Dark Glass</title>
    <link rel="stylesheet" href="../css.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .component-canvas {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 240px;
            padding: 32px;
            background: var(--bg-main, #030712);
        }
        .glass-pill-widget {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            background: var(--glass-surface-1, rgba(255, 255, 255, 0.04));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border-specular, rgba(255, 255, 255, 0.12));
            border-radius: var(--radius-full, 9999px);
            color: var(--text-primary, #f9fafb);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }
        .glass-pill-widget:hover {
            transform: translateY(-2px);
            background: var(--glass-surface-2, rgba(255, 255, 255, 0.08));
            border-color: rgba(6, 182, 212, 0.45);
            box-shadow: 0 12px 36px rgba(6, 182, 212, 0.2);
        }
        .glass-pill-icon {
            color: var(--accent-cyan, #06b6d4);
            display: flex;
            align-items: center;
        }
        .glass-pill-text {
            font-family: var(--font-sans, system-ui);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.02em;
        }
        @media (prefers-reduced-motion: reduce) {
            .glass-pill-widget {
                transition: none !important;
                transform: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="component-canvas">
        <button type="button" class="glass-pill-widget" id="sample-pill-btn" aria-label="Aurora Floating Glass Input">
            <span class="glass-pill-icon"><i data-lucide="sparkles"></i></span>
            <span class="glass-pill-text">Aurora Floating Glass Input</span>
        </button>
    </div>

    <script id="component-manifest" type="application/json">
    {
        "title": "Aurora Floating Glass Input",
        "slug": "aurora-floating-glass-input",
        "category": "inputs",
        "badge": "Molecule",
        "variation": "aurora-gradient-glow",
        "tags": ["glass", "pill", "aurora", "interactive"]
    }
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) window.lucide.createIcons();
            const btn = document.getElementById('sample-pill-btn');
            if (btn) {
                btn.addEventListener('click', () => {
                    btn.classList.toggle('active');
                });
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox and Radio Controls — Raw Pure HTML</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
<div style="display: flex; flex-direction: column; gap: 10px;">
    <fieldset>
        <legend>Checkboxes</legend>
        <label><input type="checkbox" checked> Option A (checked)</label><br>
        <label><input type="checkbox"> Option B</label><br>
        <label><input type="checkbox" disabled> Option C (disabled)</label>
    </fieldset>
    <fieldset>
        <legend>Radio Group</legend>
        <label><input type="radio" name="r1" checked> Choice 1</label><br>
        <label><input type="radio" name="r1"> Choice 2</label><br>
        <label><input type="radio" name="r1"> Choice 3</label>
    </fieldset>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Table — Raw Pure HTML</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
<table style="width: 100%; border-collapse: collapse; font-size: 13px;">
    <thead>
        <tr style="background: #f0f0f0;">
            <th style="border: 1px solid #ccc; padding: 6px;">ID</th>
            <th style="border: 1px solid #ccc; padding: 6px;">Component</th>
            <th style="border: 1px solid #ccc; padding: 6px;">Category</th>
            <th style="border: 1px solid #ccc; padding: 6px;">Status</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td style="border: 1px solid #ccc; padding: 6px;">01</td>
            <td style="border: 1px solid #ccc; padding: 6px;">Button</td>
            <td style="border: 1px solid #ccc; padding: 6px;">Action</td>
            <td style="border: 1px solid #ccc; padding: 6px;">Stable</td>
        </tr>
        <tr>
            <td style="border: 1px solid #ccc; padding: 6px;">02</td>
            <td style="border: 1px solid #ccc; padding: 6px;">Input</td>
            <td style="border: 1px solid #ccc; padding: 6px;">Form</td>
            <td style="border: 1px solid #ccc; padding: 6px;">Stable</td>
        </tr>
    </tbody>
</table>
</body>
</html>

<body>
<div style="max-width: 340px;">
    <details>
        <summary>What is Design-Agnostic Taxonomy?</summary>
        <p style="margin: 8px 0 0; font-size: 13px; color: #555;">
            It separates semantic structure and interaction roles from specific visual themes (e.g. Glass, Neumorphism).
        </p>
    </details>
    <details style="margin-top: 8px;">
        <summary>Why Decompose into Folders?</summary>
        <p style="margin: 8px 0 0; font-size: 13px; color: #555;">
            To separate concerns into HTML structure, component CSS, and interactive JavaScript logic.
        </p>
    </details>
</div>

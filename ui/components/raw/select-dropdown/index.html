<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Dropdown — Raw Pure HTML</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
<div style="display: flex; flex-direction: column; gap: 10px; max-width: 300px;">
    <label>Standard Dropdown:
        <select>
            <option value="opt1">Option 1 - Glass Dark</option>
            <option value="opt2" selected>Option 2 - Raw HTML</option>
            <option value="opt3">Option 3 - Neumorphism</option>
        </select>
    </label>
    <label>Multiple Select:
        <select multiple size="3" style="width: 100%;">
            <option>Alpha</option>
            <option>Beta</option>
            <option>Gamma</option>
        </select>
    </label>
</div>
</body>
</html>

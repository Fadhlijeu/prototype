<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0E1017"/>
            <stop offset="100%" stop-color="#050608"/>
        </linearGradient>
        <linearGradient id="glassLayer1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.75"/>
        </linearGradient>
        <linearGradient id="glassLayer2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.8"/>
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>
    
    <!-- Background rounded tile -->
    <rect width="48" height="48" rx="13" fill="url(#bgGrad)"/>
    <rect width="46" height="46" x="1" y="1" rx="12" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    
    <!-- Ambient glow back layer -->
    <rect width="24" height="24" x="12" y="12" rx="7" fill="url(#glassLayer1)" opacity="0.4" filter="url(#glow)"/>
    
    <!-- Back glass slab -->
    <rect width="22" height="22" x="16" y="10" rx="6" fill="url(#glassLayer1)" opacity="0.75"/>
    <rect width="22" height="22" x="16" y="10" rx="6" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="0.8"/>

    <!-- Front glass slab (tilted/layered effect) -->
    <rect width="22" height="22" x="10" y="16" rx="6" fill="url(#glassLayer2)" opacity="0.85"/>
    <rect width="22" height="22" x="10" y="16" rx="6" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
    
    <!-- Specular light point on top left -->
    <circle cx="14" cy="20" r="1.5" fill="#FFFFFF" opacity="0.9"/>
</svg>
